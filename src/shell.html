<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F6FA">
<title>Depotfokus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap">
<style>

/* Depotfokus: Vision-Oberfläche mit echter Logik. Routen #heute #story #depot #pos #check #plan #liga #daten */
:root{
  --ground:#F5F6FA; --card:#FFFFFF; --line:#E3E5EE; --line-soft:#EEF0F6;
  --ink:#14172E; --ink-2:#4A5070; --ink-3:#6B7090;
  --night:#14172E; --night-2:#1E2242; --night-3:#2C3158; --night-line:#3A3F63; --night-text:#B9BED8; --night-text-2:#D7DAEC;
  --accent:#D6401C; --coral:#FF8A6B; --sun:#FFD66B;
  --pos-bg:#DDF4EC; --pos:#0B6E53; --warn-bg:#FFF1D6; --warn:#8A5200; --neg-bg:#FBE3E3; --neg:#A12F2F; --blue:#1F5FD1;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, Menlo, monospace;
  --s1:#2a78d6; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#4a3aa7; --s7:#008300;
  --on-ink:#FFFFFF; --line-strong:#D3D6E2; --hint-bg:#FFF8E0; --hint-line:#F2DE9B; --info-bg:#FFF3EE; --accent-soft:#FFD9CC;
  --blue-bg:#E6ECFA; --violet-bg:#F1E9FB; --violet:#6B3FA8; --shade:rgba(20,23,46,.10); --desk:#E7E9F1; --switch-on:#14172E;
  --sky1:#DCEBFF; --sky2:#FFF1E3; --hill1:#CFEFC7; --hill2:#BFE8B5; --grass:#8FD18A; --grass-edge:#6FB86A;
  color-scheme:light;
}
/* Dunkles Design: System-Einstellung, außer du wählst unter Daten & Import ausdrücklich Hell */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#10131F; --card:#1A1E30; --line:#2C3150; --line-soft:#23283F;
  --ink:#ECEEF7; --ink-2:#B4B9D3; --ink-3:#8F95B3;
  --night:#252A4A; --night-2:#2F355C; --night-3:#3A4170; --night-line:#4A5185;
  --accent:#FF7A55; --pos-bg:#123A30; --pos:#6FD8B2; --warn-bg:#3A2C10; --warn:#F2C062; --neg-bg:#3D1C20; --neg:#FF9C9C; --blue:#8DB0FF;
  --on-ink:#14172E; --line-strong:#3A4062; --hint-bg:#2B2614; --hint-line:#5A4A1E; --info-bg:#33201A; --accent-soft:#5A2A1C;
  --blue-bg:#1E2A4D; --violet-bg:#2C2245; --violet:#C6A8F2; --shade:rgba(255,255,255,.12); --desk:#0A0C15; --switch-on:#6FD8B2;
  --sky1:#141B3D; --sky2:#3A2D4A; --hill1:#22402C; --hill2:#2A4A33; --grass:#2F5A38; --grass-edge:#3E7048;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#10131F; --card:#1A1E30; --line:#2C3150; --line-soft:#23283F;
  --ink:#ECEEF7; --ink-2:#B4B9D3; --ink-3:#8F95B3;
  --night:#252A4A; --night-2:#2F355C; --night-3:#3A4170; --night-line:#4A5185;
  --accent:#FF7A55; --pos-bg:#123A30; --pos:#6FD8B2; --warn-bg:#3A2C10; --warn:#F2C062; --neg-bg:#3D1C20; --neg:#FF9C9C; --blue:#8DB0FF;
  --on-ink:#14172E; --line-strong:#3A4062; --hint-bg:#2B2614; --hint-line:#5A4A1E; --info-bg:#33201A; --accent-soft:#5A2A1C;
  --blue-bg:#1E2A4D; --violet-bg:#2C2245; --violet:#C6A8F2; --shade:rgba(255,255,255,.12); --desk:#0A0C15; --switch-on:#6FD8B2;
  --sky1:#141B3D; --sky2:#3A2D4A; --hill1:#22402C; --hill2:#2A4A33; --grass:#2F5A38; --grass-edge:#3E7048;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
h1,h2{margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--ground)}
@media (min-width:600px){body{background:var(--desk)}.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(20,23,46,.08)}}
.screen{padding:calc(18px + env(safe-area-inset-top,0px)) 20px 110px;display:flex;flex-direction:column;gap:14px;min-height:100vh;min-height:100dvh}
.screen.sub{padding-bottom:28px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.dark{background:var(--night);color:#fff;border-radius:18px;padding:16px 18px;border:0}
.dark .lbl{color:var(--night-text)}
.chip-demo{font-size:11px;font-weight:700;color:#14172E;background:var(--sun);border-radius:6px;padding:2px 7px;white-space:nowrap}
.big{font-family:var(--display);font-weight:800;letter-spacing:-.02em}
.h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.back{width:44px;height:44px;display:grid;place-items:center;margin-left:-12px;border:0;background:none;cursor:pointer;border-radius:12px}
.btn{min-height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15.5px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;padding:0 14px;text-align:center}
.btn.solid{background:var(--ink);color:var(--on-ink)}
.btn.light{background:#fff;color:#14172E;border-color:#fff}
.btn.ghost-dark{border-color:#4A5070;color:#fff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.pos{background:var(--pos-bg);color:var(--pos)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.neg{background:var(--neg-bg);color:var(--neg)}

/* Tab-Leiste */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tabs a[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs svg{width:22px;height:22px}

/* Heute */
.stories{display:flex;gap:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.story-b{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;flex:none}
.ring{padding:3px;border-radius:50%;border:2.5px solid var(--accent);display:grid}
.ring.seen{border-color:var(--line-strong)}
.av{width:54px;height:54px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:14px}
.story-b span.n{font-size:12px;font-weight:600;color:var(--ink-2)}
.change{display:flex;flex-direction:column;gap:4px;min-height:44px}
.change .t{font-weight:700;font-size:15px}
.change .d{font-size:13.5px;color:var(--ink-2)}

/* Story */
.story{background:var(--night);color:#fff;min-height:100vh;min-height:100dvh;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 28px;display:flex;flex-direction:column;gap:18px}
.prog{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.prog span{position:relative;height:3px;border-radius:2px;background:var(--night-line);overflow:hidden}
.prog span i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff}
.prog span.done i{width:100%}
.prog span.cur i{animation:storyfill linear forwards}
@keyframes storyfill{from{width:0}to{width:100%}}
.story.paused .prog span.cur i{animation-play-state:paused}
.story.manual .prog span.cur i{animation:none;width:100%}
.story-stage{position:relative;flex:1;display:flex;flex-direction:column;gap:10px;margin-top:6px;min-height:260px}
.tap{position:absolute;top:0;bottom:0;z-index:2;background:transparent;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tap.prev{left:-20px;width:35%}.tap.next{right:-20px;width:calc(65% + 20px)}
.tap:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.story{user-select:none;-webkit-user-select:none}
.story-hint{margin:0;font-size:12.5px;color:var(--night-text-2);background:var(--night-2);border-radius:10px;padding:8px 10px}
.stand-t{display:flex;flex-direction:column;gap:6px}
.stand-l{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;min-height:28px}
.stand-l .muted2{font-size:12.5px}
.stand-up{display:flex;flex-direction:column;gap:1px;padding:7px 0;border-top:1px solid var(--line-soft)}
.dot.ok{background:var(--pos)}.dot.warn{background:#E0A100}.dot.man{background:var(--blue)}.dot.off{background:var(--line-strong)}
.mode{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.mode.auto{background:var(--pos-bg);color:var(--pos)}.mode.man{background:var(--blue-bg);color:var(--blue)}.mode.off{background:var(--line-soft);color:var(--ink-3)}.mode.dev{background:var(--violet-bg);color:var(--violet)}
.tag.new{background:var(--accent);color:#fff}
.ring.fresh{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.banner.info{background:var(--info-bg);color:var(--ink)}.banner.info b{color:var(--accent)}
.story-link{position:relative;z-index:3;align-self:flex-start;display:inline-flex;gap:6px;align-items:center;color:#fff;font-weight:700;font-size:14px;border:1.5px solid #4A5070;border-radius:99px;padding:8px 14px;min-height:40px}
.quote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--line);color:var(--ink-2);font-size:12.5px;font-style:italic}
.stadt{padding:12px 0 10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.stadt>.row,.stadt>.hint,.stadt>.prof-ask,.stadt>#stadtRange,.stadt>.small{margin:0 14px}
.stadt-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.stadt-scroll::-webkit-scrollbar{display:none}
.stadt-svg{display:block}
.haus{cursor:pointer;transition:transform .15s}.haus:focus-visible{outline:none}.haus:focus-visible rect:first-of-type{stroke:var(--blue);stroke-width:3}
.hlab{font-family:var(--body);font-size:11px;font-weight:700;fill:var(--ink)}
#stadtRange{accent-color:var(--accent);min-height:36px;width:calc(100% - 28px)}
.prof-ask{display:flex;flex-direction:column;gap:8px;background:var(--hint-bg);border:1px solid var(--hint-line);border-radius:14px;padding:12px}
.prof-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.prof-grid button{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;padding:10px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:13px;cursor:pointer;text-align:center}
.prof-grid .pe{font-size:28px;line-height:1}
.hero-why{grid-column:1/-1}
.haus-hero{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;align-items:end;background:linear-gradient(var(--sky1),var(--sky2));border-radius:18px;padding:10px 14px 14px;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{min-height:40px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line-strong);background:var(--card);font-weight:600;font-size:13px;cursor:pointer}
.mchip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.piece{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;background:var(--ground);border-radius:12px;padding:10px 12px;font-size:14px}
.piece .pe{font-size:26px;text-align:center}
.flow2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:13.5px}
.fbar{height:14px;background:var(--line-soft);border-radius:7px;overflow:hidden;display:block}.fbar i{display:block;height:100%;border-radius:7px}
.trend{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line-soft)}
.trend .te{font-size:20px;line-height:1.2}
.why-line{gap:8px;flex-wrap:wrap;padding:10px 14px;font-size:14px}
.zteaser{display:flex;align-items:center;justify-content:space-between;gap:12px}
.zspark{width:64px;height:40px;flex:none}
.zchart{touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.zchart svg{display:block;overflow:visible}
.zgrid{stroke:var(--line-soft);stroke-width:1}.zax{font-size:10px;fill:var(--ink-3);font-family:var(--mono)}
.zband{fill:var(--pos-bg)}.zmid{fill:none;stroke:var(--pos);stroke-width:2.5;stroke-linejoin:round}
.zcur{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}.zdot{fill:var(--ink);stroke:var(--card);stroke-width:2}
#zRange{width:100%;accent-color:var(--ink);min-height:36px}
.zcols{display:flex;align-items:flex-end;gap:4px;height:190px;overflow-x:auto;padding-top:4px}
.zcol{flex:1 0 20px;min-width:20px;max-width:44px;height:100%;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer}
.zcol .zv{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);height:12px}
.zbar{position:relative;flex:1;width:100%;border-radius:6px 6px 2px 2px;background:transparent}
.zbar i{position:absolute;left:0;right:0;border-radius:6px 6px 2px 2px}
.zfill{bottom:0;transition:height .12s ease-out}.zwh{background:var(--shade);border-radius:4px;transition:all .12s ease-out}
.zcol .zlab{font-family:var(--mono);font-size:10px;color:var(--ink-2);height:14px;white-space:nowrap}
.zcol.on .zlab{color:var(--accent);font-weight:700}.zcol.on .zfill{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.zcut{color:var(--neg);font-weight:700}
.zcutrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.zcutname{grid-column:1/-1}.zcutrow select{width:100%}
.zcutrow select{min-height:40px;font-size:13px;padding:0 6px}
.zass{display:grid;grid-template-columns:minmax(0,1fr) 62px 52px 62px;gap:6px;align-items:center}
.zass .numin{width:100%;min-height:40px;padding:0 6px}
.ztip{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:center}
.ztip input[type=range]{writing-mode:vertical-lr;direction:rtl;width:40px;height:160px;accent-color:var(--accent);margin:0 auto}
.flow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.card h2+.flow{border-top:0}
.flow .n{width:28px;height:28px;border-radius:8px;background:var(--night);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12px}
.barrow{display:flex;flex-direction:column;gap:6px}
.track{height:14px;border-radius:7px;background:var(--night-3)}
.fill{height:100%;border-radius:7px}
.bubble{background:var(--card);color:var(--ink);border-radius:18px 18px 18px 6px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}

/* Kompass */
.prob{display:flex;height:42px;border-radius:10px;overflow:hidden;gap:3px}
.prob div{display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.trust{display:flex;gap:10px;align-items:center;background:var(--ground);border-radius:12px;padding:10px 12px}
.pc{display:flex;flex-direction:column;gap:8px}
.pc li{font-size:13px;line-height:1.35;list-style:none}
.pc ul{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

/* Check */
.step{display:flex;gap:12px}
.num-c{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.reasons{display:flex;flex-wrap:wrap;gap:8px}
.reasons button{min-height:44px;padding:0 14px;border-radius:99px;font-size:13.5px;font-weight:600;cursor:pointer;border:1.5px solid var(--line-strong);background:var(--card)}
.reasons button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.meter{display:flex;gap:4px}
.meter span{width:12px;height:28px;border-radius:4px;background:var(--night-line)}
.meter span.on{background:#7DDBB8}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-weight:600;cursor:pointer}
.switch input{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked{background:var(--switch-on)}
.switch input:checked::after{left:23px}

/* Liga */
.yn button{min-height:48px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;background:transparent;color:#fff;border:1.5px solid #4A5070}
.yn button[aria-pressed="true"]{background:#fff;color:#14172E;border-color:#fff}
.conf-g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.conf-g button{min-height:44px;border-radius:10px;font-family:var(--mono);font-size:13px;cursor:pointer;background:var(--night-2);color:#fff;border:0}
.conf-g button[aria-pressed="true"]{background:var(--coral);color:#14172E}
.board{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:42px;border-bottom:1px solid var(--line-soft)}
.board:last-of-type{border-bottom:0}

/* Kulissen */
.steps .s{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.steps .s:last-child{border-bottom:0}
.steps .n{width:32px;height:32px;border-radius:9px;background:var(--night);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Umsätze, Rendite, Liga */
.dayline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:15px;margin-top:-2px}
.perf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border-top:1px solid var(--night-line);padding-top:10px;margin-top:4px;font-size:15px}
.up{color:#7DDBB8}.down{color:#FF9C9C}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;background:var(--ground);border-radius:12px;padding:10px 12px}
.kpi .num{font-size:16px}
.res{align-self:flex-start;font-weight:800;border-radius:99px;padding:4px 12px;font-size:14px}
.res.hit{background:#7DDBB8;color:#14172E}.res.miss{background:#FF9C9C;color:#14172E}
.light-q{display:flex;flex-direction:column;gap:8px}
.light-q .yn button{color:var(--ink);border-color:var(--line-strong);background:var(--card)}
.light-q .yn button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.light-q .conf-g button{background:var(--ground);color:var(--ink)}
.light-q .conf-g button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.yn button:disabled,.conf-g button:disabled{opacity:.55;cursor:default}
.steps-list{margin:6px 0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.kv dd.pos-text,.kv dd.neg-text{font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Zusammenführung: Bausteine aus App und Vision */
.col{display:flex;flex-direction:column}
.small{font-size:13px}.strong{font-weight:700}.center{text-align:center}
.muted2{color:var(--ink-2)}.muted-night{color:var(--night-text-2)}
.pos-text{color:var(--pos)}.neg-text{color:var(--neg)}.warn-text{color:var(--warn);font-weight:700;font-size:13px}.dark .warn-text{color:var(--sun)}.sun-text{color:var(--sun)}
.h2,.card h2{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em;margin:0 0 6px}
.h3,.card h3{font-family:var(--display);font-weight:800;font-size:17px;margin:10px 0 4px}
.card>p+p{margin-top:6px}
.lead{font-size:16px;line-height:1.45}
.hint{font-size:12.5px;color:var(--ink-3)}
.hint-box{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 10px}
.empty{background:var(--ground);border:1px dashed var(--line-strong);border-radius:12px;padding:12px;font-size:13.5px;color:var(--ink-2)}
.banner{display:flex;flex-direction:column;gap:2px;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:13.5px}
.demo-bar{display:flex;gap:10px;align-items:center;background:var(--hint-bg);border:1px solid var(--hint-line);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.chip-btn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 12px;min-height:44px;font-weight:700;font-size:13px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none;border:0;background:none;cursor:pointer}
.icon-btn.night{color:#fff}
.chip-soon{font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-bg);border-radius:6px;padding:2px 7px}
.lbl.night{color:var(--night-text)}
.av.light{background:#fff;color:#14172E;flex:none}
.story-h{font-size:26px;line-height:1.2;font-weight:600}
.story-box{display:flex;flex-direction:column;gap:6px;background:var(--night-2);border-radius:14px;padding:12px 14px}
.story .btn:disabled{opacity:.35;cursor:default}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.card .btn{min-height:46px;font-size:14.5px}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tag.neutral{background:var(--line-soft);color:var(--ink-2)}
.mood{font-weight:700}.mood.pos{color:var(--pos)}.mood.warn{color:var(--warn)}.mood.neg{color:var(--neg)}.mood.neutral{color:var(--ink-3)}
.kind{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-right:6px}
.kind.metric{background:var(--blue-bg);color:var(--blue)}.kind.company{background:var(--line-soft);color:var(--ink-2)}.kind.interp{background:var(--violet-bg);color:var(--violet)}
.st{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;flex:none}
.st.yes{background:var(--pos-bg);color:var(--pos)}.st.no{background:var(--neg-bg);color:var(--neg)}.st.open{background:var(--warn-bg);color:var(--warn)}.st.np{background:var(--line-soft);color:var(--ink-3)}
.item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line-soft)}
.card h2+.item{border-top:0}
.mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px}
.mark.crit{background:var(--neg-bg);color:var(--neg)}.mark.warn{background:var(--warn-bg);color:var(--warn)}.mark.info{background:var(--blue-bg);color:var(--blue)}.mark.good{background:var(--pos-bg);color:var(--pos)}.mark.na{background:var(--line-soft);color:var(--ink-3)}
details summary{cursor:pointer;font-size:13px;color:var(--blue);font-weight:600;min-height:28px;display:flex;align-items:center}
details.card summary{font-size:15px;color:var(--ink);min-height:36px}
.grph{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;color:var(--ink-2);padding:12px 0 4px;border-top:1px solid var(--line-soft)}
.card h2+.grph{border-top:0;padding-top:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;min-height:44px}
.prow .nm{font-weight:600}.prow .r{text-align:right}.prow .sub{grid-column:1/-1;font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow:hover .nm{color:var(--accent)}
.fact,.rule{padding:10px 0;border-top:1px solid var(--line-soft);font-size:14px;display:flex;flex-direction:column;gap:4px}
.card h2+.fact,.card h2+.rule{border-top:0}
.fact .kind{align-self:flex-start}
.src{font-size:12px;color:var(--ink-3)}a.src{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
.story .src{color:var(--night-text)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:8px 0;font-size:13px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.goal{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.goal .err{grid-column:2/-1}
.numin{width:76px;min-height:44px;border:1.5px solid var(--line-strong);border-radius:10px;padding:0 10px;font:inherit;font-family:var(--mono);text-align:right;background:var(--card);color:var(--ink)}
.numin[aria-invalid="true"]{border-color:var(--neg);background:var(--neg-bg)}
select{min-height:44px;border:1.5px solid var(--line-strong);border-radius:10px;padding:0 10px;font:inherit;background:var(--card);color:var(--ink);max-width:100%}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.field .numin{width:100%}
.err{font-size:12.5px;color:var(--neg);font-weight:600}.err:empty{display:none}
.alloc{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.alloc .why{grid-column:2/-1;font-size:12.5px;color:var(--ink-3)}
.result{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;background:var(--ground);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px}
.bars{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.barlab{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center;font-size:12px;color:var(--ink-3)}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line-soft)}
.bar span{height:100%}
.c1{background:var(--pos-bg);color:var(--pos)}.c2{background:var(--warn-bg);color:var(--warn)}.c3{background:var(--blue-bg);color:var(--blue)}.c4{background:var(--violet-bg);color:var(--violet)}
.stage{display:flex;flex-direction:column;gap:10px;margin-top:12px;background:var(--ground);border-radius:14px;padding:12px}
.ok{color:var(--pos);font-weight:700}.bad{color:var(--neg);font-weight:700}
.conf{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line-soft)}
.card h2+.conf{border-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card .row{flex-wrap:wrap}

/* Dividendenkalender */
.kbars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;align-items:end;margin-top:4px}
.kbars button{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:96px;background:none;border:0;padding:0;color:var(--night-text);font-size:10px;font-family:var(--mono);cursor:pointer;min-width:0}
.kbars i{display:block;width:100%;max-width:22px;border-radius:4px 4px 2px 2px;background:#7DDBB8}
.kbars button.now i{background:var(--coral)}.kbars button.now{color:#fff}
.kbars .kv0{font-size:9px;height:11px;color:var(--night-text-2)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:none;font-weight:700;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shade)}
.kmon{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--display);font-weight:800;font-size:17px;margin:6px 2px -4px;scroll-margin-top:16px}
.kmon .num{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink-2)}
.card.krow{padding:0}
details.krow summary{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;min-height:64px;list-style:none;color:var(--ink);font-size:14px;font-weight:400}
details.krow summary::-webkit-details-marker{display:none}
.krow .kav{width:40px;height:40px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12px}
.krow .kn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.krow .kamt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.krow.est{border-style:dashed;border-color:var(--line-strong)}
.krow[open] summary{border-bottom:1px solid var(--line-soft)}
.kdet{padding:2px 14px 12px;display:flex;flex-direction:column;gap:6px}
.theme-seg{grid-template-columns:repeat(3,minmax(0,1fr))}
/* Wirtschaft & Szenarien: feste Farben je Szenario (A blau, B grün, C rot-orange), in Hell und Dunkel lesbar */
:root{--sc-a:#2a6fd6;--sc-b:#14966a;--sc-c:#d2501f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sc-a:#78a6ff;--sc-b:#4fd1a1;--sc-c:#ff8a5c}}
:root[data-theme="dark"]{--sc-a:#78a6ff;--sc-b:#4fd1a1;--sc-c:#ff8a5c}
.sc-good{color:var(--pos);font-weight:700}.sc-bad{color:var(--neg);font-weight:700}.sc-flat{color:var(--ink-2);font-weight:700}
.sc-mini{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}.sc-mini i{display:block;height:100%}
.sc-pct{font-size:30px;line-height:1;white-space:nowrap}
.sc-bar{position:relative;display:block;height:10px;border-radius:5px;background:var(--line-soft)}
.sc-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.sc-bar b{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink)}
.sc-row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line-soft)}
.sc-ul{margin:2px 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.sc-drv.agt{color:var(--ink-2)}
.sc-drvbox{padding-top:8px;border-top:1px solid var(--line-soft)}
.sc-seg{grid-template-columns:repeat(4,minmax(0,1fr))}
.sc-chart{display:block;overflow:visible;touch-action:pan-y}
.sc-legend{flex-wrap:wrap}
.sc-weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.sc-weeks .mchip{flex:none}
.sc-grp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 0;border-top:1px solid var(--line-soft)}
.sc-grp .sc-sig{grid-column:1/-1}
.sc-sig{position:relative;display:block;height:8px;border-radius:4px;background:var(--line-soft);margin:2px 0}
.sc-sig i{position:absolute;top:0;bottom:0;border-radius:4px}.sc-sig i.up{background:var(--pos)}.sc-sig i.dn{background:var(--neg)}
.sc-sig b{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--ink-3)}
.sc-sig.na{background:none;height:auto}
.sc-inp{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line-soft)}
.sc-ret .numin{width:72px}
/* Bereichs-Navigation (Einkommen, Welt): Segmente oben, wie iOS-Segmented-Control / Material-Tabs */
.hubseg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--line-soft);border-radius:12px;padding:4px;gap:4px}
.hubseg a{min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-2)}
.hubseg a[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shade)}
.tbadge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.view-seg{grid-template-columns:1fr 1fr}
/* Nachrichten */
.news-title{font-size:16px;line-height:1.3}
.news-facts li{margin-bottom:6px}
.gl{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:1.5px dotted var(--blue);cursor:pointer}
.gl[aria-expanded="true"]{color:var(--blue)}
.gl-box{background:var(--blue-bg);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13.5px}
.nowrap{white-space:nowrap;margin-right:8px}
a.src,.news-card,.kv dd,.quote{overflow-wrap:anywhere}
article.col{min-width:0}
/* Netto/Brutto-Umschalter im Dividendenkalender (auf dunkler Karte) */
.kmode{display:inline-flex;background:var(--night-2);border-radius:99px;padding:3px;gap:2px}
.kmode button{min-height:32px;min-width:64px;border:0;border-radius:99px;background:none;color:var(--night-text);font-weight:700;font-size:12.5px;cursor:pointer}
.kmode button[aria-pressed="true"]{background:#fff;color:#14172E}
