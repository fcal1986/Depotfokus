<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F6FA">
<title>Depotfokus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap">
<style>

/* Depotfokus: Vision-Oberfläche mit echter Logik. Routen #heute #story #depot #pos #check #plan #liga #daten */
:root{
  --ground:#F5F6FA; --card:#FFFFFF; --line:#E3E5EE; --line-soft:#EEF0F6;
  --ink:#14172E; --ink-2:#4A5070; --ink-3:#6B7090;
  --night:#14172E; --night-2:#1E2242; --night-3:#2C3158; --night-line:#3A3F63; --night-text:#B9BED8; --night-text-2:#D7DAEC;
  --accent:#D6401C; --coral:#FF8A6B; --sun:#FFD66B;
  --pos-bg:#DDF4EC; --pos:#0B6E53; --warn-bg:#FFF1D6; --warn:#8A5200; --neg-bg:#FBE3E3; --neg:#A12F2F; --blue:#1F5FD1;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, Menlo, monospace;
  --s1:#2a78d6; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#4a3aa7; --s7:#008300;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
h1,h2{margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--ground)}
@media (min-width:600px){body{background:#E7E9F1}.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(20,23,46,.08)}}
.screen{padding:calc(18px + env(safe-area-inset-top,0px)) 20px 110px;display:flex;flex-direction:column;gap:14px;min-height:100vh;min-height:100dvh}
.screen.sub{padding-bottom:28px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.dark{background:var(--night);color:#fff;border-radius:18px;padding:16px 18px;border:0}
.dark .lbl{color:var(--night-text)}
.chip-demo{font-size:11px;font-weight:700;color:var(--ink);background:var(--sun);border-radius:6px;padding:2px 7px;white-space:nowrap}
.big{font-family:var(--display);font-weight:800;letter-spacing:-.02em}
.h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.back{width:44px;height:44px;display:grid;place-items:center;margin-left:-12px;border:0;background:none;cursor:pointer;border-radius:12px}
.btn{min-height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15.5px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;padding:0 14px;text-align:center}
.btn.solid{background:var(--ink);color:#fff}
.btn.light{background:#fff;color:var(--ink);border-color:#fff}
.btn.ghost-dark{border-color:#4A5070;color:#fff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.pos{background:var(--pos-bg);color:var(--pos)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.neg{background:var(--neg-bg);color:var(--neg)}

/* Tab-Leiste */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tabs a[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs svg{width:22px;height:22px}

/* Heute */
.stories{display:flex;gap:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.story-b{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;flex:none}
.ring{padding:3px;border-radius:50%;border:2.5px solid var(--accent);display:grid}
.ring.seen{border-color:#D3D6E2}
.av{width:54px;height:54px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:14px}
.story-b span.n{font-size:12px;font-weight:600;color:var(--ink-2)}
.change{display:flex;flex-direction:column;gap:4px;min-height:44px}
.change .t{font-weight:700;font-size:15px}
.change .d{font-size:13.5px;color:var(--ink-2)}

/* Story */
.story{background:var(--night);color:#fff;min-height:100vh;min-height:100dvh;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 28px;display:flex;flex-direction:column;gap:18px}
.prog{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px}
.prog span{height:4px;border-radius:2px;background:var(--night-line)}
.prog span.on{background:#fff}
.barrow{display:flex;flex-direction:column;gap:6px}
.track{height:14px;border-radius:7px;background:var(--night-3)}
.fill{height:100%;border-radius:7px}
.bubble{background:#fff;color:var(--ink);border-radius:18px 18px 18px 6px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}

/* Kompass */
.prob{display:flex;height:42px;border-radius:10px;overflow:hidden;gap:3px}
.prob div{display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.trust{display:flex;gap:10px;align-items:center;background:var(--ground);border-radius:12px;padding:10px 12px}
.pc{display:flex;flex-direction:column;gap:8px}
.pc li{font-size:13px;line-height:1.35;list-style:none}
.pc ul{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

/* Check */
.step{display:flex;gap:12px}
.num-c{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.reasons{display:flex;flex-wrap:wrap;gap:8px}
.reasons button{min-height:44px;padding:0 14px;border-radius:99px;font-size:13.5px;font-weight:600;cursor:pointer;border:1.5px solid #D3D6E2;background:#fff}
.reasons button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.meter{display:flex;gap:4px}
.meter span{width:12px;height:28px;border-radius:4px;background:var(--night-line)}
.meter span.on{background:#7DDBB8}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-weight:600;cursor:pointer}
.switch input{appearance:none;width:50px;height:30px;border-radius:15px;background:#D3D6E2;position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked{background:var(--ink)}
.switch input:checked::after{left:23px}

/* Liga */
.yn button{min-height:48px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;background:transparent;color:#fff;border:1.5px solid #4A5070}
.yn button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}
.conf-g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.conf-g button{min-height:44px;border-radius:10px;font-family:var(--mono);font-size:13px;cursor:pointer;background:var(--night-2);color:#fff;border:0}
.conf-g button[aria-pressed="true"]{background:var(--coral);color:var(--ink)}
.board{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:42px;border-bottom:1px solid var(--line-soft)}
.board:last-of-type{border-bottom:0}

/* Kulissen */
.steps .s{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.steps .s:last-child{border-bottom:0}
.steps .n{width:32px;height:32px;border-radius:9px;background:var(--night);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Zusammenführung: Bausteine aus App und Vision */
.col{display:flex;flex-direction:column}
.small{font-size:13px}.strong{font-weight:700}.center{text-align:center}
.muted2{color:var(--ink-2)}.muted-night{color:var(--night-text-2)}
.pos-text{color:var(--pos)}.neg-text{color:var(--neg)}.warn-text{color:var(--warn);font-weight:700;font-size:13px}.dark .warn-text{color:var(--sun)}.sun-text{color:var(--sun)}
.h2,.card h2{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em;margin:0 0 6px}
.h3,.card h3{font-family:var(--display);font-weight:800;font-size:17px;margin:10px 0 4px}
.card>p+p{margin-top:6px}
.lead{font-size:16px;line-height:1.45}
.hint{font-size:12.5px;color:var(--ink-3)}
.hint-box{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 10px}
.empty{background:var(--ground);border:1px dashed #C9CDDA;border-radius:12px;padding:12px;font-size:13.5px;color:var(--ink-2)}
.banner{display:flex;flex-direction:column;gap:2px;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:13.5px}
.demo-bar{display:flex;gap:10px;align-items:center;background:#FFF8E0;border:1px solid #F2DE9B;border-radius:14px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.chip-btn{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 12px;min-height:44px;font-weight:700;font-size:13px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none;border:0;background:none;cursor:pointer}
.icon-btn.night{color:#fff}
.chip-soon{font-size:11px;font-weight:700;color:var(--blue);background:#E6ECFA;border-radius:6px;padding:2px 7px}
.lbl.night{color:var(--night-text)}
.av.light{background:#fff;color:var(--ink);flex:none}
.story-h{font-size:26px;line-height:1.2;font-weight:600}
.story-box{display:flex;flex-direction:column;gap:6px;background:var(--night-2);border-radius:14px;padding:12px 14px}
.story .btn:disabled{opacity:.35;cursor:default}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);color:#fff}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.card .btn{min-height:46px;font-size:14.5px}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.tag.neutral{background:var(--line-soft);color:var(--ink-2)}
.mood{font-weight:700}.mood.pos{color:var(--pos)}.mood.warn{color:var(--warn)}.mood.neg{color:var(--neg)}.mood.neutral{color:var(--ink-3)}
.kind{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-right:6px}
.kind.metric{background:#E6ECFA;color:var(--blue)}.kind.company{background:var(--line-soft);color:var(--ink-2)}.kind.interp{background:#F1E9FB;color:#6B3FA8}
.st{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;flex:none}
.st.yes{background:var(--pos-bg);color:var(--pos)}.st.no{background:var(--neg-bg);color:var(--neg)}.st.open{background:var(--warn-bg);color:var(--warn)}.st.np{background:var(--line-soft);color:var(--ink-3)}
.item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line-soft)}
.card h2+.item{border-top:0}
.mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px}
.mark.crit{background:var(--neg-bg);color:var(--neg)}.mark.warn{background:var(--warn-bg);color:var(--warn)}.mark.info{background:#E6ECFA;color:var(--blue)}.mark.good{background:var(--pos-bg);color:var(--pos)}.mark.na{background:var(--line-soft);color:var(--ink-3)}
details summary{cursor:pointer;font-size:13px;color:var(--blue);font-weight:600;min-height:28px;display:flex;align-items:center}
details.card summary{font-size:15px;color:var(--ink);min-height:36px}
.grph{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;color:var(--ink-2);padding:12px 0 4px;border-top:1px solid var(--line-soft)}
.card h2+.grph{border-top:0;padding-top:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;min-height:44px}
.prow .nm{font-weight:600}.prow .r{text-align:right}.prow .sub{grid-column:1/-1;font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow:hover .nm{color:var(--accent)}
.fact,.rule{padding:10px 0;border-top:1px solid var(--line-soft);font-size:14px;display:flex;flex-direction:column;gap:4px}
.card h2+.fact,.card h2+.rule{border-top:0}
.fact .kind{align-self:flex-start}
.src{font-size:12px;color:var(--ink-3)}a.src{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
.story .src{color:var(--night-text)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:8px 0;font-size:13px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.goal{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.goal .err{grid-column:2/-1}
.numin{width:76px;min-height:44px;border:1.5px solid #C9CDDA;border-radius:10px;padding:0 10px;font:inherit;font-family:var(--mono);text-align:right;background:#fff;color:var(--ink)}
.numin[aria-invalid="true"]{border-color:var(--neg);background:var(--neg-bg)}
select{min-height:44px;border:1.5px solid #C9CDDA;border-radius:10px;padding:0 10px;font:inherit;background:#fff;color:var(--ink);max-width:100%}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
.field .numin{width:100%}
.err{font-size:12.5px;color:var(--neg);font-weight:600}.err:empty{display:none}
.alloc{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.alloc .why{grid-column:2/-1;font-size:12.5px;color:var(--ink-3)}
.result{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;background:var(--ground);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px}
.bars{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.barlab{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center;font-size:12px;color:var(--ink-3)}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line-soft)}
.bar span{height:100%}
.c1{background:var(--pos-bg);color:var(--pos)}.c2{background:var(--warn-bg);color:var(--warn)}.c3{background:#E6ECFA;color:var(--blue)}.c4{background:#F1E9FB;color:#6B3FA8}
.stage{display:flex;flex-direction:column;gap:10px;margin-top:12px;background:var(--ground);border-radius:14px;padding:12px}
.ok{color:var(--pos);font-weight:700}.bad{color:var(--neg);font-weight:700}
.conf{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line-soft)}
.card h2+.conf{border-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card .row{flex-wrap:wrap}

</style>
</head>

<div class="app">
<main id="view" class="screen"></main>

function parseNum(s){s=String(s??'').replace(/["€\s ]|EUR/gi,'');if(!s)return NaN;if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(s.includes(','))s=s.replace(',','.');if(!/^-?\d*\.?\d+(e-?\d+)?$/i.test(s))return NaN;return parseFloat(s)}

/* =========================================================
   CSV-PARSER (prüft zuerst, übernimmt nichts)
   ========================================================= */
function splitL(l,d){const o=[];let c='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===d&&!q){o.push(c);c='';continue}c+=ch}o.push(c);return o.map(x=>x.trim())}
function analyzeCSV(text,fileName){
  const st={fileName,error:null,cols:{},positions:[],accounts:[],skipped:[],fileSum:null,kind:'holdings'};
  const lines=String(text||'').replace(/^﻿/,'').split(/\r?\n/);
  const nonEmpty=lines.map((l,i)=>({l,i:i+1})).filter(x=>x.l.trim());
  if(nonEmpty.length<2){st.error='Die Datei enthält keine Kopfzeile mit Daten.';return st}
  const h=nonEmpty[0].l;const d=[';','\t',','].sort((a,b)=>h.split(b).length-h.split(a).length)[0];
  const head=splitL(h,d);const low=head.map(x=>x.toLowerCase());const col=re=>low.findIndex(x=>re.test(x));
  if(col(/^datum|^date/)>=0&&col(/^typ|^type/)>=0){st.kind='transactions';st.error='Das ist ein Umsatz-Export. Umsätze kann Depotfokus noch nicht verarbeiten; dein Bestand bleibt unverändert.';return st}
  const ci={name:col(/^name$|bezeichnung|wertpapier/),value:col(/marktwert|kurswert|^wert$/),qty:col(/^bestand|stück|anzahl|shares/),symbol:col(/symbol|ticker/),price:col(/^kurs$|preis|price/),isin:col(/isin/)};
  Object.entries(ci).forEach(([k,i])=>{if(i>=0)st.cols[k]=head[i]});
  if(ci.name<0||ci.value<0){st.error='Spalten „Name“ und „Marktwert“ nicht gefunden. Erwartet wird die Vermögensaufstellung aus Portfolio Performance.';return st}
  nonEmpty.slice(1).forEach(({l,i})=>{
    const r=splitL(l,d);const name=(r[ci.name]||'').trim();const v=parseNum(r[ci.value]);
    if(!name){st.skipped.push({line:i,reason:'kein Name'});return}
    if(/^summe|^gesamt|^total/i.test(name)){if(Number.isFinite(v)&&st.fileSum==null)st.fileSum=v;st.skipped.push({line:i,reason:`Summenzeile „${name}“`});return}
    if(!Number.isFinite(v)){st.skipped.push({line:i,reason:`„${name}“: Marktwert nicht lesbar`});return}
    if(v<0){st.skipped.push({line:i,reason:`„${name}“: negativer Marktwert`});return}
    const qty=ci.qty>=0?parseNum(r[ci.qty]):NaN,sym=ci.symbol>=0?(r[ci.symbol]||'').trim():'',price=ci.price>=0?parseNum(r[ci.price]):NaN,isin=ci.isin>=0?(r[ci.isin]||'').trim():'';
    if(!Number.isFinite(qty)&&!sym&&!isin){st.accounts.push({name,value:v,line:i,accept:false});return}
    const m=STAMM[sym]||null;
    /* Kurswährung: deutscher Börsenplatz (.DE/.F) → Euro; sonst unbekannt */
    const priceCcy=/\.(DE|F|DU|MU|HM|SG|BE)$/i.test(sym)?'EUR':null;
    st.positions.push({id:sym||isin||name,name,symbol:sym,isin:isin||null,qty:Number.isFinite(qty)?qty:null,price:Number.isFinite(price)?price:null,priceCcy,
      exportValue:v,valueStatus:priceCcy?'ok':'unclear',conf:null,manualValue:null,bucket:m?m.bucket:null,bucketSrc:m?'stamm':null,fund:m?m.fund:null,ter:m&&m.ter!=null?m.ter:null});
  });
  if(!st.positions.length&&!st.accounts.length)st.error='Keine gültigen Zeilen gefunden. Prüfe, ob die Spalte Marktwert Beträge enthält.';
  return st;
}

   BERECHNUNG
   ========================================================= */
function posValue(p){if(p.conf==='skip')return null;if(p.conf==='manual')return p.manualValue;if(p.valueStatus==='ok'||p.conf==='eur')return p.exportValue;return null}
function isIncluded(p){return posValue(p)!=null}
function unresolved(d){return d.positions.filter(p=>p.valueStatus==='unclear'&&!p.conf)}
function noBucket(d){return d.positions.filter(p=>isIncluded(p)&&!p.bucket)}
function totals(d){
  const sec=d.positions.reduce((a,p)=>a+(isIncluded(p)?posValue(p):0),0);
  const acct=d.accounts.reduce((a,x)=>a+x.value,0);
  const ext=d.external.items.reduce((a,x)=>a+(+x.value||0),0);
  return {sec,acct,ext,reserve:+d.external.reserve||0,sum:sec+acct+ext,open:unresolved(d).length,skipped:d.positions.filter(p=>p.conf==='skip').length};
}
/* Bausteinwerte für Zielvergleich und Plan. Verrechnungskonto je nach Einstellung. */
function bucketVals(d,cashMode=d.cashMode){
  const V={};B.forEach(b=>V[b.id]=0);
  d.positions.forEach(p=>{if(isIncluded(p)&&p.bucket)V[p.bucket]+=posValue(p)});
  if(cashMode!=='exclude')V.liq+=d.accounts.reduce((a,x)=>a+x.value,0);
  d.external.items.forEach(x=>{const v=+x.value||0;if(x.type==='bonds')V.bonds+=v;else V.liq+=v});
  return V;
}
const tot=V=>Object.values(V).reduce((a,b)=>a+b,0);
function goalState(d){
  if(!d.goals)return {ok:false,reason:'none'};
  const bad=B.filter(b=>goalRaw[b.id]!=null);
  if(bad.length)return {ok:false,reason:'invalid',fields:bad.map(b=>b.id)};
  const sum=B.reduce((a,b)=>a+(d.goals[b.id]||0),0);
  if(Math.abs(sum-100)>0.05)return {ok:false,reason:'sum',sum};
  return {ok:true,sum};
}
function budgetState(d){if(budgetRaw!=null)return {ok:false,msg:budgetRaw};return {ok:true}}
/* Verteilung auf Bausteine, centgenau */
function allocate(d){
  const gs=goalState(d),bs=budgetState(d);if(!gs.ok||!bs.ok)return null;
  const V=bucketVals(d,d.cashMode==='invest'?'exclude':d.cashMode);
  const cash=d.cashMode==='invest'?d.accounts.reduce((a,x)=>a+x.value,0):0;
  const T=tot(V)+cash,Mc=Math.round((+d.budget||0)*100);
  const t={};B.forEach(b=>t[b.id]=(d.goals[b.id]||0)/100);
  let Ts=T;B.forEach(b=>{if(t[b.id]>0)Ts=Math.max(Ts,V[b.id]/t[b.id])});
  const need={};let ns=0;B.forEach(b=>{need[b.id]=Math.max(0,t[b.id]*Ts-V[b.id]);ns+=need[b.id]});
  const weights={};B.forEach(b=>weights[b.id]=ns>0?need[b.id]/ns:t[b.id]);
  const out={};let used=0;const rem=[];
  B.forEach(b=>{const raw=Mc*weights[b.id];out[b.id]=Math.floor(raw);used+=out[b.id];rem.push([b.id,raw-out[b.id]])});
  rem.sort((a,c)=>c[1]-a[1]);for(let i=0;i<Mc-used;i++)out[rem[i%rem.length][0]]++;
  const moves=[];const minC=(+d.minRate||0)*100;
  if(minC>0){const big=B.reduce((a,b)=>need[b.id]>need[a.id]?b:a,B[0]).id;
    B.forEach(b=>{if(b.id!==big&&out[b.id]>0&&out[b.id]<minC){moves.push({from:b.id,to:big,c:out[b.id]});out[big]+=out[b.id];out[b.id]=0}})}
  const amounts={};B.forEach(b=>amounts[b.id]=out[b.id]/100);
  return {V,T,cash,Ts,need,amounts,moves,ns};
}
function chosenAmounts(d,al){if(d.manual){const m={};B.forEach(b=>m[b.id]=Math.max(0,+d.manual[b.id]||0));return m}return al.amounts}
/* Pfad bei unveränderten Kursen */
function pathFor(d,al,amounts){
  const t={};B.forEach(b=>t[b.id]=(d.goals[b.id]||0)/100);
  const V={...al.V};
  if(al.cash>0){const tmpNs=al.ns||1;B.forEach(b=>V[b.id]+=al.cash*(al.ns>0?al.need[b.id]/tmpNs:t[b.id]))}
  const blocked=B.filter(b=>t[b.id]===0&&V[b.id]>0.5);
  const M=B.reduce((a,b)=>a+amounts[b.id],0);
  const tol=0.01;
  const dev=()=>{const T=tot(V);return T>0?Math.max(...B.map(b=>Math.abs(V[b.id]/T-t[b.id]))):1};
  let theo=null;
  if(!blocked.length){const T=tot(V);let Ts=T;B.forEach(b=>{if(t[b.id]>0)Ts=Math.max(Ts,V[b.id]/t[b.id])});const need=Ts-T;const Mb=+d.budget||0;theo=need<0.5?0:(Mb>0?Math.ceil(need/Mb):null)}
  if(blocked.length)return {blocked,theo:null,months:null};
  if(dev()<=tol)return {blocked:[],theo:0,months:0};
  if(M<=0)return {blocked:[],theo,months:null};
  for(let m=1;m<=600;m++){B.forEach(b=>V[b.id]+=amounts[b.id]);if(dev()<=tol)return {blocked:[],theo,months:m}}
  return {blocked:[],theo,months:Infinity};
}

/* =========================================================
   DEPOT-CHECK: Abweichungen, Datenfragen, Informationen
   ========================================================= */
function checkModel(d){
  const tt=totals(d),out={dev:[],data:[],info:[]};
  const V=bucketVals(d),T=tot(V),gs=goalState(d);
  const incomplete=tt.open>0||noBucket(d).length>0;
  // Datenfragen
  if(tt.open)out.data.push({key:'open',lvl:'warn',t:`${tt.open} ${tt.open>1?'Positionen haben':'Position hat'} einen ungeklärten Wert`,d:`Die Kurswährung ist aus dem Export nicht erkennbar: ${unresolved(d).map(p=>p.name).join(', ')}. Diese Positionen fehlen in Gesamtwert, Gewichten und Zielvergleich.`,go:['depot','confirmCard'],act:'Zuordnungen prüfen'});
  const nb=noBucket(d);if(nb.length)out.data.push({key:'nobucket',lvl:'warn',t:`${nb.length} ${nb.length>1?'Positionen haben':'Position hat'} keinen Baustein`,d:'Ohne Baustein fehlen sie im Zielvergleich.',go:['depot','confirmCard'],act:'Baustein wählen'});
  const funds=d.positions.filter(p=>isIncluded(p)&&p.fund===true);const unkF=d.positions.filter(p=>isIncluded(p)&&p.fund==null);
  if(unkF.length)out.data.push({key:'unkfund',lvl:'na',t:`Bei ${unkF.length} ${unkF.length>1?'Positionen':'Position'} ist nicht bekannt, ob es ein Fonds ist`,d:'Für diese Positionen liegen keine Stammdaten vor; laufende Kosten sind deshalb nicht bekannt.',go:['depot','posCard'],act:'Positionen ansehen'});
  out.data.push({key:'perf',lvl:'na',t:'Wertentwicklung nicht verfügbar',d:'Dafür werden Umsätze und historische Bewertungen gebraucht. Der Umsatz-Import ist noch nicht verfügbar.',go:null});
  if(d.kind==='own'&&!d.valuationDate)out.data.push({key:'date',lvl:'na',t:'Bewertungsstichtag nicht bekannt',d:'Der Export enthält kein Datum. Du kannst es beim nächsten Import angeben.',go:['depot','importCard'],act:'Zum Import'});
  // Abweichungen von eigenen Vorgaben
  if(!d.goals)out.dev.push({key:'nogoals',lvl:'na',t:'Noch keine eigene Zielverteilung',d:'Ohne Vorgaben gibt es nichts zu vergleichen.',go:['plan','goalCard'],act:'Ziele festlegen'});
  else if(!gs.ok)out.dev.push({key:'goalsinvalid',lvl:'na',t:'Zielverteilung ungültig',d:gs.reason==='sum'?`Deine Vorgaben ergeben ${fz(gs.sum)} % statt 100 %.`:'Mindestens ein Eingabefeld ist ungültig.',go:['plan','goalCard'],act:'Vorgaben prüfen'});
  else{
    const pre=incomplete?' Vorläufig, weil Positionen fehlen.':'';
    B.forEach(b=>{const w=T?V[b.id]/T:0,g=d.goals[b.id]/100,diff=w-g;if(Math.abs(diff)>0.05)out.dev.push({key:'dev-'+b.id,lvl:Math.abs(diff)>0.10?'crit':'warn',
      t:`${b.name}: ${pct(w)} statt ${fz(d.goals[b.id])} %`,d:`${num(Math.abs(diff)*100,1)} Prozentpunkte ${diff>0?'darüber':'darunter'}${Math.abs(diff)>0.10?', deutlich':''}.${pre}`,go:['plan','allocCard'],act:'Zum Plan'})});
    const eqA=T?B.filter(b=>b.eq).reduce((a,b)=>a+V[b.id],0)/T:0,eqG=B.filter(b=>b.eq).reduce((a,b)=>a+d.goals[b.id],0)/100;
    if(Math.abs(eqA-eqG)>0.05)out.dev.push({key:'eq',lvl:Math.abs(eqA-eqG)>0.10?'crit':'warn',t:`Aktienquote ${pct(eqA,0)} statt ${pct(eqG,0)}`,d:`Aktien und Aktienfonds im Verhältnis zum betrachteten Vermögen.${pre}`,go:['plan','goalCard'],act:'Vorgaben ansehen'});
    if(d.maxSingle!=null){d.positions.filter(p=>isIncluded(p)&&(p.bucket==='single'||p.bucket==='bdc')).forEach(p=>{const w=posValue(p)/T;if(w>d.maxSingle/100)out.dev.push({key:'max-'+p.id,lvl:'warn',t:`${p.name}: ${pct(w)} des Vermögens`,d:`Über deiner Grenze von ${fz(d.maxSingle)} % je Einzelwert.${pre}`,go:['plan','maxSingle'],act:'Grenze ändern',pos:p.id})})}
    if(!out.dev.length)out.dev.push({key:'devok',lvl:'good',t:'Keine Abweichung über 5 Prozentpunkte',d:incomplete?'Gilt nur für die eingerechneten Positionen; das Depot ist unvollständig.':'Alle Bausteine liegen nah an deinen Vorgaben.',go:null});
  }
  // Informationen
  const known=funds.filter(p=>p.ter!=null),unk=funds.filter(p=>p.ter==null);
  const cost=known.reduce((a,p)=>a+posValue(p)*p.ter/100,0),kv=known.reduce((a,p)=>a+posValue(p),0);
  out.info.push({key:'cost',lvl:'info',t:funds.length?`Laufende Fondskosten: rund ${eur(cost)} pro Jahr`:'Keine Fonds mit bekannten Stammdaten',
    d:funds.length?`Berechnet für ${known.length} von ${funds.length} Fonds (Ø ${num(kv?cost/kv*100:0,2)} %).${unk.length?` Bei ${unk.length} Fonds ist die TER nicht bekannt; sie zählt nicht als 0.`:''} Die laufenden Kosten sind bereits im Fondswert berücksichtigt; Handels- und Depotkosten sind nicht enthalten.`:'',go:['depot','posCard'],act:'Fonds ansehen'});
  const inc=d.positions.filter(isIncluded).sort((a,c)=>posValue(c)-posValue(a)).slice(0,3);
  out.info.push({key:'conc',lvl:'info',t:'Größte Positionen',d:(inc.map(p=>`${p.name} ${pct(posValue(p)/tt.sum)}`).join(' · ')||'–')+'. Länderanteile: nicht verfügbar, dafür fehlen geprüfte Bestandsdaten der Fonds.',go:['depot','posCard'],act:'Positionen'});
  const checked=d.positions.filter(p=>isIncluded(p)&&PAY[p.symbol]&&PAY[p.symbol].cover);const notMet=checked.filter(p=>PAY[p.symbol].cover==='not_met');
  if(checked.length)out.info.push({key:'divcheck',lvl:'info',t:'Geprüfte Ausschüttungsdeckung',d:`${checked.length} Positionen mit hinterlegter Prüfung. ${notMet.length?`Nicht erfüllt: ${notMet.map(p=>p.name).join(', ')}.`:'Bei allen geprüften erfüllt.'} Für alle übrigen Positionen nicht geprüft.`,go:notMet.length?['pos',notMet[0].id]:null,act:notMet.length?'Position ansehen':null});
  return {...out,incomplete};
}

function addEvent(d,e){d.events.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:nowStr(),...e});d.events=d.events.slice(0,50)}
function evaluateChanges(d,first){
  const keys=checkModel(d).dev.filter(x=>x.lvl==='crit').map(x=>x.key).concat(unresolved(d).length?['open']:[]);
  if(d.baseline==null||first){d.baseline=keys;return}
  const added=keys.filter(k=>!d.baseline.includes(k));
  if(added.length&&d.notify.change){const c=checkModel(d);const all=[...c.dev,...c.data];
    added.forEach(k=>{const it=all.find(x=>x.key===k);if(it)addEvent(d,{t:it.t,b:it.d,go:it.go})})}
  d.baseline=keys;
}

/* ---------------- Depot ---------------- */
function itemRow(x){return `<div class="item"><span class="mark ${x.lvl}" aria-hidden="true">${({warn:'!',crit:'!!',info:'i',good:'✓',na:'?'})[x.lvl]}</span><div class="col" style="min-width:0"><span class="sr">${({warn:'Hinweis',crit:'Deutliche Abweichung',info:'Information',good:'Unauffällig',na:'Nicht beurteilbar'})[x.lvl]}: </span><span class="strong">${esc(x.t)}</span>${x.d?`<details><summary>Details</summary><p class="small muted2">${esc(x.d)}</p></details>`:''}</div>${x.go?`<a class="link" href="${x.go[0]==='pos'?'#pos/'+encodeURIComponent(x.go[1]):x.go[0]==='plan'?'#plan':x.go[0]==='depot'?(x.go[1]==='posCard'?'#depot':'#daten'):'#'+x.go[0]}">${esc(x.act||'Ansehen')} →</a>`:'<span></span>'}</div>`}
function vDepot(){

  const nb=noBucket(d);if(nb.length)list+=`<div class="grph"><span>Ohne Baustein</span></div>`+nb.map(p=>posRow(p,T)).join('');
  const out=d.positions.filter(p=>!isIncluded(p));if(out.length)list+=`<div class="grph"><span>Nicht eingerechnet</span></div>`+out.map(p=>posRow(p,T)).join('');
  if(d.accounts.length)list+=`<div class="grph"><span class="row" style="gap:8px"><i class="dot" style="background:var(--s6)"></i>Verrechnungskonto</span><span class="num">${eur(tt.acct)}</span></div>`;

  <section class="card"><h2 class="h2">Positionen</h2>${list}</section>`;
}
function posRow(p,T){const v=posValue(p),I=INFO[p.symbol],m=MOOD[p.symbol];

    return h+checkButtons(p)}
  const pro=[],con=[];I.rules.forEach(r=>{const t=`${r.q.replace(/\?$/,'')}: ${STATUS[r.type][r.status]}${r.obs?` (${r.obs})`:''}`;if(r.status==='met'||r.status==='not_occurred')pro.push(t);else if(r.status==='not_met'||r.status==='occurred')con.push(t)});
  I.facts.filter(f=>f.kind==='metric').slice(0,1).forEach(f=>pro.length<3&&pro.push(f.t));

    <div class="grid2"><div class="pc"><span class="strong pos-text">Dafür spricht</span><ul>${pro.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Keine geprüften Punkte</li>'}</ul></div><div class="pc"><span class="strong neg-text">Dagegen spricht</span><ul>${con.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Kein geprüfter Punkt eingetreten</li>'}${I.themes.map(t=>`<li class="muted2">Offen: ${esc(t.t)}</li>`).join('')}</ul></div></div>
  </section>
  ${nextR?`<section class="dark col" style="gap:4px"><span class="lbl">Was als Nächstes zählt</span><span class="strong">${esc(nextR.next)}: ${esc(nextR.q)}</span></section>`:''}
  <section class="card"><h2 class="h2">Belegte Fakten</h2>${I.facts.map(f=>`<div class="fact">${kindTag(f.kind)}${esc(f.t)}${srcLink(f.src)}</div>`).join('')}</section>
  <section class="card"><h2 class="h2">Was wir beobachten</h2>${I.rules.map(r=>`<div class="rule"><div class="row between" style="align-items:flex-start;gap:8px"><span class="strong">${esc(r.q)} <span class="small muted2">${r.type==='goal'?'Bedingung':'Risiko'}</span></span><span class="st ${stCls(r)}">${STATUS[r.type][r.status]}</span></div><details><summary>Regel und Quelle</summary><dl class="kv"><dt>Kennzahl</dt><dd>${esc(r.metric)}</dd><dt>Bedingung</dt><dd>${esc(r.cond)}</dd><dt>Periode</dt><dd>${esc(r.per)}</dd><dt>Beobachtet</dt><dd>${r.obs?esc(r.obs):'nicht verfügbar'}${r.prev?' · Vorperiode '+esc(r.prev):''}</dd><dt>Nächste Prüfung</dt><dd>${esc(r.next)}</dd><dt>Bedeutung</dt><dd>${esc(r.why)}</dd></dl>${r.src?srcLink(r.src):''}</details></div>`).join('')}</section>`;
  return h+checkButtons(p);
}
function checkButtons(p){return `<div class="grid2" style="margin-top:4px"><a href="#check/${encodeURIComponent(p.id)}/kauf" class="btn">Kauf überlegen</a><a href="#check/${encodeURIComponent(p.id)}/verkauf" class="btn solid">Verkauf überlegen</a></div><p class="hint center">Depotfokus führt keine Orders aus.</p>`}

/* ---------------- Entscheidungs-Check ---------------- */
let chk={reason:null,sleep:true,id:null};
function vCheck(id,intent){
  const d=D(),p=posById(id);if(!p)return `<h1 class="h1">Nicht gefunden</h1><a class="btn" href="#depot">Zum Depot</a>`;
  if(chk.id!==id+intent)chk={reason:null,sleep:true,id:id+intent};
  const buy=intent==='kauf',I=INFO[p.symbol],V=bucketVals(d),T=tot(V),gs=goalState(d);
  let plan,planOk=null;
  if(!p.bucket)plan='Die Position hat keinen Baustein; ein Vergleich mit deinem Plan ist nicht möglich.';
  else if(!gs.ok)plan='Du hast noch keine gültige Zielverteilung. Lege sie im Plan fest, dann prüfen wir das hier.';
  else{const w=V[p.bucket]/T,g=d.goals[p.bucket]/100,under=w<g-0.005;planOk=buy?under:!under;
    plan=`${BN[p.bucket].name}: ${pct(w)} heute, dein Ziel ${fz(d.goals[p.bucket])} %. Ein ${buy?'Kauf':'Verkauf'} bringt dich ${planOk?'näher an':'weiter weg von'} deinem Ziel.`;
    const v=posValue(p);if(d.maxSingle!=null&&v!=null&&(p.bucket==='single'||p.bucket==='bdc')){const pw=v/tt0();if(buy&&pw>=d.maxSingle/100)plan+=` Die Position liegt mit ${pct(pw)} schon über deiner Grenze von ${fz(d.maxSingle)} %.`}}
  const cost=p.fund?(p.ter!=null?`Laufende Fondskosten ${num(p.ter,2)} % pro Jahr. `:'Laufende Kosten nicht bekannt. '):'';
  const R=[['plan','Weg vom Ziel'],['news','Neue Information'],['drop',buy?'Kurs ist gefallen':'Kurs ist gefallen'],['tip','Tipp von anderen']];
  const rule=I&&I.rules?I.rules.find(r=>r.status!=='np'):null;
  let score=0;if(chk.reason){score=chk.reason==='plan'||chk.reason==='news'?2:1;if(planOk===true)score++;if(planOk===false)score--;if(chk.sleep)score++}score=Math.max(0,Math.min(4,score));
  const qual=chk.reason?['Schwach begründet','Schwach begründet','Ausbaufähig','Gut begründet','Sehr gut begründet'][score]:'Wähle einen Grund';
  return `
  <div class="row" style="gap:6px"><a href="#pos/${encodeURIComponent(id)}" class="icon-btn" aria-label="Zurück">${ICON.back}</a><div class="col"><span class="lbl">Entscheidungs-Check</span><h1 class="big" style="font-size:22px">${buy?'Kauf':'Verkauf'}: ${esc(p.name)}</h1></div></div>
  <section class="card step"><span class="num-c c1" aria-hidden="true">1</span><div class="col" style="gap:3px"><span class="strong">Passt es zu deinem Plan?</span><span class="small muted2">${esc(plan)}</span>${!gs.ok?'<a class="link" href="#plan">Zum Plan →</a>':''}</div></section>
  <section class="card step"><span class="num-c c2" aria-hidden="true">2</span><div class="col" style="gap:3px"><span class="strong">Was kostet es?</span><span class="small muted2">${esc(cost)}${buy?'Ordergebühr laut deinem Broker.':'Steuer auf einen Gewinn hängt von deinem Kaufkurs ab; der ist im Export nicht enthalten. Dazu die Ordergebühr.'}</span></div></section>
  <section class="card col" style="gap:10px"><div class="step"><span class="num-c c3" aria-hidden="true">3</span><span class="strong" id="whyLbl" style="padding-top:3px">Warum gerade jetzt?</span></div>
    <div class="reasons" role="group" aria-labelledby="whyLbl">${R.map(([k,l])=>`<button type="button" data-reason="${k}" aria-pressed="${chk.reason===k}">${l}</button>`).join('')}</div>
    ${chk.reason==='drop'?'<p class="hint-box">Ein gefallener Kurs allein ist selten ein guter Grund. Was hat sich am Geschäft geändert?</p>':''}
    ${chk.reason==='tip'?'<p class="hint-box">Tipps von anderen kennen deinen Plan nicht. Prüfe Schritt 1 besonders genau.</p>':''}</section>
  <section class="card step"><span class="num-c c4" aria-hidden="true">4</span><div class="col" style="gap:3px"><span class="strong">Was würde dich umstimmen?</span><span class="small muted2">${rule?`Zum Beispiel: ${esc(rule.metric)} – ${esc(rule.cond)} (${esc(rule.next)}).`:'Überlege dir eine konkrete Bedingung, bevor du handelst.'}</span></div></section>
  <section class="dark row between"><div class="col" style="gap:2px"><span class="lbl">Entscheidungsqualität</span><span class="big" style="font-size:20px" id="qual" aria-live="polite">${qual}</span></div><div class="meter" aria-hidden="true">${[1,2,3,4].map(i=>`<span class="${chk.reason&&i<=score?'on':''}"></span>`).join('')}</div></section>
  <label class="switch"><span>24 Stunden drüber schlafen</span><input type="checkbox" id="sleep" ${chk.sleep?'checked':''}></label>
  <button type="button" class="btn solid" id="saveNote" ${chk.reason?'':'disabled'}>Entscheidungsnotiz speichern</button>
  <p class="hint center">Punkte gibt es für die Begründung, nicht für den Trade. Umsetzen kannst du nur bei deinem Broker.</p>`;
}
const tt0=()=>totals(D()).sum;

/* ---------------- Plan ---------------- */
function vPlan(){
  const d=D(),V=bucketVals(d),T=tot(V),gs=goalState(d);
  let goals;
  if(!d.goals)goals=`<div class="empty">Du hast noch keine Zielverteilung. Ohne Ziele gibt es keinen Vergleich und keine Verteilung der Sparrate.</div><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn solid" id="goalsFromNow" type="button">Heutige Verteilung übernehmen</button><button class="btn" id="goalsEmpty" type="button">Leer beginnen</button></div>`;
  else goals=B.map(b=>{const raw=goalRaw[b.id];return `<div class="goal"><i class="dot" style="background:var(${b.c})" aria-hidden="true"></i><label for="g_${b.id}" class="col"><span class="strong">${b.name}</span><span class="small muted2 num">heute ${T?pct(V[b.id]/T,1):'–'}</span></label><span class="row" style="gap:6px;flex-wrap:nowrap"><input class="numin" type="text" inputmode="decimal" id="g_${b.id}" data-goal="${b.id}" value="${esc(raw?raw.v:d.goals[b.id])}" ${raw?'aria-invalid="true"':''} aria-describedby="ge_${b.id}"> %</span><span class="err" id="ge_${b.id}">${raw?esc(raw.msg):''}</span></div>`}).join('')+`<div class="row between" style="margin-top:8px"><span id="goalSum" class="num" role="status"></span><button class="link" id="goalsFromNow" type="button">Heutige Verteilung</button></div>`;
  return `
  <h1 class="h1" style="font-size:28px">Dein Plan</h1>
  <section class="card col" style="gap:6px"><div class="row between"><h2 class="h2">1. Meine Zielverteilung</h2>${d.goalsSource==='example'?'<span class="chip-demo">Beispiel</span>':''}</div>${goals}
    <label class="field" for="maxSingle" style="margin-top:10px">Grenze je Einzelwert in % (leer = keine)<input class="numin" type="text" inputmode="decimal" id="maxSingle" value="${d.maxSingle??''}"><span class="err" id="maxErr"></span></label>
    <p class="hint">Zur Orientierung: Stiftung Warentest beschreibt im Pantoffel-Portfolio Mischungen mit 25, 50 oder 75 % Aktien. Keine Empfehlung für dich.</p></section>
  <section class="card col" style="gap:10px"><h2 class="h2">2. Meine monatliche Einzahlung</h2>
    <div class="grid2"><label class="field" for="budget">Betrag in €<input class="numin" type="text" inputmode="decimal" id="budget" value="${budgetRaw!=null?'':num(d.budget||0,2)}"><span class="err" id="budgetErr">${budgetRaw?esc(budgetRaw):''}</span></label>
    <label class="field" for="cashMode">Verrechnungskonto<select id="cashMode"><option value="keep" ${d.cashMode==='keep'?'selected':''}>bleibt unverändert</option><option value="invest" ${d.cashMode==='invest'?'selected':''}>einmalig mitverteilen</option><option value="exclude" ${d.cashMode==='exclude'?'selected':''}>nicht zur Zielverteilung</option></select></label></div></section>
  <section class="card col" style="gap:6px" id="allocBox">${allocHTML()}</section>
  <details class="card"><summary class="strong">4. So wird gerechnet</summary><div class="col small muted2" style="gap:6px;margin-top:8px"><p>Für jeden Baustein wird geprüft, wie viel Geld bei unveränderten Kursen fehlt, damit er seine Zielquote erreicht, ohne dass etwas verkauft wird.</p><p>Die Einzahlung wird im Verhältnis dieser Fehlbeträge verteilt, auf den Cent genau. Ist nichts zu verteilen, gilt das Verhältnis der Zielquoten.</p><p>Die Dauer ist eine Rechnung bei unveränderten Kursen. Kursbewegungen und Ausschüttungen verändern sie.</p></div></details>`;
}
function allocHTML(){
  const d=D(),gs=goalState(d),bs=budgetState(d);
  if(!gs.ok||!bs.ok){const why=!d.goals?'Lege zuerst eine Zielverteilung fest.':gs.reason==='sum'?`Deine Ziele ergeben ${fz(gs.sum)} % statt 100 %.`:gs.reason==='invalid'?'Mindestens eine Zielquote ist ungültig.':bs.msg;
    return `<h2 class="h2">3. Rechnerische Verteilung</h2><div class="empty">Keine Berechnung: ${esc(why)}</div><button class="btn solid" disabled aria-describedby="cw">Verteilung kopieren</button><span class="hint" id="cw">Nicht möglich: ${esc(why)}</span>`}
  const al=allocate(d),am=al.amounts,p=pathFor(d,al,am),M=+d.budget||0;
  const rows=B.map(b=>{const t=d.goals[b.id],held=al.V[b.id]>0.5;if(!t&&!held&&!am[b.id])return '';
    const why=!t?(held?'Ziel 0 %: keine Einzahlung, der Bestand bleibt.':'Ziel 0 %.'):al.need[b.id]>0.5?`Unter Ziel: bis ${fz(t)} % fehlen rund ${eur(al.need[b.id])}.`:al.ns===0?`Verteilung nach deinem Ziel von ${fz(t)} %.`:`Hat ${fz(t)} % erreicht oder überschritten.`;
    return `<div class="alloc"><i class="dot" style="background:var(${b.c})" aria-hidden="true"></i><span class="strong">${b.name}</span><span class="num">${eur(am[b.id],2)}</span><span class="why">${esc(why)}</span></div>`}).join('');
  const dur=p.blocked.length?'ohne Verkauf nicht erreichbar':p.theo===0?'erreicht':p.theo==null?'–':`frühestens nach ${p.theo} Monaten`;
  return `<h2 class="h2">3. Rechnerische Verteilung</h2>${rows}
   <div class="result"><span>Ziel erreicht</span><span class="num strong">${dur}</span>${al.cash>0?`<span>Einmalig aus dem Konto</span><span class="num">${eur(al.cash,2)}</span>`:''}</div>
   ${p.blocked.length?`<p class="neg-text small">${esc(p.blocked.map(b=>b.name).join(', '))}: Ziel 0 %, aber Bestand vorhanden.</p>`:''}${M===0?'<p class="hint">Bei 0 € Einzahlung ändert sich die Verteilung nicht.</p>':''}
   <div class="bars"><div class="barlab"><span>Heute</span><div class="bar">${barHTML(al.V)}</div></div><div class="barlab"><span>Ziel</span><div class="bar">${barHTML(d.goals)}</div></div></div>
   <button class="btn solid" id="btnCopy" type="button">Verteilung kopieren</button><p class="hint">Bei unveränderten Kursen. Welche Wertpapiere du kaufst, entscheidest du.</p>`;
}
function barHTML(W){const T=tot(W)||1;return B.filter(b=>W[b.id]>0).map(b=>`<span title="${b.name}" style="width:${W[b.id]/T*100}%;background:var(${b.c})"></span>`).join('')}
function renderGoalSum2(){const d=D(),el=$('#goalSum');if(!el||!d.goals)return;const gs=goalState(d),sum=B.reduce((a,b)=>a+(d.goals[b.id]||0),0);

  <p class="small muted2">Echte Fragen zu deinen Positionen. Aufgelöst wird, sobald der nächste Bericht geprüft ist.</p>
  ${qs.map(q=>{const pr=FUN.preds[q.id]||{};return `<section class="dark col" style="gap:10px"><span class="lbl">${esc(q.p.name)} · ${esc(q.r.next)}</span>
    <span class="h3" style="color:#fff">${esc(q.r.q)}</span><span class="small muted-night">${esc(q.r.metric)}: ${esc(q.r.cond)} · zuletzt ${esc(q.r.obs||'nicht verfügbar')} (${esc(q.r.per)})</span>
    <div class="grid2 yn" role="group" aria-label="Antwort">${['ja','nein'].map(a=>`<button type="button" data-pred="${esc(q.id)}" data-ans="${a}" aria-pressed="${pr.a===a}">${a==='ja'?'Ja':'Nein'}</button>`).join('')}</div>
    <div class="conf-g" role="group" aria-label="Wie sicher bist du?">${[50,60,70,80,90].map(c=>`<button type="button" data-pred="${esc(q.id)}" data-conf="${c}" aria-pressed="${(pr.c||70)===c}">${c} %</button>`).join('')}</div>
    <span class="small sun-text">${pr.a?`Getippt: ${pr.a==='ja'?'Ja':'Nein'} mit ${pr.c||70} %. Offen bis zur Auflösung.`:'Noch nicht getippt.'}</span></section>`}).join('')||'<p class="hint">Für deine Positionen gibt es noch keine prüfbaren Fragen.</p>'}
  <section class="card col" style="gap:6px"><span class="strong">Deine Treffsicherheit</span><p class="small muted2">Noch keine aufgelöste Prognose. Gewertet wird, wie gut deine Sicherheit zur Wirklichkeit passt: Wer 70 % sagt, sollte in 7 von 10 Fällen richtig liegen.</p></section>
  <section class="card"><h2 class="h2">Deine Entscheidungsnotizen</h2>${notes.length?notes.slice().reverse().map(n=>`<div class="fact"><span class="strong">${esc(n.intent==='kauf'?'Kauf':'Verkauf')} ${esc(n.name)}</span><span class="small muted2"> · ${esc(n.date)} · ${esc(n.quality)}</span><div class="small muted2">Grund: ${esc(n.reasonTxt)}${n.sleep?' · mit Bedenkzeit':''}</div></div>`).join(''):'<p class="hint">Noch keine. Notizen entstehen im Entscheidungs-Check.</p>'}</section>
  <p class="hint">Familien-Rangliste und Taschengeld-Depot kommen mit Benutzerkonten.</p>`;
}

/* ---------------- Daten ---------------- */
function vDaten(){return `
  <div class="row" style="gap:6px"><a href="#heute" class="icon-btn" aria-label="Zurück">${ICON.back}</a><h1 class="h1" style="font-size:26px">Daten &amp; Import</h1></div>
  <div class="card" id="sourceCard"></div>
  <div class="card" id="importCard" tabindex="-1"></div>
  <div class="card" id="confirmCard" tabindex="-1"></div>
  <div class="card" id="extCard"></div>
  <details class="card"><summary class="strong">Hinter den Kulissen</summary><div class="col small muted2" style="gap:6px;margin-top:8px"><p>Heute: Die Einordnungen sind manuell recherchierte Beispieldaten vom 04.10.2026 mit Quellenangabe. Es gibt keine automatische Aktualisierung.</p><p>Geplant: Jede Nacht Meldungen und Berichte in vielen Sprachen lesen, Fakten mit Quelle herausziehen, gegenprüfen, Regeln berechnen und nur Relevantes für dein Depot bündeln.</p><p>Versprechen: Jede Zahl mit Quelle · Trefferquote öffentlich · keine Provision für Käufe · keine Orders.</p></div></details>`}

/* ---------------- Ereignisse ---------------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const sb=t.closest('[data-story]');if(sb){storyIdx+=sb.dataset.story==='next'?1:-1;storyIdx=Math.max(0,storyIdx);rerender();return}
  const un=t.closest('[data-understood]');if(un){const id=un.dataset.understood;if(!FUN.understood.includes(id)){FUN.understood.push(id);FUN.points+=10;touchDay();saveFun();toast('+10 Wissenspunkte')}rerender();return}
  const rb=t.closest('[data-reason]');if(rb){chk.reason=rb.dataset.reason;rerender();return}
  if(t.closest('#saveNote')){const {a}=parse();const p=posById(a[0]);const RT={plan:'Weg vom Ziel',news:'Neue Information',drop:'Kurs ist gefallen',tip:'Tipp von anderen'};
    const q=$('#qual').textContent;
    FUN.notes.push({kind:D().kind,id:p.id,name:p.name,intent:a[1],reasonTxt:RT[chk.reason],sleep:chk.sleep,quality:q,date:new Date().toLocaleDateString('de-DE')});FUN.points+=5;touchDay();saveFun();toast('Notiz gespeichert · +5 Punkte');location.hash='#liga';return}
  const pb=t.closest('[data-pred]');if(pb){const id=pb.dataset.pred;const pr=FUN.preds[id]||{c:70};if(pb.dataset.ans)pr.a=pb.dataset.ans;if(pb.dataset.conf)pr.c=+pb.dataset.conf;pr.at=new Date().toISOString();FUN.preds[id]=pr;touchDay();saveFun();rerender();return}
  if(t.closest('#goalsFromNow')){const d=D(),V=bucketVals(d),T=tot(V);if(!T){toast('Ohne Bestand gibt es keine heutige Verteilung.');return}const g={};B.forEach(b=>g[b.id]=Math.round(V[b.id]/T*1000)/10);const diff=Math.round((100-B.reduce((a,b)=>a+g[b.id],0))*10)/10;const big=B.reduce((a,b)=>g[b.id]>g[a.id]?b:a,B[0]);g[big.id]=Math.round((g[big.id]+diff)*10)/10;d.goals=g;d.goalsSource='current';goalRaw={};changed();toast('Heutige Verteilung übernommen');return}
  if(t.closest('#goalsEmpty')){const d=D();d.goals=Object.fromEntries(B.map(b=>[b.id,0]));d.goalsSource='own';goalRaw={};changed();return}
  if(t.closest('#btnCopy')){const d=D(),al=allocate(d);if(!al)return;const txt=['Depotfokus · rechnerische Verteilung',...B.filter(b=>al.amounts[b.id]>0).map(b=>`${eur(al.amounts[b.id],2)} → ${b.name} (Ziel ${fz(d.goals[b.id])} %)`)].join('\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Verteilung kopiert')).catch(()=>toast('Kopieren nicht möglich'));return}
  // Daten (aus der App übernommen)
  const src=t.closest('[data-src]');if(src){UI.source=src.dataset.src;saveUI();goalRaw={};budgetRaw=null;rerender();toast(UI.source==='demo'?'Musterdepot wird angezeigt':'Dein Depot wird angezeigt');return}
  const cf=t.closest('[data-conf]');if(cf&&cf.dataset.conf.includes('|')){const [id,how]=cf.dataset.conf.split('|');const p=posById(id);if(!p)return;if(how==='manual'){const box=document.getElementById('mv_'+id);box.hidden=false;document.getElementById('mvi_'+id).focus();return}p.conf=how;changed();toast(how==='eur'?`${p.name} wird eingerechnet`:`${p.name} wird nicht eingerechnet`);return}
  const cs=t.closest('[data-confsave]');if(cs){const id=cs.dataset.confsave;const p=posById(id);const v=parseInput(document.getElementById('mvi_'+id).value);if(!(v>=0)||v>1e9){document.getElementById('mve_'+id).textContent='Bitte einen Betrag ab 0 € eingeben.';return}p.conf='manual';p.manualValue=v;changed();return}
  if(t.closest('[data-unskip]')){D().positions.forEach(p=>{if(p.conf==='skip')p.conf=null});changed();return}
  if(t.closest('#extAdd')){D().external.items.push({type:'tagesgeld',value:0});changed();return}
  const xd=t.closest('[data-extdel]');if(xd){D().external.items.splice(+xd.dataset.extdel,1);changed();return}
  if(t.closest('#stDiscard')){staged=null;renderImport();return}
  if(t.closest('#stAccept')){acceptImport();return}
  if(t.closest('#delAsk')){pendingDelete=true;renderSourceCard();return}
  if(t.closest('#delCancel')){pendingDelete=false;renderSourceCard();return}
  if(t.closest('#delConfirm')){store(OWN_KEY,null);OWN=null;pendingDelete=false;UI.source='demo';saveUI();rerender();toast('Eigene Daten auf diesem Gerät gelöscht');return}
});
document.addEventListener('change',e=>{
  const el=e.target,d=D();
  if(el.id==='sleep'){chk.sleep=el.checked;rerender();return}
  if(el.id==='cashMode'){d.cashMode=el.value;changed();return}
  if(el.id==='maxSingle'){const v=parseInput(el.value);if(v!=null&&!(v>0&&v<=100)){$('#maxErr').textContent='Wert über 0 und höchstens 100, oder leer lassen.';el.setAttribute('aria-invalid','true');return}d.maxSingle=v;changed();return}
  if(el.id==='file'){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{staged=analyzeCSV(r.result,f.name);renderImport();toast(staged.error?'Import nicht möglich':'Datei geprüft, bitte kontrollieren')};r.readAsText(f);el.value='';return}
  if(el.dataset.acc!=null&&staged){staged.accounts[+el.dataset.acc].accept=el.checked;return}
  if(el.id==='stReplace'){$('#stAccept').disabled=!el.checked;return}
  if(el.dataset.bucket){const p=posById(el.dataset.bucket);if(p&&el.value){p.bucket=el.value;p.bucketSrc='user';changed()}return}
  if(el.dataset.exttype!=null){d.external.items[+el.dataset.exttype].type=el.value;changed();return}
  if(el.dataset.extval!=null){const v=parseInput(el.value);if(v==null||!(v>=0)){el.setAttribute('aria-invalid','true');return}d.external.items[+el.dataset.extval].value=v;changed();return}
  if(el.id==='reserve'){const v=parseInput(el.value);if(v!=null&&!(v>=0)){$('#resErr').textContent='Bitte einen Betrag ab 0 € eingeben.';return}d.external.reserve=v||0;changed();return}
});
document.addEventListener('input',e=>{
  const el=e.target,d=D();
  if(el.dataset.goal){const k=el.dataset.goal,v=parseInput(el.value);
    if(v==null||!Number.isFinite(v)||v<0||v>100){goalRaw[k]={v:el.value,msg:v==null?'Wert 0 bis 100 eingeben.':!Number.isFinite(v)?'Keine gültige Zahl.':v<0?'Nicht negativ.':'Höchstens 100.'};el.setAttribute('aria-invalid','true');$('#ge_'+k).textContent=goalRaw[k].msg}
    else{delete goalRaw[k];d.goals[k]=Math.round(v*100)/100;el.removeAttribute('aria-invalid');$('#ge_'+k).textContent=''}
    d.goalsSource='own';d.manual=null;renderGoalSum2();$('#allocBox').innerHTML=allocHTML();if(goalState(d).ok)persist();return}
  if(el.id==='budget'){const v=parseInput(el.value);
    if(v==null||!Number.isFinite(v)||v<0||v>1e7){budgetRaw=v==null?'Bitte einen Betrag eingeben, mindestens 0 €.':!Number.isFinite(v)?'Keine gültige Zahl.':v<0?'Nicht negativ.':'Höchstens 10 Mio. €.';el.setAttribute('aria-invalid','true')}
    else{budgetRaw=null;d.budget=Math.round(v*100)/100;el.removeAttribute('aria-invalid');persist()}
    $('#budgetErr').textContent=budgetRaw||'';$('#allocBox').innerHTML=allocHTML();return}
});
function changed(){const d=D();evaluateChanges(d);persist();rerender()}

/* Start */
evaluateChanges(DEMO,true);if(OWN&&OWN.baseline==null)evaluateChanges(OWN,true);
touchDay();saveFun();route();

</script>
</body>
</html>
