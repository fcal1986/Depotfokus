<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F6FA">
<title>Depotfokus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap">
<style>

/* Depotfokus: Vision-Oberfläche mit echter Logik. Routen #heute #story #depot #pos #check #plan #liga #daten */
:root{
  --ground:#F5F6FA; --card:#FFFFFF; --line:#E3E5EE; --line-soft:#EEF0F6;
  --ink:#14172E; --ink-2:#4A5070; --ink-3:#6B7090;
  --night:#14172E; --night-2:#1E2242; --night-3:#2C3158; --night-line:#3A3F63; --night-text:#B9BED8; --night-text-2:#D7DAEC;
  --accent:#D6401C; --coral:#FF8A6B; --sun:#FFD66B;
  --pos-bg:#DDF4EC; --pos:#0B6E53; --warn-bg:#FFF1D6; --warn:#8A5200; --neg-bg:#FBE3E3; --neg:#A12F2F; --blue:#1F5FD1;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, Menlo, monospace;
  --s1:#2a78d6; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#4a3aa7; --s7:#008300;
  --on-ink:#FFFFFF; --line-strong:#D3D6E2; --hint-bg:#FFF8E0; --hint-line:#F2DE9B; --info-bg:#FFF3EE; --accent-soft:#FFD9CC;
  --blue-bg:#E6ECFA; --violet-bg:#F1E9FB; --violet:#6B3FA8; --shade:rgba(20,23,46,.10); --desk:#E7E9F1; --switch-on:#14172E;
  --sky1:#DCEBFF; --sky2:#FFF1E3; --hill1:#CFEFC7; --hill2:#BFE8B5; --grass:#8FD18A; --grass-edge:#6FB86A;
  color-scheme:light;
}
/* Dunkles Design: System-Einstellung, außer du wählst unter Daten & Import ausdrücklich Hell */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#10131F; --card:#1A1E30; --line:#2C3150; --line-soft:#23283F;
  --ink:#ECEEF7; --ink-2:#B4B9D3; --ink-3:#8F95B3;
  --night:#252A4A; --night-2:#2F355C; --night-3:#3A4170; --night-line:#4A5185;
  --accent:#FF7A55; --pos-bg:#123A30; --pos:#6FD8B2; --warn-bg:#3A2C10; --warn:#F2C062; --neg-bg:#3D1C20; --neg:#FF9C9C; --blue:#8DB0FF;
  --on-ink:#14172E; --line-strong:#3A4062; --hint-bg:#2B2614; --hint-line:#5A4A1E; --info-bg:#33201A; --accent-soft:#5A2A1C;
  --blue-bg:#1E2A4D; --violet-bg:#2C2245; --violet:#C6A8F2; --shade:rgba(255,255,255,.12); --desk:#0A0C15; --switch-on:#6FD8B2;
  --sky1:#141B3D; --sky2:#3A2D4A; --hill1:#22402C; --hill2:#2A4A33; --grass:#2F5A38; --grass-edge:#3E7048;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#10131F; --card:#1A1E30; --line:#2C3150; --line-soft:#23283F;
  --ink:#ECEEF7; --ink-2:#B4B9D3; --ink-3:#8F95B3;
  --night:#252A4A; --night-2:#2F355C; --night-3:#3A4170; --night-line:#4A5185;
  --accent:#FF7A55; --pos-bg:#123A30; --pos:#6FD8B2; --warn-bg:#3A2C10; --warn:#F2C062; --neg-bg:#3D1C20; --neg:#FF9C9C; --blue:#8DB0FF;
  --on-ink:#14172E; --line-strong:#3A4062; --hint-bg:#2B2614; --hint-line:#5A4A1E; --info-bg:#33201A; --accent-soft:#5A2A1C;
  --blue-bg:#1E2A4D; --violet-bg:#2C2245; --violet:#C6A8F2; --shade:rgba(255,255,255,.12); --desk:#0A0C15; --switch-on:#6FD8B2;
  --sky1:#141B3D; --sky2:#3A2D4A; --hill1:#22402C; --hill2:#2A4A33; --grass:#2F5A38; --grass-edge:#3E7048;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
h1,h2{margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--ground)}
@media (min-width:600px){body{background:var(--desk)}.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(20,23,46,.08)}}
.screen{padding:calc(18px + env(safe-area-inset-top,0px)) 20px 110px;display:flex;flex-direction:column;gap:14px;min-height:100vh;min-height:100dvh}
.screen.sub{padding-bottom:28px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.dark{background:var(--night);color:#fff;border-radius:18px;padding:16px 18px;border:0}
.dark .lbl{color:var(--night-text)}
.chip-demo{font-size:11px;font-weight:700;color:#14172E;background:var(--sun);border-radius:6px;padding:2px 7px;white-space:nowrap}
.big{font-family:var(--display);font-weight:800;letter-spacing:-.02em}
.h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.back{width:44px;height:44px;display:grid;place-items:center;margin-left:-12px;border:0;background:none;cursor:pointer;border-radius:12px}
.btn{min-height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15.5px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;padding:0 14px;text-align:center}
.btn.solid{background:var(--ink);color:var(--on-ink)}
.btn.light{background:#fff;color:#14172E;border-color:#fff}
.btn.ghost-dark{border-color:#4A5070;color:#fff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.pos{background:var(--pos-bg);color:var(--pos)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.neg{background:var(--neg-bg);color:var(--neg)}

/* Tab-Leiste */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tabs a[aria-current="page"]{color:var(--accent);font-weight:700}
.tabs svg{width:22px;height:22px}

/* Heute */
.stories{display:flex;gap:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.story-b{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;flex:none}
.ring{padding:3px;border-radius:50%;border:2.5px solid var(--accent);display:grid}
.ring.seen{border-color:var(--line-strong)}
.av{width:54px;height:54px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:14px}
.story-b span.n{font-size:12px;font-weight:600;color:var(--ink-2)}
.change{display:flex;flex-direction:column;gap:4px;min-height:44px}
.change .t{font-weight:700;font-size:15px}
.change .d{font-size:13.5px;color:var(--ink-2)}

/* Story */
.story{background:var(--night);color:#fff;min-height:100vh;min-height:100dvh;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 28px;display:flex;flex-direction:column;gap:18px}
.prog{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.prog span{position:relative;height:3px;border-radius:2px;background:var(--night-line);overflow:hidden}
.prog span i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff}
.prog span.done i{width:100%}
.prog span.cur i{animation:storyfill linear forwards}
@keyframes storyfill{from{width:0}to{width:100%}}
.story.paused .prog span.cur i{animation-play-state:paused}
.story.manual .prog span.cur i{animation:none;width:100%}
.story-stage{position:relative;flex:1;display:flex;flex-direction:column;gap:10px;margin-top:6px;min-height:260px}
.tap{position:absolute;top:0;bottom:0;z-index:2;background:transparent;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tap.prev{left:-20px;width:35%}.tap.next{right:-20px;width:calc(65% + 20px)}
.tap:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.story{user-select:none;-webkit-user-select:none}
.story-hint{margin:0;font-size:12.5px;color:var(--night-text-2);background:var(--night-2);border-radius:10px;padding:8px 10px}
.stand-t{display:flex;flex-direction:column;gap:6px}
.stand-l{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px;min-height:28px}
.stand-l .muted2{font-size:12.5px}
.stand-up{display:flex;flex-direction:column;gap:1px;padding:7px 0;border-top:1px solid var(--line-soft)}
.dot.ok{background:var(--pos)}.dot.warn{background:#E0A100}.dot.man{background:var(--blue)}.dot.off{background:var(--line-strong)}
.mode{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.mode.auto{background:var(--pos-bg);color:var(--pos)}.mode.man{background:var(--blue-bg);color:var(--blue)}.mode.off{background:var(--line-soft);color:var(--ink-3)}.mode.dev{background:var(--violet-bg);color:var(--violet)}
.tag.new{background:var(--accent);color:#fff}
.ring.fresh{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.banner.info{background:var(--info-bg);color:var(--ink)}.banner.info b{color:var(--accent)}
.story-link{position:relative;z-index:3;align-self:flex-start;display:inline-flex;gap:6px;align-items:center;color:#fff;font-weight:700;font-size:14px;border:1.5px solid #4A5070;border-radius:99px;padding:8px 14px;min-height:40px}
.quote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--line);color:var(--ink-2);font-size:12.5px;font-style:italic}
.stadt{padding:12px 0 10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.stadt>.row,.stadt>.hint,.stadt>.prof-ask,.stadt>#stadtRange,.stadt>.small{margin:0 14px}
.stadt-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.stadt-scroll::-webkit-scrollbar{display:none}
.stadt-svg{display:block}
.haus{cursor:pointer;transition:transform .15s}.haus:focus-visible{outline:none}.haus:focus-visible rect:first-of-type{stroke:var(--blue);stroke-width:3}
.hlab{font-family:var(--body);font-size:11px;font-weight:700;fill:var(--ink)}
#stadtRange{accent-color:var(--accent);min-height:36px;width:calc(100% - 28px)}
.prof-ask{display:flex;flex-direction:column;gap:8px;background:var(--hint-bg);border:1px solid var(--hint-line);border-radius:14px;padding:12px}
.prof-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.prof-grid button{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;padding:10px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:13px;cursor:pointer;text-align:center}
.prof-grid .pe{font-size:28px;line-height:1}
.hero-why{grid-column:1/-1}
.haus-hero{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;align-items:end;background:linear-gradient(var(--sky1),var(--sky2));border-radius:18px;padding:10px 14px 14px;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{min-height:40px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line-strong);background:var(--card);font-weight:600;font-size:13px;cursor:pointer}
.mchip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.piece{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;background:var(--ground);border-radius:12px;padding:10px 12px;font-size:14px}
.piece .pe{font-size:26px;text-align:center}
.flow2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:8px 10px;align-items:center;font-size:13.5px}
.fbar{height:14px;background:var(--line-soft);border-radius:7px;overflow:hidden;display:block}.fbar i{display:block;height:100%;border-radius:7px}
.trend{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line-soft)}
.trend .te{font-size:20px;line-height:1.2}
.why-line{gap:8px;flex-wrap:wrap;padding:10px 14px;font-size:14px}
.zteaser{display:flex;align-items:center;justify-content:space-between;gap:12px}
.zspark{width:64px;height:40px;flex:none}
.zchart{touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.zchart svg{display:block;overflow:visible}
.zgrid{stroke:var(--line-soft);stroke-width:1}.zax{font-size:10px;fill:var(--ink-3);font-family:var(--mono)}
.zband{fill:var(--pos-bg)}.zmid{fill:none;stroke:var(--pos);stroke-width:2.5;stroke-linejoin:round}
.zcur{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}.zdot{fill:var(--ink);stroke:var(--card);stroke-width:2}
#zRange{width:100%;accent-color:var(--ink);min-height:36px}
.zcols{display:flex;align-items:flex-end;gap:4px;height:190px;overflow-x:auto;padding-top:4px}
.zcol{flex:1 0 20px;min-width:20px;max-width:44px;height:100%;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer}
.zcol .zv{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);height:12px}
.zbar{position:relative;flex:1;width:100%;border-radius:6px 6px 2px 2px;background:transparent}
.zbar i{position:absolute;left:0;right:0;border-radius:6px 6px 2px 2px}
.zfill{bottom:0;transition:height .12s ease-out}.zwh{background:var(--shade);border-radius:4px;transition:all .12s ease-out}
.zcol .zlab{font-family:var(--mono);font-size:10px;color:var(--ink-2);height:14px;white-space:nowrap}
.zcol.on .zlab{color:var(--accent);font-weight:700}.zcol.on .zfill{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
.zcut{color:var(--neg);font-weight:700}
.zcutrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.zcutname{grid-column:1/-1}.zcutrow select{width:100%}
.zcutrow select{min-height:40px;font-size:13px;padding:0 6px}
.zass{display:grid;grid-template-columns:minmax(0,1fr) 62px 52px 62px;gap:6px;align-items:center}
.zass .numin{width:100%;min-height:40px;padding:0 6px}
.ztip{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:center}
.ztip input[type=range]{writing-mode:vertical-lr;direction:rtl;width:40px;height:160px;accent-color:var(--accent);margin:0 auto}
.flow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line-soft)}
.card h2+.flow{border-top:0}
.flow .n{width:28px;height:28px;border-radius:8px;background:var(--night);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12px}
.barrow{display:flex;flex-direction:column;gap:6px}
.track{height:14px;border-radius:7px;background:var(--night-3)}
.fill{height:100%;border-radius:7px}
.bubble{background:var(--card);color:var(--ink);border-radius:18px 18px 18px 6px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}

/* Kompass */
.prob{display:flex;height:42px;border-radius:10px;overflow:hidden;gap:3px}
.prob div{display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.trust{display:flex;gap:10px;align-items:center;background:var(--ground);border-radius:12px;padding:10px 12px}
.pc{display:flex;flex-direction:column;gap:8px}
.pc li{font-size:13px;line-height:1.35;list-style:none}
.pc ul{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

/* Check */
.step{display:flex;gap:12px}
.num-c{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.reasons{display:flex;flex-wrap:wrap;gap:8px}
.reasons button{min-height:44px;padding:0 14px;border-radius:99px;font-size:13.5px;font-weight:600;cursor:pointer;border:1.5px solid var(--line-strong);background:var(--card)}
.reasons button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.meter{display:flex;gap:4px}
.meter span{width:12px;height:28px;border-radius:4px;background:var(--night-line)}
.meter span.on{background:#7DDBB8}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-weight:600;cursor:pointer}
.switch input{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked{background:var(--switch-on)}
.switch input:checked::after{left:23px}

/* Liga */
.yn button{min-height:48px;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;background:transparent;color:#fff;border:1.5px solid #4A5070}
.yn button[aria-pressed="true"]{background:#fff;color:#14172E;border-color:#fff}
.conf-g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.conf-g button{min-height:44px;border-radius:10px;font-family:var(--mono);font-size:13px;cursor:pointer;background:var(--night-2);color:#fff;border:0}
.conf-g button[aria-pressed="true"]{background:var(--coral);color:#14172E}
.board{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:42px;border-bottom:1px solid var(--line-soft)}
.board:last-of-type{border-bottom:0}

/* Kulissen */
.steps .s{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.steps .s:last-child{border-bottom:0}
.steps .n{width:32px;height:32px;border-radius:9px;background:var(--night);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Umsätze, Rendite, Liga */
.dayline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:15px;margin-top:-2px}
.perf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border-top:1px solid var(--night-line);padding-top:10px;margin-top:4px;font-size:15px}
.up{color:#7DDBB8}.down{color:#FF9C9C}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;background:var(--ground);border-radius:12px;padding:10px 12px}
.kpi .num{font-size:16px}
.res{align-self:flex-start;font-weight:800;border-radius:99px;padding:4px 12px;font-size:14px}

/* =========================================================

const TXT=[
 ['buy',/^(kauf|buy)$/i],['sell',/^(verkauf|sell)$/i],
 ['in',/^(einlieferung|delivery \(inbound\)|inbound delivery)$/i],['out',/^(auslieferung|delivery \(outbound\)|outbound delivery)$/i],
 ['div',/^(dividende|dividend|dividends|ausschüttung|ertrag)$/i],['int',/^(zinsen|interest)$/i],
 ['dep',/^(einlage|deposit)$/i],['wd',/^(entnahme|removal|withdrawal)$/i],
 ['fee',/^(gebühren|fees|gebühr)$/i],['feeref',/^(gebührenerstattung|fees refund)$/i],
 ['tax',/^(steuern|taxes)$/i],['taxref',/^(steuerrückerstattung|tax refund)$/i],
 ['intchg',/^(zinsbelastung|interest charge)$/i],['xfer',/^(umbuchung|transfer|transfer \(inbound\)|transfer \(outbound\))$/i]];
const TXN={buy:'Kauf',sell:'Verkauf',in:'Einlieferung',out:'Auslieferung',div:'Dividende',int:'Zinsen',dep:'Einlage',wd:'Entnahme',fee:'Gebühren',feeref:'Gebührenerstattung',tax:'Steuern',taxref:'Steuererstattung',intchg:'Zinsbelastung',xfer:'Umbuchung'};
const SECT=['buy','sell','in','out','div'];
const normName=s=>String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/\b(inc|corp|corporation|plc|ag|se|sa|nv|co|ltd|the|class|cl|reg|registered|shares?|aktie[n]?)\b\.?/g,' ').replace(/[^a-z0-9äöüß]+/g,' ').trim();
function parseDate(s){s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return null}
const isoToDe=s=>s?s.split('-').reverse().join('.'):'';
const todayISO=()=>new Date().toISOString().slice(0,10);
const daysBetween=(a,b)=>(Date.parse(b)-Date.parse(a))/864e5;
const secKey=t=>t.isin||t.symbol||('n:'+normName(t.name));

function analyzeTx(nonEmpty,d,head,fileName){
  const st={fileName,error:null,cols:{},tx:[],skipped:[],kind:'transactions',dupes:0,counts:{},from:null,to:null};
  const low=head.map(x=>x.toLowerCase().trim());const col=re=>low.findIndex(x=>re.test(x));
  const ci={date:col(/^datum|^date/),type:col(/^typ|^type/),
    value:[/^wert$/,/^value$/,/^gesamtpreis$/,/^betrag$/,/^amount$/].map(col).find(i=>i>=0)??-1,
    shares:col(/^stück|^shares|^anzahl/),fees:col(/^gebühren|^fees/),taxes:col(/^steuern|^taxes/),
    isin:col(/isin/),symbol:col(/ticker|symbol/),name:col(/wertpapiername|^wertpapier$|security name|^security$/),
    ccy:col(/buchungswährung|transaction currency|^währung$|^currency$/)};
  const L={date:'Datum',type:'Typ',value:'Wert',shares:'Stück',fees:'Gebühren',taxes:'Steuern',isin:'ISIN',symbol:'Symbol',name:'Wertpapier',ccy:'Währung'};
  Object.entries(ci).forEach(([k,i])=>{if(i>=0)st.cols[L[k]]=head[i]});
  if(ci.value<0){st.error='Spalte „Wert“ (oder „Betrag“) nicht gefunden. Erwartet wird ein Umsatz-Export aus Portfolio Performance.';return st}
  const seen=new Map();
  nonEmpty.slice(1).forEach(({l,i})=>{
    const r=splitL(l,d);const g=k=>ci[k]>=0?(r[ci[k]]||'').trim():'';
    const date=parseDate(g('date'));if(!date){st.skipped.push({line:i,reason:'Datum nicht lesbar'});return}
    const rawT=g('type');const ty=(TXT.find(([,re])=>re.test(rawT))||[])[0];
    if(!ty){st.skipped.push({line:i,reason:`Typ „${rawT||'leer'}“ wird nicht ausgewertet`});return}
    if(ty==='xfer'){st.skipped.push({line:i,reason:'Umbuchung zwischen Konten, für die Auswertung ohne Bedeutung'});return}
    const ccy=g('ccy').toUpperCase();if(ccy&&ccy!=='EUR'){st.skipped.push({line:i,reason:`Buchungswährung ${ccy}: bisher nur Euro-Konten`});return}
    const v=Math.abs(parseNum(g('value')));if(!Number.isFinite(v)){st.skipped.push({line:i,reason:'Wert nicht lesbar'});return}
    const sh=Math.abs(parseNum(g('shares')));const t={date,type:ty,value:Math.round(v*100)/100,shares:Number.isFinite(sh)&&sh>0?sh:null,
      fees:Math.abs(parseNum(g('fees')))||0,taxes:Math.abs(parseNum(g('taxes')))||0,isin:g('isin')||null,symbol:g('symbol')||null,name:g('name')||null,line:i};
    if(SECT.includes(ty)&&!t.isin&&!t.symbol&&!t.name){st.skipped.push({line:i,reason:`${TXN[ty]} ohne Wertpapier`});return}
    if(['buy','sell','in','out'].includes(ty)&&!t.shares){st.skipped.push({line:i,reason:`${TXN[ty]} ohne Stückzahl (vermutlich Kontobuchung; die Depotbuchung zählt)`});return}
    t.sk=SECT.includes(ty)?secKey(t):null;
    const key=[date,ty,t.sk||'',t.value.toFixed(2)].join('|');
    if(seen.has(key)){st.dupes++;const o=seen.get(key);if(!o.shares&&t.shares)Object.assign(o,t);return}
    seen.set(key,t);st.tx.push(t);
  });
  st.tx.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.line-b.line);
  st.tx.forEach(t=>st.counts[t.type]=(st.counts[t.type]||0)+1);
  if(st.tx.length){st.from=st.tx[0].date;st.to=st.tx[st.tx.length-1].date}
  else st.error='Keine auswertbaren Umsätze gefunden.';
  return st;
}
/* Mehrere Umsatzdateien (Depot- und Kontoumsätze) zusammenführen, doppelte Buchungen nur einmal */
function mergeTx(a,b){
  if(!a)return b;if(!b||b.error)return a;
  const out={...a,fileName:a.fileName+', '+b.fileName,skipped:a.skipped.concat(b.skipped.map(s=>({...s,file:b.fileName}))),dupes:a.dupes+b.dupes,counts:{}};
  const m=new Map(a.tx.map(t=>[[t.date,t.type,t.sk||'',t.value.toFixed(2)].join('|'),t]));
  b.tx.forEach(t=>{const k=[t.date,t.type,t.sk||'',t.value.toFixed(2)].join('|');if(m.has(k)){out.dupes++;const o=m.get(k);if(!o.shares&&t.shares)m.set(k,t)}else m.set(k,t)});
  out.tx=[...m.values()].sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
  out.tx.forEach(t=>out.counts[t.type]=(out.counts[t.type]||0)+1);out.from=out.tx[0]?.date||null;out.to=out.tx[out.tx.length-1]?.date||null;
  return out;
}
function matchPos(d,s){return d.positions.find(p=>(s.isin&&p.isin&&p.isin===s.isin)||(s.symbol&&p.symbol&&p.symbol.toUpperCase()===s.symbol.toUpperCase()))
  ||d.positions.find(p=>s.name&&normName(p.name)&&normName(p.name)===normName(s.name))||null}

/* Interner Zinsfuß (Geldgewichtete Rendite p. a.) per Bisektion */
function xirr(flows){
  if(flows.length<2)return null;const t0=flows[0][0];
  const f=r=>flows.reduce((a,[d,c])=>a+c/Math.pow(1+r,daysBetween(t0,d)/365),0);
  let lo=-0.99,hi=10,flo=f(lo),fhi=f(hi);if(!Number.isFinite(flo)||!Number.isFinite(fhi)||flo*fhi>0)return null;
  for(let i=0;i<200;i++){const mid=(lo+hi)/2,fm=f(mid);if(Math.abs(fm)<1e-7)return mid;if(fm*flo<0){hi=mid}else{lo=mid;flo=fm}}
  return (lo+hi)/2;
}

let _txc={k:null,v:null};
function txModel(d,nocache){
  if(!d||!d.tx||!d.tx.length)return null;
  const ck=d.kind+'|'+d.tx.length+'|'+d.positions.map(p=>p.id+':'+posValue(p)).join(',')+'|'+(d.txMeta&&d.txMeta.importedAt);
  if(!nocache&&_txc.k===ck)return _txc.v;
  const today=todayISO(),y1=new Date(Date.now()-365*864e5).toISOString().slice(0,10);
  const S={},M={dep:0,wd:0,fees:0,taxes:0,int:0,div:0,div12:0,first:d.tx[0].date,last:d.tx[d.tx.length-1].date};
  for(const t of d.tx){
    if(t.type==='dep')M.dep+=t.value;else if(t.type==='wd')M.wd+=t.value;
    else if(t.type==='fee'||t.type==='intchg')M.fees+=t.value;else if(t.type==='feeref')M.fees-=t.value;
    else if(t.type==='tax')M.taxes+=t.value;else if(t.type==='taxref')M.taxes-=t.value;else if(t.type==='int')M.int+=t.value;
    if(!t.sk)continue;
    const s=S[t.sk]||(S[t.sk]={sk:t.sk,name:t.name,isin:t.isin,symbol:t.symbol,lots:[],shares:0,cost:0,realized:0,div:0,div12:0,buys:0,sells:0,flows:[],first:t.date,unknownCost:false,oversold:false,fees:0,taxes:0});
    if(t.name&&!s.name)s.name=t.name;s.fees+=t.fees||0;s.taxes+=t.taxes||0;
    if(t.type==='buy'||t.type==='in'){const c=t.value;if(!(c>0))s.unknownCost=true;s.lots.push({sh:t.shares,c,date:t.date});s.shares+=t.shares;s.cost+=c;s.buys+=c;s.flows.push([t.date,-c])}
    else if(t.type==='sell'||t.type==='out'){let rem=t.shares,cs=0;
      while(rem>1e-9&&s.lots.length){const lot=s.lots[0],take=Math.min(rem,lot.sh),part=lot.sh>0?lot.c*take/lot.sh:0;cs+=part;lot.sh-=take;lot.c-=part;rem-=take;if(lot.sh<1e-9)s.lots.shift()}

  if(q.t&&daysBetween(q.t.slice(0,10),todayISO())>10)return null;
  let ccy=q.ccy,px=q.p;if(ccy==='GBp'||ccy==='GBX'){px/=100;ccy='GBP'}

  return {eurPx,px,ccy,t:q.t,src:q.src||PRICES.source||'Kursdienst',alt:q.alt||null};

      exportValue:v,valueStatus:priceCcy?'ok':'unclear',conf:null,manualValue:null,bucket:m?m.bucket:null,bucketSrc:m?'stamm':null,fund:m?m.fund:null,ter:m&&m.ter!=null?m.ter:null});
  });
  if(!st.positions.length&&!st.accounts.length)st.error='Keine gültigen Zeilen gefunden. Prüfe, ob die Spalte Marktwert Beträge enthält.';

}

/* =========================================================
   BERECHNUNG
   ========================================================= */
function posValue(p){if(p.conf==='skip')return null;const lv=liveValue(p);if(lv!=null)return lv;if(p.conf==='manual')return p.manualValue;if(p.valueStatus==='ok'||p.conf==='eur')return p.exportValue;return null}
function isIncluded(p){return posValue(p)!=null}
function unresolved(d){return d.positions.filter(p=>p.valueStatus==='unclear'&&!p.conf&&liveValue(p)==null)}
function noBucket(d){return d.positions.filter(p=>isIncluded(p)&&!p.bucket)}
function totals(d){
  const sec=d.positions.reduce((a,p)=>a+(isIncluded(p)?posValue(p):0),0);
  const acct=d.accounts.reduce((a,x)=>a+x.value,0);
  const ext=d.external.items.reduce((a,x)=>a+(+x.value||0),0);
  return {sec,acct,ext,reserve:+d.external.reserve||0,sum:sec+acct+ext,open:unresolved(d).length,skipped:d.positions.filter(p=>p.conf==='skip').length};
}
/* Bausteinwerte für Zielvergleich und Plan. Verrechnungskonto je nach Einstellung. */
function bucketVals(d,cashMode=d.cashMode){
  const V={};B.forEach(b=>V[b.id]=0);
  d.positions.forEach(p=>{if(isIncluded(p)&&p.bucket)V[p.bucket]+=posValue(p)});
  if(cashMode!=='exclude')V.liq+=d.accounts.reduce((a,x)=>a+x.value,0);
  d.external.items.forEach(x=>{const v=+x.value||0;if(x.type==='bonds')V.bonds+=v;else V.liq+=v});
  return V;
}
const tot=V=>Object.values(V).reduce((a,b)=>a+b,0);
function goalState(d){
  if(!d.goals)return {ok:false,reason:'none'};
  const bad=B.filter(b=>goalRaw[b.id]!=null);
  if(bad.length)return {ok:false,reason:'invalid',fields:bad.map(b=>b.id)};
  const sum=B.reduce((a,b)=>a+(d.goals[b.id]||0),0);
  if(Math.abs(sum-100)>0.05)return {ok:false,reason:'sum',sum};
  return {ok:true,sum};
}
function budgetState(d){if(budgetRaw!=null)return {ok:false,msg:budgetRaw};return {ok:true}}
/* Verteilung auf Bausteine, centgenau */
function allocate(d){
  const gs=goalState(d),bs=budgetState(d);if(!gs.ok||!bs.ok)return null;
  const V=bucketVals(d,d.cashMode==='invest'?'exclude':d.cashMode);
  const cash=d.cashMode==='invest'?d.accounts.reduce((a,x)=>a+x.value,0):0;
  const T=tot(V)+cash,Mc=Math.round((+d.budget||0)*100);
  const t={};B.forEach(b=>t[b.id]=(d.goals[b.id]||0)/100);
  let Ts=T;B.forEach(b=>{if(t[b.id]>0)Ts=Math.max(Ts,V[b.id]/t[b.id])});
  const need={};let ns=0;B.forEach(b=>{need[b.id]=Math.max(0,t[b.id]*Ts-V[b.id]);ns+=need[b.id]});
  const weights={};B.forEach(b=>weights[b.id]=ns>0?need[b.id]/ns:t[b.id]);
  const out={};let used=0;const rem=[];
  B.forEach(b=>{const raw=Mc*weights[b.id];out[b.id]=Math.floor(raw);used+=out[b.id];rem.push([b.id,raw-out[b.id]])});
  rem.sort((a,c)=>c[1]-a[1]);for(let i=0;i<Mc-used;i++)out[rem[i%rem.length][0]]++;
  const moves=[];const minC=(+d.minRate||0)*100;
  if(minC>0){const big=B.reduce((a,b)=>need[b.id]>need[a.id]?b:a,B[0]).id;
    B.forEach(b=>{if(b.id!==big&&out[b.id]>0&&out[b.id]<minC){moves.push({from:b.id,to:big,c:out[b.id]});out[big]+=out[b.id];out[b.id]=0}})}
  const amounts={};B.forEach(b=>amounts[b.id]=out[b.id]/100);
  return {V,T,cash,Ts,need,amounts,moves,ns};
}
function chosenAmounts(d,al){if(d.manual){const m={};B.forEach(b=>m[b.id]=Math.max(0,+d.manual[b.id]||0));return m}return al.amounts}
/* Pfad bei unveränderten Kursen */
function pathFor(d,al,amounts){
  const t={};B.forEach(b=>t[b.id]=(d.goals[b.id]||0)/100);
  const V={...al.V};
  if(al.cash>0){const tmpNs=al.ns||1;B.forEach(b=>V[b.id]+=al.cash*(al.ns>0?al.need[b.id]/tmpNs:t[b.id]))}
  const blocked=B.filter(b=>t[b.id]===0&&V[b.id]>0.5);
  const M=B.reduce((a,b)=>a+amounts[b.id],0);
  const tol=0.01;
  const dev=()=>{const T=tot(V);return T>0?Math.max(...B.map(b=>Math.abs(V[b.id]/T-t[b.id]))):1};
  let theo=null;
  if(!blocked.length){const T=tot(V);let Ts=T;B.forEach(b=>{if(t[b.id]>0)Ts=Math.max(Ts,V[b.id]/t[b.id])});const need=Ts-T;const Mb=+d.budget||0;theo=need<0.5?0:(Mb>0?Math.ceil(need/Mb):null)}
  if(blocked.length)return {blocked,theo:null,months:null};
  if(dev()<=tol)return {blocked:[],theo:0,months:0};
  if(M<=0)return {blocked:[],theo,months:null};
  for(let m=1;m<=600;m++){B.forEach(b=>V[b.id]+=amounts[b.id]);if(dev()<=tol)return {blocked:[],theo,months:m}}
  return {blocked:[],theo,months:Infinity};
}

   DEPOT-CHECK: Abweichungen, Datenfragen, Informationen

function checkModel(d){
  const tt=totals(d),out={dev:[],data:[],info:[]};
  const V=bucketVals(d),T=tot(V),gs=goalState(d);
  const incomplete=tt.open>0||noBucket(d).length>0;
  // Datenfragen
  if(tt.open)out.data.push({key:'open',lvl:'warn',t:`${tt.open} ${tt.open>1?'Positionen haben':'Position hat'} einen ungeklärten Wert`,d:`Die Kurswährung ist aus dem Export nicht erkennbar: ${unresolved(d).map(p=>p.name).join(', ')}. Diese Positionen fehlen in Gesamtwert, Gewichten und Zielvergleich.`,go:['depot','confirmCard'],act:'Zuordnungen prüfen'});
  const nb=noBucket(d);if(nb.length)out.data.push({key:'nobucket',lvl:'warn',t:`${nb.length} ${nb.length>1?'Positionen haben':'Position hat'} keinen Baustein`,d:'Ohne Baustein fehlen sie im Zielvergleich.',go:['depot','confirmCard'],act:'Baustein wählen'});
  const funds=d.positions.filter(p=>isIncluded(p)&&p.fund===true);const unkF=d.positions.filter(p=>isIncluded(p)&&p.fund==null);
  if(unkF.length)out.data.push({key:'unkfund',lvl:'na',t:`Bei ${unkF.length} ${unkF.length>1?'Positionen':'Position'} ist nicht bekannt, ob es ein Fonds ist`,d:'Für diese Positionen liegen keine Stammdaten vor; laufende Kosten sind deshalb nicht bekannt.',go:['depot','posCard'],act:'Positionen ansehen'});
  const tm=txModel(d);
  if(!tm)out.data.push({key:'perf',lvl:'na',t:'Wertentwicklung noch nicht berechenbar',d:'Dafür braucht Depotfokus deine Umsätze (Käufe, Verkäufe, Dividenden) aus Portfolio Performance.',go:['depot','importCard'],act:'Umsätze importieren'});
  else{tm.issues.forEach(s=>out.data.push({key:'tx-'+s.sk,lvl:'warn',t:`${s.name||s.symbol||s.isin}: ${s.mismatch?`laut Umsätzen ${num(s.shares,4)} Stück, im Bestand ${num(s.pos.qty,4)}`:s.missingPos?'laut Umsätzen noch im Bestand, fehlt in der Vermögensaufstellung':s.oversold?'mehr verkauft als gekauft':s.unknownCost?'Einstand unbekannt (Einlieferung ohne Wert)':'Wert ungeklärt, bitte Währung bestätigen'}`,d:s.held&&s.pos&&s.value==null&&!s.mismatch?'Ohne bestätigten Wert fehlt die Position in der Renditeberechnung.':'Diese Position fehlt in der Renditeberechnung. Meist fehlen ältere Umsätze im Export oder der Bestand ist von einem anderen Stichtag.',go:s.held&&s.pos&&s.value==null&&!s.mismatch?['depot','confirmCard']:s.pos?['pos',s.pos.id]:['depot','importCard'],act:s.held&&s.pos&&s.value==null&&!s.mismatch?'Wert bestätigen':s.pos?'Position ansehen':'Zum Import'}));
    if(tm.posNoTx.length)out.data.push({key:'notx',lvl:'na',t:`${tm.posNoTx.length} ${tm.posNoTx.length>1?'Positionen haben':'Position hat'} keine Umsätze`,d:`${tm.posNoTx.map(p=>p.name).join(', ')}. Sie fehlen in der Renditeberechnung.`,go:['depot','importCard'],act:'Zum Import'})}
  if(d.kind==='own'&&!d.valuationDate)out.data.push({key:'date',lvl:'na',t:'Bewertungsstichtag nicht bekannt',d:'Der Export enthält kein Datum. Du kannst es beim nächsten Import angeben.',go:['depot','importCard'],act:'Zum Import'});
  // Abweichungen von eigenen Vorgaben
  if(!d.goals)out.dev.push({key:'nogoals',lvl:'na',t:'Noch keine eigene Zielverteilung',d:'Ohne Vorgaben gibt es nichts zu vergleichen.',go:['plan','goalCard'],act:'Ziele festlegen'});
  else if(!gs.ok)out.dev.push({key:'goalsinvalid',lvl:'na',t:'Zielverteilung ungültig',d:gs.reason==='sum'?`Deine Vorgaben ergeben ${fz(gs.sum)} % statt 100 %.`:'Mindestens ein Eingabefeld ist ungültig.',go:['plan','goalCard'],act:'Vorgaben prüfen'});
  else{
    const pre=incomplete?' Vorläufig, weil Positionen fehlen.':'';
    B.forEach(b=>{const w=T?V[b.id]/T:0,g=d.goals[b.id]/100,diff=w-g;if(Math.abs(diff)>0.05)out.dev.push({key:'dev-'+b.id,lvl:Math.abs(diff)>0.10?'crit':'warn',
      t:`${b.name}: ${pct(w)} statt ${fz(d.goals[b.id])} %`,d:`${num(Math.abs(diff)*100,1)} Prozentpunkte ${diff>0?'darüber':'darunter'}${Math.abs(diff)>0.10?', deutlich':''}.${pre}`,go:['plan','allocCard'],act:'Zum Plan'})});
    const eqA=T?B.filter(b=>b.eq).reduce((a,b)=>a+V[b.id],0)/T:0,eqG=B.filter(b=>b.eq).reduce((a,b)=>a+d.goals[b.id],0)/100;
    if(Math.abs(eqA-eqG)>0.05)out.dev.push({key:'eq',lvl:Math.abs(eqA-eqG)>0.10?'crit':'warn',t:`Aktienquote ${pct(eqA,0)} statt ${pct(eqG,0)}`,d:`Aktien und Aktienfonds im Verhältnis zum betrachteten Vermögen.${pre}`,go:['plan','goalCard'],act:'Vorgaben ansehen'});
    if(d.maxSingle!=null){d.positions.filter(p=>isIncluded(p)&&(p.bucket==='single'||p.bucket==='bdc')).forEach(p=>{const w=posValue(p)/T;if(w>d.maxSingle/100)out.dev.push({key:'max-'+p.id,lvl:'warn',t:`${p.name}: ${pct(w)} des Vermögens`,d:`Über deiner Grenze von ${fz(d.maxSingle)} % je Einzelwert.${pre}`,go:['plan','maxSingle'],act:'Grenze ändern',pos:p.id})})}
    if(!out.dev.length)out.dev.push({key:'devok',lvl:'good',t:'Keine Abweichung über 5 Prozentpunkte',d:incomplete?'Gilt nur für die eingerechneten Positionen; das Depot ist unvollständig.':'Alle Bausteine liegen nah an deinen Vorgaben.',go:null});
  }
  // Informationen
  const known=funds.filter(p=>p.ter!=null),unk=funds.filter(p=>p.ter==null);
  const cost=known.reduce((a,p)=>a+posValue(p)*p.ter/100,0),kv=known.reduce((a,p)=>a+posValue(p),0);
  out.info.push({key:'cost',lvl:'info',t:funds.length?`Laufende Fondskosten: rund ${eur(cost)} pro Jahr`:'Keine Fonds mit bekannten Stammdaten',
    d:funds.length?`Berechnet für ${known.length} von ${funds.length} Fonds (Ø ${num(kv?cost/kv*100:0,2)} %).${unk.length?` Bei ${unk.length} Fonds ist die TER nicht bekannt; sie zählt nicht als 0.`:''} Die laufenden Kosten sind bereits im Fondswert berücksichtigt; Handels- und Depotkosten sind nicht enthalten.`:'',go:['depot','posCard'],act:'Fonds ansehen'});
  const inc=d.positions.filter(isIncluded).sort((a,c)=>posValue(c)-posValue(a)).slice(0,3);
  out.info.push({key:'conc',lvl:'info',t:'Größte Positionen',d:(inc.map(p=>`${p.name} ${pct(posValue(p)/tt.sum)}`).join(' · ')||'–')+'. Länderanteile: nicht verfügbar, dafür fehlen geprüfte Bestandsdaten der Fonds.',go:['depot','posCard'],act:'Positionen'});
  const checked=d.positions.filter(p=>isIncluded(p)&&PAY[p.symbol]&&PAY[p.symbol].cover);const notMet=checked.filter(p=>PAY[p.symbol].cover==='not_met');
  if(checked.length)out.info.push({key:'divcheck',lvl:'info',t:'Geprüfte Ausschüttungsdeckung',d:`${checked.length} Positionen mit hinterlegter Prüfung. ${notMet.length?`Nicht erfüllt: ${notMet.map(p=>p.name).join(', ')}.`:'Bei allen geprüften erfüllt.'} Für alle übrigen Positionen nicht geprüft.`,go:notMet.length?['pos',notMet[0].id]:null,act:notMet.length?'Position ansehen':null});
  return {...out,incomplete};
}
/* „Jetzt wichtig“: höchstens drei Punkte */
function nowItems(d){
  const c=checkModel(d),items=[];
  c.data.filter(x=>x.lvl==='warn').forEach(x=>items.push(x));

}

function addEvent(d,e){d.events.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:nowStr(),...e});d.events=d.events.slice(0,50)}
function evaluateChanges(d,first){
  const keys=checkModel(d).dev.filter(x=>x.lvl==='crit').map(x=>x.key).concat(unresolved(d).length?['open']:[]);
  if(d.baseline==null||first){d.baseline=keys;return}
  const added=keys.filter(k=>!d.baseline.includes(k));
  if(added.length&&d.notify.change){const c=checkModel(d);const all=[...c.dev,...c.data];
    added.forEach(k=>{const it=all.find(x=>x.key===k);if(it)addEvent(d,{t:it.t,b:it.d,go:it.go})})}
  d.baseline=keys;
}

const fmtAsOf=s=>{if(!s)return 'unbekannt';const d=new Date(s);return isNaN(d)?s:d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})};

/* =========================================================
   ZEITREISE: monatliche Dividende in 20 Jahren, drei Szenarien
   Keine Prognose, sondern eine Rechnung mit offenen, änderbaren Annahmen.
   ========================================================= */
const Z_H=240;                       // Monate
const Z_SC=[{k:'vors',n:'vorsichtig',f:-1},{k:'mit',n:'mittel',f:0},{k:'gut',n:'gut',f:1}];
const Z_SPREAD={liq:0,bonds:1,core:4,hdy:4,single:5,bdc:5,ndq:6};
const Z_INFL=0.02;
function zcfg(d){
  if(!d.zeit)d.zeit={assume:{},reinvest:true,save:true,real:false,cuts:{}};
  const z=d.zeit;z.cuts=z.cuts||{};
  B.forEach(b=>{if(!z.assume[b.id])z.assume[b.id]={g:ASSUME[b.id][0],y:ASSUME[b.id][1],s:Z_SPREAD[b.id]}});
  return z;
}
function zResetAssume(d){const z=zcfg(d);z.assume={};zcfg(d)}

/* Startbestand: eingerechnete Positionen mit Baustein, Konto/Tagesgeld, Anleihen außerhalb, leere Ziel-Bausteine */
function zItems(d){
  const items=d.positions.filter(p=>isIncluded(p)&&p.bucket).map(p=>({key:p.id,name:p.name,sym:p.symbol,b:p.bucket,v:posValue(p)}));
  const liq=(d.cashMode==='exclude'?0:d.accounts.reduce((a,x)=>a+x.value,0))+d.external.items.filter(x=>x.type!=='bonds').reduce((a,x)=>a+(+x.value||0),0);
  if(liq>0)items.push({key:'_liq',name:'Konto & Tagesgeld',b:'liq',v:liq});
  const bo=d.external.items.filter(x=>x.type==='bonds').reduce((a,x)=>a+(+x.value||0),0);
  if(bo>0)items.push({key:'_bonds',name:'Anleihen außerhalb',b:'bonds',v:bo});
  if(goalState(d).ok)B.forEach(b=>{if(d.goals[b.id]>0&&!items.some(i=>i.b===b.id))items.push({key:'_neu_'+b.id,name:'Neu: '+b.name,b:b.id,v:0})});
  return items;
}

/* Monatliche Simulation. Ergebnis: Summen und Einzelwerte (Dividende brutto je Monat) für jedes Szenario und jeden Monat. */
function zSim(d){
  const z=zcfg(d),items=zItems(d),n=items.length,gs=goalState(d);
  const budget=z.save?Math.max(0,+d.budget||0):0;
  const res={items,tot:[],per:[],val:[],budget,reinvest:z.reinvest};
  for(const sc of Z_SC){
    const v=items.map(i=>i.v),tot=new Float64Array(Z_H+1),val=new Float64Array(Z_H+1),per=[],vper=[];
    const gm=items.map(i=>{const a=z.assume[i.b];return Math.pow(1+Math.max(-0.5,(a.g+sc.f*a.s)/100),1/12)});
    const y=items.map(i=>Math.max(0,z.assume[i.b].y)/100/12);
    for(let m=0;m<=Z_H;m++){
      const div=new Float64Array(n);let s=0,vs=0;
      for(let i=0;i<n;i++){const c=z.cuts[items[i].key];const cut=c&&c.pct&&m>=c.from*12?1-c.pct/100:1;div[i]=v[i]*y[i]*cut;s+=div[i];vs+=v[i]}
      tot[m]=s;val[m]=vs;per.push(div);vper.push(Float64Array.from(v));
      if(m===Z_H)break;
      for(let i=0;i<n;i++){v[i]*=gm[i];if(z.reinvest)v[i]+=div[i]*(1-TAX)}
      if(budget>0){
        // Sparrate wie im Plan: zuerst Bausteine unter Ziel, sonst nach Zielquote; ohne Ziele nach heutiger Gewichtung
        const V={};B.forEach(b=>V[b.id]=0);items.forEach((it,i)=>V[it.b]+=v[i]);const T=vs+budget;
        const w={};let ws=0;
        if(gs.ok){B.forEach(b=>{w[b.id]=Math.max(0,d.goals[b.id]/100*T-V[b.id]);ws+=w[b.id]});if(ws<1e-9){B.forEach(b=>{w[b.id]=d.goals[b.id]/100});ws=1}}
        else{B.forEach(b=>{w[b.id]=V[b.id];ws+=V[b.id]})}
        if(ws>0)B.forEach(b=>{const amt=budget*w[b.id]/ws;if(amt<=0)return;const idx=items.map((it,i)=>it.b===b.id?i:-1).filter(i=>i>=0);if(!idx.length)return;
          const bv=idx.reduce((a,i)=>a+v[i],0);idx.forEach(i=>v[i]+=bv>0?amt*v[i]/bv:amt/idx.length)});
      }
    }
    res.tot.push(tot);res.per.push(per);res.val.push(val);(res.vper=res.vper||[]).push(vper);
  }
  return res;
}
const zDefl=(d,m)=>zcfg(d).real?Math.pow(1+Z_INFL,m/12):1;
const zYear=m=>new Date().getFullYear()+Math.round(m/12*10)/10;
const zYearOf=m=>new Date().getFullYear()+Math.round(m/12);
const zYearLbl=m=>m===0?'heute':`in ${num(m/12,m%12?1:0)} Jahren · ${zYearOf(m)}`;

/* Kandidaten für Weichen: Positionen mit nicht erfüllter Bedingung oder eingetretenem Risiko */
function zRiskItems(d,items){return items.filter(it=>{const I=INFO[it.sym];return I&&I.rules&&I.rules.some(r=>r.status==='not_met'||r.status==='occurred')})}

  if(zState.simKey!==key){zState.sim=zSim(d);zState.simKey=key}return zState.sim}

  <details class="card"><summary class="strong">Annahmen je Baustein</summary>
    <p class="small muted2" style="margin:8px 0">Kursentwicklung pro Jahr (mittel), Spanne nach unten und oben für „vorsichtig“ und „gut“, Dividendenrendite brutto. Die Dividende wächst mit dem Wert der Position.</p>
    <div class="zass"><span></span><span class="small muted2">Kurs %</span><span class="small muted2">± %</span><span class="small muted2">Rendite %</span>
    ${B.map(b=>{const a=z.assume[b.id];return `<span class="small strong"><i class="dot" style="background:var(${b.c})"></i> ${b.name}</span>${['g','s','y'].map(k=>`<input class="numin" type="text" inputmode="decimal" data-za="${b.id}|${k}" value="${num(a[k],1)}" aria-label="${b.name} ${k==='g'?'Kursentwicklung':k==='s'?'Spanne':'Dividendenrendite'}">`).join('')}`}).join('')}</div>
    <button class="link" id="zReset" type="button" style="margin-top:8px">Standardwerte</button></details>
  ${zTipHTML(d)}

function zAt(S,sc,m,d){return S.tot[sc][m]/zDefl(d,m)}
function zHeadHTML(d,S,m){
  const lo=zAt(S,0,m,d),mid=zAt(S,1,m,d),hi=zAt(S,2,m,d),now=S.tot[1][0];
  return `<span class="lbl">Monatliche Dividende ${m===0?'heute':'im Jahr '+zYearOf(m)}</span>
   <span class="big" style="font-size:34px">${eur(mid)}</span>
   <span class="small muted-night">Spanne ${eur(lo)} bis ${eur(hi)} · heute ${eur(now)}${zcfg(d).real?' · in heutiger Kaufkraft':''}</span>
   <span class="small muted-night">Depotwert dann ${eur(S.val[1][m]/zDefl(d,m))} (${eur(S.val[0][m]/zDefl(d,m))} bis ${eur(S.val[2][m]/zDefl(d,m))})</span>`;
}
const zAria=(d,S,m)=>`${zYearLbl(m)}: ${eur(zAt(S,1,m,d))} im Monat, Spanne ${eur(zAt(S,0,m,d))} bis ${eur(zAt(S,2,m,d))}`;
function zChartSVG(d,S,m){
  const W=340,H=190,L=44,R=8,T=10,Bm=22,w=W-L-R,h=H-T-Bm;
  const max=Math.max(1,...Array.from({length:Z_H+1},(_,i)=>zAt(S,2,i,d)))*1.05;
  const X=i=>L+i/Z_H*w,Y=v=>T+h-v/max*h;
  const pts=sc=>Array.from({length:Z_H/3+1},(_,k)=>k*3).map(i=>`${X(i).toFixed(1)},${Y(zAt(S,sc,i,d)).toFixed(1)}`);
  const band=`M${pts(2).join(' L')} L${pts(0).reverse().join(' L')} Z`;
  const ticks=[0,0.5,1].map(f=>max/1.05*f);

/* =========================================================
   DIVIDENDENKALENDER (#kalender)
   Angekündigt: data/dividends.json, jede Zahlung mit Quelle.
   Geschätzt:   aus deinen Umsätzen der letzten 12 Monate, gleicher Termin ein Jahr später,
                hochgerechnet auf deinen heutigen Bestand. Höhe wie zuletzt gebucht (netto).
   Erhalten:    gebuchte Dividenden der letzten 12 Monate.
   ========================================================= */
const KAL={tab:'kommend'};
const MONAT=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
// ISO-Datum um Jahre verschieben; 29.02. wird zum 28.02.
function isoYears(iso,y){const [a,b,c]=iso.split('-');return `${+a+y}-${b}-${b==='02'&&c==='29'?'28':c}`}
const isoLong=iso=>new Date(iso+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const isoShort=iso=>new Date(iso+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
function fxRate(ccy){if(ccy==='EUR')return 1;const r=PRICES&&PRICES.fx&&PRICES.fx[ccy];return r>0?r:null}
const ccySym=c=>({USD:'$',EUR:'€',DKK:'DKK',GBP:'£',CHF:'CHF'})[c]||c;

function kalModel(d){
  const today=todayISO(),end=isoYears(today,1),start=isoYears(today,-1);
  const m=txModel(d),items=[];
  const held=d.positions.filter(p=>p.qty!=null&&p.qty>0&&p.conf!=='skip');
  // 1. Angekündigt (mit Quelle)
  ((typeof DIVS!=='undefined'&&DIVS.items)||[]).forEach(x=>{
    const p=held.find(q=>q.symbol===x.sym);if(!p||x.pay<today||x.pay>end)return;
    const r=fxRate(x.ccy),gross=x.amount*p.qty,eurGross=r?gross/r:null;
    items.push({state:'announced',p,name:p.name,pay:x.pay,ex:x.ex,per:x.amount,ccy:x.ccy,qty:p.qty,gross,eurGross,net:eurGross!=null?eurGross*(1-TAX):null,label:x.label,src:x.src});
  });
  // 2. Geschätzt aus den Umsätzen
  if(m)m.secs.filter(s=>s.held&&s.pos).forEach(s=>{
    const p=s.pos,qty=p.qty!=null?p.qty:s.shares;
    d.tx.filter(t=>t.type==='div'&&t.sk===s.sk&&t.date>start&&t.date<=today).forEach(t=>{
      const pay=isoYears(t.date,1);if(pay<=today||pay>end)return;
      if(items.some(i=>i.p===p&&i.state==='announced'&&Math.abs(daysBetween(i.pay,pay))<=20))return;
      const net=t.shares&&qty?t.value/t.shares*qty:t.value;
      items.push({state:'estimated',p,name:p.name,pay,ex:null,net,qty,basis:t});
    });
  });
  items.sort((a,b)=>a.pay<b.pay?-1:a.pay>b.pay?1:a.name.localeCompare(b.name));
  // 3. Erhalten
  const got=m?d.tx.filter(t=>t.type==='div'&&t.date>start&&t.date<=today).map(t=>{const s=m.secs.find(x=>x.sk===t.sk);
    return {state:'paid',name:s&&s.pos?s.pos.name:(s&&s.name)||t.name||'Unbekanntes Wertpapier',pay:t.date,net:t.value,qty:t.shares,t}}).sort((a,b)=>a.pay<b.pay?1:a.pay>b.pay?-1:0):[];
  const sum=l=>l.reduce((a,x)=>a+(x.net||0),0);
  const months=[];for(let i=0;i<12;i++){const dt=new Date();dt.setDate(1);dt.setMonth(dt.getMonth()+i);const k=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
    months.push({k,label:MONAT[dt.getMonth()],v:sum(items.filter(x=>x.pay.slice(0,7)===k))})}
  return {items,got,months,hasTx:!!m,total:sum(items),totalGot:sum(got),noEur:items.filter(x=>x.net==null).length,
    nAnn:items.filter(x=>x.state==='announced').length,nEst:items.filter(x=>x.state==='estimated').length,today};
}

  const amt=x.net!=null?eur(x.net,2):`${num(x.gross,2)} ${ccySym(x.ccy)}`;
  let det='';
  if(x.state==='announced')det=`<dl class="kv"><dt>Ex-Tag</dt><dd class="num">${isoToDe(x.ex)}</dd><dt>Zahltag</dt><dd class="num">${isoToDe(x.pay)}</dd>
    <dt>Je Aktie</dt><dd class="num">${num(x.per,3)} ${ccySym(x.ccy)}</dd><dt>Stück</dt><dd class="num">${num(x.qty,x.qty%1?4:0)}</dd>
    <dt>Brutto</dt><dd class="num">${num(x.gross,2)} ${ccySym(x.ccy)}${x.eurGross!=null&&x.ccy!=='EUR'?` ≈ ${eur(x.eurGross,2)}`:''}</dd>
    <dt>Netto</dt><dd class="num">${x.net!=null?'≈ '+eur(x.net,2):'Devisenkurs fehlt'}</dd></dl>
    <p class="hint">${esc(x.label)}. Netto nach 26,375 % Steuer, ohne Kirchensteuer und Sparerpauschbetrag${x.ccy!=='EUR'?', zum heutigen Devisenkurs':''}.</p>${srcLink(x.src)}`;
  else if(x.state==='estimated')det=`<dl class="kv"><dt>Zahltag</dt><dd>um den ${isoToDe(x.pay)}</dd><dt>Ex-Tag</dt><dd>noch nicht bekannt</dd>
    <dt>Grundlage</dt><dd>Buchung vom ${isoToDe(x.basis.date)}: ${eur(x.basis.value,2)} netto${x.basis.shares?` für ${num(x.basis.shares,x.basis.shares%1?4:0)} Stück`:''}</dd>
    <dt>Hochgerechnet</dt><dd>${x.basis.shares?`auf ${num(x.qty,x.qty%1?4:0)} Stück heute`:'ohne Stückzahl, Betrag wie gebucht'}</dd></dl>

  else det=`<dl class="kv"><dt>Gebucht am</dt><dd class="num">${isoToDe(x.pay)}</dd><dt>Netto</dt><dd class="num">${eur(x.net,2)}</dd>${x.t.taxes?`<dt>Steuern</dt><dd class="num">${eur(x.t.taxes,2)}</dd>`:''}${x.qty?`<dt>Stück</dt><dd class="num">${num(x.qty,x.qty%1?4:0)}</dd>`:''}</dl><p class="hint">Aus deinen Umsätzen.</p>`;
  return `<details class="card krow ${x.state==='estimated'?'est':''}"><summary><span class="kav" aria-hidden="true">${esc(initials(x.name))}</span>
    <span class="col" style="min-width:0"><span class="kn">${esc(x.name)}</span><span class="small muted2">${isoLong(x.pay)}</span></span>
    <span class="kamt"><span class="num strong">${amt}</span>${tag}</span></summary><div class="kdet">${det}</div></details>`;
}

  const head=`<div class="row" style="gap:6px"><a href="#heute" class="icon-btn" aria-label="Zurück">${ICON.back}</a><h1 class="h1" style="font-size:26px">Dividendenkalender</h1></div>

    <span class="small muted-night">${up?`${K.nAnn} angekündigt, ${K.nEst} geschätzt${K.noEur?` · ${K.noEur} ohne Euro-Wert`:''} · im Monat Ø ${eur(K.total/12)}`:`${K.got.length} Buchungen aus deinen Umsätzen`}</span>
    ${up?`<div class="kbars" role="group" aria-label="Dividenden je Monat">${K.months.map(x=>`<button type="button" data-kmonth="${x.k}" class="${x.k===now?'now':''}" aria-label="${x.label}: ${eur(x.v)}"><span class="kv0">${x.v>=1?num(x.v,0):''}</span><i style="height:${Math.max(2,x.v/max*58)}px"></i><span>${x.label.slice(0,3)}</span></button>`).join('')}</div>`:''}

  const seg=`<div class="seg" role="group" aria-label="Ansicht"><button type="button" data-ktab="kommend" aria-pressed="${up}">Kommend</button><button type="button" data-ktab="erhalten" aria-pressed="${!up}">Erhalten</button></div>`;
  let body;
  if(!list.length)body=up?`<div class="empty">Für deine Positionen ist in den nächsten 12 Monaten noch keine Zahlung angekündigt.${K.hasTx?' In deinen Umsätzen der letzten 12 Monate stehen keine Dividenden, aus denen sich etwas schätzen ließe.':' Mit deinen Umsätzen schätzt Depotfokus die kommenden Zahlungen aus den letzten 12 Monaten.'}</div>${K.hasTx?'':'<a class="btn" href="#daten">Umsätze importieren</a>'}`
    :`<div class="empty">${K.hasTx?'In den letzten 12 Monaten ist keine Dividende gebucht.':'Erhaltene Dividenden stehen in deinen Umsätzen. Importiere sie aus Portfolio Performance.'}</div>${K.hasTx?'':'<a class="btn" href="#daten">Umsätze importieren</a>'}`;
  else body=groups.map(g=>{const [y,mo]=g.k.split('-');const s=g.items.reduce((a,x)=>a+(x.net||0),0);
    return `<h2 class="kmon" id="km-${g.k}"><span>${MONAT[+mo-1]} ${y}</span><span class="num">${eur(s,2)}</span></h2>${g.items.map(kalRow).join('')}`}).join('');
  const foot=up?`<p class="hint">Angekündigt heißt: vom Unternehmen erklärt, mit Quelle. Geschätzt heißt: gleicher Termin und gleiche Höhe wie die Buchung vor einem Jahr, auf deinen heutigen Bestand hochgerechnet. ${K.hasTx?'':'Ohne Umsätze gibt es keine Schätzungen. '}Keine Anlageberatung.</p>`:'<p class="hint">Beträge netto, wie in Portfolio Performance gebucht.</p>';
  return head+sum+seg+(up&&!K.hasTx&&list.length?'<a class="banner info" href="#daten"><b>Nur angekündigte Zahlungen</b><span>Importiere deine Umsätze, dann schätzt Depotfokus auch die übrigen Termine.</span></a>':'')+body+foot;

/* ---------------- Story (wie WhatsApp-Status) ----------------

   Nach dem letzten Teil folgt die Story der nächsten Position. */
let storyIdx=0,storyId=null,storyT=null,storyRem=0,storyStart=0,storyPaused=false,storySpeed=1,tapDown=0,tapLong=false;
const reducedMotion=()=>!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function storySlides(p){const I=INFO[p.symbol];const sl=[];
  const n=newReports(p.symbol)[0];if(n)sl.push({lbl:'Bei der SEC erkannt',kind:'news',t:`Neuer Bericht: ${n.label} vom ${deDate(n.date)}.`,sub:newsLine(p.symbol)+` Die folgende Einordnung ist vom ${deDate(I.checked)}.`,url:n.url,src:null});

  if(I.facts[0])sl.push({lbl:'Fakt aus dem Bericht',kind:I.facts[0].kind,t:I.facts[0].t,src:I.facts[0].src});
  const r=I.rules[0];if(r)sl.push({lbl:'Worauf wir achten',kind:'rule',t:r.q,rule:r,src:r.src});
  return sl}
const slideDur=s=>Math.round(Math.min(14000,Math.max(6000,3500+(s.t.length+(s.rule?140:0)+(s.sub?s.sub.length:0))*45))*storySpeed);
function vStory(id){
  const p=posById(id);if(!p||!hasStory(p))return `<div class="col" style="gap:14px"><h1 class="big" style="font-size:26px">Keine Story verfügbar</h1><p>Für diese Position liegt noch keine geprüfte Einordnung vor.</p><a class="btn light" href="#heute">Zurück</a></div>`;
  if(storyId!==id){storyId=id;storyIdx=0}
  {const sk=storyKey(p);if(!FUN.seen.includes(sk)){FUN.seen.push(sk);FUN.seen=FUN.seen.slice(-300);saveFun()}}
  const sl=storySlides(p);storyIdx=Math.min(storyIdx,sl.length-1);const s=sl[storyIdx],tt=totals(D());
  const list=storyPositions(),k=list.findIndex(x=>x.id===id);
  const und=FUN.understood.includes(id);
  return `
  <div class="prog" role="progressbar" aria-label="Teil ${storyIdx+1} von ${sl.length}" aria-valuemin="1" aria-valuemax="${sl.length}" aria-valuenow="${storyIdx+1}">${sl.map((_,i)=>`<span class="${i<storyIdx?'done':i===storyIdx?'cur':''}"><i></i></span>`).join('')}</div>
  <div class="row">
    <span class="av light">${esc(initials(p.name))}</span>
    <div class="col" style="flex:1;min-width:0"><span class="strong">${esc(p.name)}</span><span class="small muted-night">${pct(posValue(p)/tt.sum)} ${D().kind==='demo'?'des Musterdepots':'deines Depots'} · Stand ${deDate(INFO[p.symbol].checked)}, ${methodTxt(INFO[p.symbol])}</span></div>
    <button type="button" class="icon-btn night" id="storyPause" aria-label="${reducedMotion()?'Automatisch weiter':'Pause'}">${reducedMotion()?ICON.play:ICON.pause}</button>

  </div>

    <button type="button" class="tap next" data-story="next" aria-label="${storyIdx<sl.length-1?'Nächster Teil':k<list.length-1?'Nächste Story: '+esc(list[k+1].name):'Stories beenden'}"></button>
    <span class="lbl night">${esc(s.lbl)}</span>
    ${s.kind==='news'?'<span class="tag new" style="align-self:flex-start">Neuer Bericht</span>':s.kind!=='rule'&&s.kind!=='interp'?`<span>${kindTag(s.kind)}</span>`:''}
    <h1 class="big story-h">${esc(s.t)}</h1>
    ${s.rule?`<div class="story-box"><div class="row between"><span>Stand ${esc(s.rule.per)}</span><span class="st ${stCls(s.rule)}">${STATUS[s.rule.type][s.rule.status]}</span></div><span class="small muted-night">${esc(s.rule.metric)}: ${esc(s.rule.cond)}${s.rule.obs?` · beobachtet ${esc(s.rule.obs)}`:''}</span><span class="small muted-night">Nächste Prüfung: ${esc(s.rule.next)}</span></div>`:''}
    ${s.kind==='news'?`<span class="small muted-night">${esc(s.sub)}</span><a class="story-link" href="${esc(s.url)}" target="_blank" rel="noopener">Bericht bei der SEC öffnen ${ICON_EXT}</a>`:''}
    ${s.src?`<span class="small muted-night">Quelle: ${srcText(s.src)}</span>`:s.kind==='interp'?'<span class="small muted-night">Interpretation von Depotfokus auf Basis der Quellen</span>':''}
  </div>

    <span class="small muted-night center">${k>=0?`Story ${k+1} von ${list.length}`:''}${k<list.length-1?` · danach ${esc(list[k+1].name)}`:''}</span>

}
function stopStory(){clearTimeout(storyT);storyT=null}
function armStory(){
  stopStory();const p=posById(storyId);if(!p||!hasStory(p))return;const sl=storySlides(p);
  storyRem=slideDur(sl[storyIdx]);storyPaused=false;const v=$('#view');v.classList.remove('paused');
  const bar=v.querySelector('.prog .cur i');if(bar)bar.style.animationDuration=storyRem+'ms';
  if(reducedMotion()){storyPaused=true;v.classList.add('paused','manual');return}
  storyStart=Date.now();storyT=setTimeout(()=>storyStep(1),storyRem);
}
function pauseStory(){if(storyPaused)return;storyPaused=true;if(storyT){clearTimeout(storyT);storyT=null;storyRem-=Date.now()-storyStart}$('#view').classList.add('paused');pauseBtn()}
function resumeStory(){if(!storyPaused)return;storyPaused=false;const v=$('#view');v.classList.remove('paused','manual');storyStart=Date.now();storyT=setTimeout(()=>storyStep(1),Math.max(400,storyRem));pauseBtn()}
function pauseBtn(){const b=$('#storyPause');if(b){b.innerHTML=storyPaused?ICON.play:ICON.pause;b.setAttribute('aria-label',storyPaused?'Weiter abspielen':'Pause')}}
function storyStep(dir){
  if(parse().r!=='story')return;
  if(!FUN.storyHint){FUN.storyHint=true;saveFun()}
  const list=storyPositions(),p=posById(storyId);if(!p)return;const sl=storySlides(p),k=list.findIndex(x=>x.id===storyId);
  const i=storyIdx+dir;stopStory();
  if(i>=sl.length){const n=list[k+1];if(n)location.replace('#story/'+encodeURIComponent(n.id));else location.replace('#heute');return}
  if(i<0){const pr=list[k-1];if(pr)location.replace('#story/'+encodeURIComponent(pr.id));else{storyIdx=0;rerender()}return}
  storyIdx=i;rerender();
}
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('.tap');if(!t)return;tapDown=Date.now();tapLong=false;pauseStory()});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,e=>{if(!tapDown)return;const held=Date.now()-tapDown;tapDown=0;if(held>350){tapLong=true;resumeStory()}},true));
document.addEventListener('keydown',e=>{const tg=e.target&&e.target.nodeType===1?e.target:document.body;if(parse().r!=='story'||tg.matches('input,select,textarea'))return;
  if(e.key==='ArrowRight'){e.preventDefault();storyStep(1)}else if(e.key==='ArrowLeft'){e.preventDefault();storyStep(-1)}
  else if(e.key==='Escape'){location.hash='#heute'}else if(e.key===' '&&!tg.closest('button,a')){e.preventDefault();storyPaused?resumeStory():pauseStory()}});

/* ---------------- Entscheidungs-Check ---------------- */
let chk={reason:null,sleep:true,id:null};
function vCheck(id,intent){
  const d=D(),p=posById(id);if(!p)return `<h1 class="h1">Nicht gefunden</h1><a class="btn" href="#depot">Zum Depot</a>`;
  if(chk.id!==id+intent)chk={reason:null,sleep:true,id:id+intent};
  const buy=intent==='kauf',I=INFO[p.symbol],V=bucketVals(d),T=tot(V),gs=goalState(d);
  let plan,planOk=null;
  if(!p.bucket)plan='Die Position hat keinen Baustein; ein Vergleich mit deinem Plan ist nicht möglich.';
  else if(!gs.ok)plan='Du hast noch keine gültige Zielverteilung. Lege sie im Plan fest, dann prüfen wir das hier.';
  else{const w=V[p.bucket]/T,g=d.goals[p.bucket]/100,under=w<g-0.005;planOk=buy?under:!under;
    plan=`${BN[p.bucket].name}: ${pct(w)} heute, dein Ziel ${fz(d.goals[p.bucket])} %. Ein ${buy?'Kauf':'Verkauf'} bringt dich ${planOk?'näher an':'weiter weg von'} deinem Ziel.`;
    const v=posValue(p);if(d.maxSingle!=null&&v!=null&&(p.bucket==='single'||p.bucket==='bdc')){const pw=v/tt0();if(buy&&pw>=d.maxSingle/100)plan+=` Die Position liegt mit ${pct(pw)} schon über deiner Grenze von ${fz(d.maxSingle)} %.`}}
  const cost=p.fund?(p.ter!=null?`Laufende Fondskosten ${num(p.ter,2)} % pro Jahr. `:'Laufende Kosten nicht bekannt. '):'';
  const R=[['plan','Weg vom Ziel'],['news','Neue Information'],['drop',buy?'Kurs ist gefallen':'Kurs ist gefallen'],['tip','Tipp von anderen']];
  const rule=I&&I.rules?I.rules.find(r=>r.status!=='np'):null;
  let score=0;if(chk.reason){score=chk.reason==='plan'||chk.reason==='news'?2:1;if(planOk===true)score++;if(planOk===false)score--;if(chk.sleep)score++}score=Math.max(0,Math.min(4,score));
  const qual=chk.reason?['Schwach begründet','Schwach begründet','Ausbaufähig','Gut begründet','Sehr gut begründet'][score]:'Wähle einen Grund';
  return `
  <div class="row" style="gap:6px"><a href="#pos/${encodeURIComponent(id)}" class="icon-btn" aria-label="Zurück">${ICON.back}</a><div class="col"><span class="lbl">Entscheidungs-Check</span><h1 class="big" style="font-size:22px">${buy?'Kauf':'Verkauf'}: ${esc(p.name)}</h1></div></div>
  <section class="card step"><span class="num-c c1" aria-hidden="true">1</span><div class="col" style="gap:3px"><span class="strong">Passt es zu deinem Plan?</span><span class="small muted2">${esc(plan)}</span>${!gs.ok?'<a class="link" href="#plan">Zum Plan →</a>':''}</div></section>
  ${(()=>{const mo=motivesFor(d,p);return `<a class="card row why-line" href="#haus/${encodeURIComponent(id)}"><span class="strong small">Dein Warum:</span><span>${mo.list.map(k=>MOTIVE[k].e+' '+MOTIVE[k].t).join(' · ')}</span>${mo.own?'':'<span class="small muted2">(Vorschlag)</span>'}</a>`})()}
  <section class="card step"><span class="num-c c2" aria-hidden="true">2</span><div class="col" style="gap:3px"><span class="strong">Was kostet es?</span><span class="small muted2">${esc(cost)}${buy?'Ordergebühr laut deinem Broker.':esc(sellCost(d,p))}</span>${!buy&&!txModel(d)?'<a class="link" href="#daten">Umsätze importieren →</a>':''}</div></section>
  <section class="card col" style="gap:10px"><div class="step"><span class="num-c c3" aria-hidden="true">3</span><span class="strong" id="whyLbl" style="padding-top:3px">Warum gerade jetzt?</span></div>
    <div class="reasons" role="group" aria-labelledby="whyLbl">${R.map(([k,l])=>`<button type="button" data-reason="${k}" aria-pressed="${chk.reason===k}">${l}</button>`).join('')}</div>
    ${chk.reason==='drop'?`<p class="hint-box">Ein gefallener Kurs allein ist selten ein guter Grund. Was hat sich am Geschäft geändert?${!buy&&motivesFor(d,p).list.includes('einkommen')?' Du hast diese Position wegen des Einkommens: Die Dividende hängt nicht am Kurs, sondern an den Erträgen der Firma.':''}</p>`:''}
    ${chk.reason==='tip'?'<p class="hint-box">Tipps von anderen kennen deinen Plan nicht. Prüfe Schritt 1 besonders genau.</p>':''}</section>
  <section class="card step"><span class="num-c c4" aria-hidden="true">4</span><div class="col" style="gap:3px"><span class="strong">Was würde dich umstimmen?</span><span class="small muted2">${rule?`Zum Beispiel: ${esc(rule.metric)} – ${esc(rule.cond)} (${esc(rule.next)}).`:'Überlege dir eine konkrete Bedingung, bevor du handelst.'}</span></div></section>
  <section class="dark row between"><div class="col" style="gap:2px"><span class="lbl">Entscheidungsqualität</span><span class="big" style="font-size:20px" id="qual" aria-live="polite">${qual}</span></div><div class="meter" aria-hidden="true">${[1,2,3,4].map(i=>`<span class="${chk.reason&&i<=score?'on':''}"></span>`).join('')}</div></section>
  <label class="switch"><span>24 Stunden drüber schlafen</span><input type="checkbox" id="sleep" ${chk.sleep?'checked':''}></label>
  <button type="button" class="btn solid" id="saveNote" ${chk.reason?'':'disabled'}>Entscheidungsnotiz speichern</button>
  <p class="hint center">Punkte gibt es für die Begründung, nicht für den Trade. Umsetzen kannst du nur bei deinem Broker.</p>`;
}
const tt0=()=>totals(D()).sum;
function sellCost(d,p){const s=secFor(d,p),te=taxEstimate(p,s);
  if(!te)return txModel(d)?'Steuer nicht schätzbar: Für diese Position fehlen vollständige Umsätze. Dazu die Ordergebühr.':'Steuer auf einen Gewinn hängt von deinem Kaufkurs ab; dafür braucht Depotfokus deine Umsätze. Dazu die Ordergebühr.';

  return `Bei Verkauf der ganzen Position: Kursgewinn rund ${eur(te.gain)}${te.tf?`, davon ${eur(te.taxable)} steuerpflichtig (Teilfreistellung 30 % für Aktienfonds)`:''}, Steuer rund ${eur(te.tax)} (26,375 %, ohne Kirchensteuer, vor Sparerpauschbetrag und Verlustverrechnung). Bei Teilverkauf zählen zuerst die ältesten Anteile. Dazu die Ordergebühr.`}

function allocHTML(){

function renderGoalSum2(){const d=D(),el=$('#goalSum');if(!el||!d.goals)return;const gs=goalState(d),sum=B.reduce((a,b)=>a+(d.goals[b.id]||0),0);

/* ---------------- Liga ---------------- */
/* Auflösungen offener Prognosen: wird ergänzt, sobald ein neuer Bericht geprüft ist. Schlüssel = Fragen-ID. */
const RESOLVED=RESOLVED_DATA;
const yesOf=r=>(r.type==='goal'&&r.status==='met')||(r.type==='risk'&&r.status==='occurred');
function questions(){const retro=[],open=[];
  D().positions.filter(hasStory).sort((a,b)=>posValue(b)-posValue(a)).forEach(p=>INFO[p.symbol].rules.filter(r=>r.status!=='np'&&r.status!=='open').forEach(r=>{
    retro.push({id:`r|${p.symbol}|${r.per}|${r.q}`,p,r,kind:'retro',outcome:yesOf(r)?1:0,
      text:`${r.per}: ${r.q.replace(/\?$/,'')}?`});
    open.push({id:`o|${p.symbol}|${r.next}|${r.q}`,p,r,kind:'open',text:r.q})}));
  return {retro,open}}
function score(pr,outcome){const p=(pr.c||70)/100,pj=pr.a==='ja'?p:1-p,b=(pj-outcome)**2;return {outcome,brier:b,hit:(pr.a==='ja')===(outcome===1),pts:Math.max(0,Math.round(20*(1-2*b)))}}
function resolveOpen(){let ch=false;Object.entries(FUN.preds).forEach(([id,pr])=>{const r=RESOLVED[id];if(r&&pr.a&&!pr.res){pr.res=score(pr,r.outcome);FUN.points+=pr.res.pts;ch=true}});if(ch)saveFun()}
function calib(){const res=Object.values(FUN.preds).filter(x=>x.res);if(!res.length)return null;
  const hits=res.filter(x=>x.res.hit).length,conf=res.reduce((a,x)=>a+(x.c||70),0)/res.length,brier=res.reduce((a,x)=>a+x.res.brier,0)/res.length;
  return {n:res.length,hits,conf,rate:hits/res.length*100,brier}}
function qButtons(q,pr,locked){return `<div class="grid2 yn" role="group" aria-label="Antwort">${['ja','nein'].map(a=>`<button type="button" data-pred="${esc(q.id)}" data-ans="${a}" aria-pressed="${pr.a===a}" ${locked?'disabled':''}>${a==='ja'?'Ja':'Nein'}</button>`).join('')}</div>
    <div class="conf-g" role="group" aria-label="Wie sicher bist du?">${[50,60,70,80,90].map(c=>`<button type="button" data-pred="${esc(q.id)}" data-conf="${c}" aria-pressed="${(pr.c||70)===c}" ${locked?'disabled':''}>${c} %</button>`).join('')}</div>`}
function vLiga(){
  resolveOpen();resolveTips();const {retro,open}=questions(),notes=FUN.notes.filter(n=>n.kind===D().kind),cb=calib();
  const last=FUN.lastRes&&FUN.preds[FUN.lastRes]&&FUN.preds[FUN.lastRes].res?retro.find(q=>q.id===FUN.lastRes):null;
  const next=retro.find(q=>!(FUN.preds[q.id]&&FUN.preds[q.id].res));const done=retro.filter(q=>FUN.preds[q.id]&&FUN.preds[q.id].res).length;
  let quiz;
  if(last){const pr=FUN.preds[last.id],r=last.r;quiz=`<section class="dark col" style="gap:10px"><span class="lbl">${esc(last.p.name)} · Rückblick</span><span class="h3" style="color:#fff">${esc(last.text)}</span>

  else if(next){const pr=FUN.preds[next.id]||{};quiz=`<section class="dark col" style="gap:10px"><div class="row between"><span class="lbl">${esc(next.p.name)} · Rückblick</span><span class="small muted-night">${done+1} von ${retro.length}</span></div>

function cronField(f,min,max){const out=new Set();String(f).split(',').forEach(part=>{let [r,st]=part.split('/');st=+st||1;let a=min,b=max;if(r!=='*'){const [x,y]=r.split('-').map(Number);a=x;b=y!=null?y:(part.includes('/')?max:x)}for(let v=a;v<=b;v+=st)out.add(v)});return out}
function cronNext(cron,from=new Date()){let best=null;
  String(cron||'').split('|').forEach(c=>{const m=c.trim().split(/\s+/);if(m.length<5)return;const M=cronField(m[0],0,59),H=cronField(m[1],0,23),W=cronField(m[4],0,6);
    const t=new Date(Math.floor(from.getTime()/6e4)*6e4+6e4);for(let i=0;i<8*1440;i++){const d=new Date(t.getTime()+i*6e4);if(M.has(d.getUTCMinutes())&&H.has(d.getUTCHours())&&W.has(d.getUTCDay())){if(!best||d<best)best=d;break}}});
  return best}

    Promise.all(fs.map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res([f.name,r.result]);r.onerror=()=>res([f.name,'']);r.readAsText(f)}))).then(list=>{handleFiles(list)});el.value='';return}
  if(el.id==='liveToggle'){UI.live=el.checked;saveUI();_txc.k=null;rerender();toast(el.checked?'Aktuelle Kurse werden verwendet':'Werte aus dem Export werden verwendet');return}
  if(el.dataset.acc!=null&&staged){staged.accounts[+el.dataset.acc].accept=el.checked;return}
  if(el.id==='stReplace'){$('#stAccept').disabled=!el.checked;return}
  if(el.dataset.bucket){const p=posById(el.dataset.bucket);if(p&&el.value){p.bucket=el.value;p.bucketSrc='user';changed()}return}
  if(el.dataset.exttype!=null){d.external.items[+el.dataset.exttype].type=el.value;changed();return}
  if(el.dataset.extval!=null){const v=parseInput(el.value);if(v==null||!(v>=0)){el.setAttribute('aria-invalid','true');return}d.external.items[+el.dataset.extval].value=v;changed();return}
  if(el.id==='reserve'){const v=parseInput(el.value);if(v!=null&&!(v>=0)){$('#resErr').textContent='Bitte einen Betrag ab 0 € eingeben.';return}d.external.reserve=v||0;changed();return}
});
document.addEventListener('input',e=>{
  const el=e.target,d=D();
  if(el.dataset.goal){const k=el.dataset.goal,v=parseInput(el.value);
    if(v==null||!Number.isFinite(v)||v<0||v>100){goalRaw[k]={v:el.value,msg:v==null?'Wert 0 bis 100 eingeben.':!Number.isFinite(v)?'Keine gültige Zahl.':v<0?'Nicht negativ.':'Höchstens 100.'};el.setAttribute('aria-invalid','true');$('#ge_'+k).textContent=goalRaw[k].msg}
    else{delete goalRaw[k];d.goals[k]=Math.round(v*100)/100;el.removeAttribute('aria-invalid');$('#ge_'+k).textContent=''}
    d.goalsSource='own';d.manual=null;renderGoalSum2();$('#allocBox').innerHTML=allocHTML();if(goalState(d).ok)persist();return}
  if(el.id==='budget'){const v=parseInput(el.value);
    if(v==null||!Number.isFinite(v)||v<0||v>1e7){budgetRaw=v==null?'Bitte einen Betrag eingeben, mindestens 0 €.':!Number.isFinite(v)?'Keine gültige Zahl.':v<0?'Nicht negativ.':'Höchstens 10 Mio. €.';el.setAttribute('aria-invalid','true')}
    else{budgetRaw=null;d.budget=Math.round(v*100)/100;el.removeAttribute('aria-invalid');persist()}
    $('#budgetErr').textContent=budgetRaw||'';$('#allocBox').innerHTML=allocHTML();return}
});
function handleFiles(list){let h=0,t=0,err=0;
  list.forEach(([name,text])=>{const a=analyzeCSV(text,name);if(a.kind==='transactions'){t++;stagedTx=stagedTx&&!stagedTx.error?mergeTx(stagedTx,a):a}else{h++;staged=a}if(a.error)err++});
  renderImport();toast(err?'Mindestens eine Datei ist nicht lesbar':`${h?'Bestand':''}${h&&t?' und ':''}${t?'Umsätze':''} geprüft, bitte kontrollieren`)}
function changed(){const d=D();evaluateChanges(d);persist();rerender()}

/* ---------------- Design: Hell, Dunkel oder wie das System ---------------- */
const darkMQ=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function isDark(){const t=UI.theme||'system';return t==='dark'||(t==='system'&&!!(darkMQ&&darkMQ.matches))}
function applyTheme(){const r=document.documentElement,t=UI.theme||'system';if(t==='system')delete r.dataset.theme;else r.dataset.theme=t;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',getComputedStyle(r).getPropertyValue('--ground').trim()||'#F5F6FA')}
function themeBtn(){const dk=isDark();return `<button type="button" class="icon-btn" id="themeToggle" aria-label="${dk?'Zu hellem Design wechseln':'Zu dunklem Design wechseln'}">${ICON.contrast}</button>`}
if(darkMQ&&darkMQ.addEventListener)darkMQ.addEventListener('change',()=>{if((UI.theme||'system')==='system'){applyTheme();rerender()}});
applyTheme();

/* Start */
evaluateChanges(DEMO,true);if(OWN&&OWN.baseline==null)evaluateChanges(OWN,true);
touchDay();saveFun();route();loadPrices();loadReports();

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
