<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Depotfokus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: eine Spalte, vier Bereiche (Überblick · Plan · Depot · Hinweise). Details klappen in derselben Karte auf. */
:root{
  --bg:#f8faf7; --surface:#ffffff; --surface-2:#f0f4f0; --line:#d6dfd8; --line-soft:#e8eee9;
  --fg:#17201a; --fg-2:#45554b; --fg-3:#69796f;
  --accent:#1c7047; --accent-soft:#e0f0e6; --accent-fg:#ffffff;
  --good:#127a37; --warn:#8f5c00; --crit:#b4322f; --info:#2a68b8;
  --demo:#7a4fb0; --demo-soft:#f1eafa;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7; --s7:#008300;
  --font:"Figtree", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#171e1a; --surface-2:#1f2823; --line:#33413a; --line-soft:#26302a;
  --fg:#eef3ef; --fg-2:#bccac1; --fg-3:#93a49a;
  --accent:#62c993; --accent-soft:#1d3427; --accent-fg:#0c1a12;
  --good:#5bd187; --warn:#f2b33d; --crit:#f08080; --info:#7fb0f0;
  --demo:#c3a2ee; --demo-soft:#2a2238;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; --s7:#3aa83a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#171e1a; --surface-2:#1f2823; --line:#33413a; --line-soft:#26302a;
  --fg:#eef3ef; --fg-2:#bccac1; --fg-3:#93a49a;
  --accent:#62c993; --accent-soft:#1d3427; --accent-fg:#0c1a12;
  --good:#5bd187; --warn:#f2b33d; --crit:#f08080; --info:#7fb0f0;
  --demo:#c3a2ee; --demo-soft:#2a2238;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9; --s7:#3aa83a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.015em;margin-right:auto}
.brand svg{width:24px;height:24px}
.brand b{color:var(--accent);font-weight:800}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;font:inherit;font-size:13.5px;font-weight:600;color:var(--fg-2);min-height:36px;padding:0 14px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.nav{display:flex;gap:4px}
.nav button{border:0;background:transparent;font:inherit;font-weight:600;color:var(--fg-2);min-height:44px;padding:0 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;position:relative}
.nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.nav svg{width:18px;height:18px;flex:none}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px}
@media (max-width:759px){
  .top .nav{display:none}
  .bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottom .nav{justify-content:space-around;padding:4px 6px}
  .bottom .nav button{flex-direction:column;gap:2px;font-size:11.5px;padding:4px 8px;min-width:64px}
  .bottom .badge{position:absolute;top:2px;right:8px}
  main{padding-bottom:96px!important}
}
@media (min-width:760px){.bottom{display:none}}

/* Quelle */
.srcbar{max-width:900px;margin:12px auto 0;padding-inline:16px}
.srcbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-radius:10px;font-size:13.5px}
.srcbar-in.demo{background:var(--demo-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--demo) 40%,transparent)}
.srcbar-in.own{background:var(--surface);border:1px solid var(--line)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:6px;white-space:nowrap}
.tag.demo{background:var(--demo);color:var(--surface)}
.tag.own{background:var(--accent-soft);color:var(--accent)}
.tag.ex{border:1px solid var(--demo);color:var(--demo)}

main{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
section[data-panel]{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{font-size:16.5px;font-weight:700;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;text-wrap:balance}
.card h3{font-size:14px;font-weight:700;margin:14px 0 6px}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.hint{font-size:13px;color:var(--fg-3)}
p{margin:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}

/* Vermögen */
.big{font-family:var(--mono);font-size:clamp(28px,7vw,38px);font-weight:500;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.big small{font-size:15px;font-family:var(--font);font-weight:600;color:var(--warn);letter-spacing:0}
.lines{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;margin-top:12px;font-size:14px}
.lines .v{font-family:var(--mono);text-align:right;white-space:nowrap}
.lines .muted{color:var(--fg-3)}
.lines .sum{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.empty{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;color:var(--fg-2);font-size:13.5px;background:var(--surface-2)}

/* Hinweisbanner */
.banner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:14px 16px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.banner .ic{font-weight:800;color:var(--warn);font-size:18px;line-height:1.2}
.banner .t{font-weight:700}

/* Listen */
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.item:last-child{border-bottom:0}
.item .t{font-weight:650;font-weight:600}
.item .d{font-size:13.5px;color:var(--fg-2)}
.mark{min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:1px}
.mark.warn{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.mark.crit{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.mark.info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.mark.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.mark.na{background:var(--surface-2);color:var(--fg-3);border:1px dashed var(--line)}
.grp{margin-top:6px}
.grp>.lbl{display:block;margin:12px 0 2px}
button.link{font:inherit;font-size:13.5px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:0 2px;min-height:44px;white-space:nowrap}
button.btn,label.btn{font:inherit;font-weight:700;font-size:14px;border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;gap:8px}
button.btn:hover,label.btn:hover{border-color:var(--accent);color:var(--accent)}
button.btn.primary,label.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.btn.primary:hover,label.btn.primary:hover{filter:brightness(1.07);color:var(--accent-fg)}
button.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
button:disabled{opacity:.5;cursor:not-allowed;filter:none!important}
label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}

details.more{margin-top:8px}
details.more>summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--accent);min-height:36px;display:flex;align-items:center;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸";display:inline-block;width:16px;transition:transform .15s}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more .body{padding:4px 0 2px 16px;font-size:13.5px;color:var(--fg-2);display:flex;flex-direction:column;gap:6px}
details.card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary h2{margin:0}
details.card>summary::after{content:"▸";color:var(--fg-3);transition:transform .15s}
details.card[open]>summary::after{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){details *::before,details>summary::after{transition:none}}

/* Formulare */
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--fg-2)}
input[type=text],input[type=number],input[type=date],select{font:inherit;font-size:15px;min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);min-width:0}
input.numin{font-family:var(--mono);text-align:right;width:96px}
input[aria-invalid="true"]{border-color:var(--crit);box-shadow:0 0 0 1px var(--crit)}
.err{font-size:12.5px;color:var(--crit);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* Plan */
.goal{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.goal:last-child{border-bottom:0}
.goal .now{font-size:12.5px;color:var(--fg-3);font-family:var(--mono)}
.goal .err{grid-column:2/-1}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.alloc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.alloc:last-child{border-bottom:0}
.alloc .why{grid-column:2/-1;font-size:12.5px;color:var(--fg-3)}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-2)}
.bar span{display:block;height:100%}
.barlab{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px;color:var(--fg-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--fg-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.result{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-size:14px;padding:10px 12px;background:var(--surface-2);border-radius:10px;margin-top:10px}
.result .v{font-family:var(--mono);text-align:right;font-weight:500}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
td.r,th.r{text-align:right}
td.nw{white-space:nowrap}

/* Depot */
.pos{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 12px;align-items:center;padding:10px 6px;border:0;border-bottom:1px solid var(--line-soft);cursor:pointer;width:100%;background:none;font:inherit;color:inherit;text-align:left;border-radius:8px;min-height:56px}
.pos:hover{background:var(--surface-2)}
.pos .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.pos .sub{grid-column:1/3;font-size:12.5px;color:var(--fg-3);min-width:0}
.pos .chev{grid-row:1/3;grid-column:3;color:var(--fg-3);font-size:18px}
.grph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 6px 4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.conf{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.conf:last-child{border-bottom:0}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stage{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ok{color:var(--good);font-weight:600}
.bad{color:var(--crit);font-weight:600}

/* Positionsdialog */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet-top .in{max-width:780px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;gap:10px}
.sheet-top h1{font-size:17px;margin:0;font-weight:800;min-width:0;overflow-wrap:anywhere;flex:1}
.sheet-body{max-width:780px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.kind{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:6px;padding:1px 7px;margin-right:6px;white-space:nowrap;vertical-align:1px}
.kind.metric{background:color-mix(in srgb,var(--info) 13%,transparent);color:var(--info)}
.kind.company{background:color-mix(in srgb,var(--s4) 20%,transparent);color:var(--warn)}
.kind.interp{background:var(--demo-soft);color:var(--demo)}
.fact{padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.fact:last-child{border-bottom:0}
.src{font-size:12.5px;color:var(--fg-3);margin-top:3px}
.rule{padding:12px 0;border-bottom:1px solid var(--line-soft)}
.rule:last-child{border-bottom:0}
.rule .q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;font-weight:600}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.st.yes{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.st.no{background:color-mix(in srgb,var(--crit) 13%,transparent);color:var(--crit)}
.st.open{background:var(--surface-2);color:var(--fg-2);border-color:var(--line)}
.st.np{background:transparent;color:var(--fg-3);border:1px dashed var(--line)}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:6px 0 0;font-size:13.5px}
dl.kv dt{color:var(--fg-3)}
dl.kv dd{margin:0;color:var(--fg-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (min-width:760px){.toast{bottom:28px}}
.note{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px;border-radius:10px;background:var(--surface-2);border:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.note+.note{margin-top:8px}
.note .meta{font-size:12px;color:var(--fg-3)}
.note .t{font-weight:700}
.note .b{font-size:13.5px;color:var(--fg-2);grid-column:1/-1}
.note.unread{box-shadow:inset 3px 0 0 var(--accent)}
.sw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.sw:last-of-type{border-bottom:0}
.toggle{appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{left:23px}
body.lock{overflow:hidden}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--accent)" stroke-width="2.2"/><circle cx="12" cy="12" r="5.2" fill="none" stroke="var(--accent)" stroke-width="2.2"/><circle cx="12" cy="12" r="1.8" fill="var(--accent)"/></svg><span>depot<b>fokus</b></span></div>
    <nav class="nav" aria-label="Bereiche" data-nav></nav>
    <div class="seg" role="group" aria-label="Darstellung">
      <button type="button" data-mode-btn="compact">Kompakt</button>
      <button type="button" data-mode-btn="details">Details</button>
    </div>
  </div>
</header>

<div class="srcbar" id="srcbar"></div>

<main id="main">
  <!-- ÜBERBLICK -->
  <section data-panel="home" aria-labelledby="h-home">
    <h1 id="h-home" class="sr-only">Überblick</h1>
    <div class="card" id="wealthCard"></div>
    <div id="incompleteBanner"></div>
    <div class="card"><h2>Jetzt wichtig</h2><div id="nowList"></div></div>
    <div class="card" id="checkCard"><h2>Depot-Check</h2><div id="checkBody"></div></div>
    <details class="card" id="payCard"><summary><h2>Ausschüttungen</h2></summary><div id="payBody" style="margin-top:10px"></div></details>
  </section>

  <!-- PLAN -->
  <section data-panel="plan" hidden aria-labelledby="h-plan">
    <h1 id="h-plan" class="sr-only">Plan</h1>
    <div class="card" id="goalCard"></div>
    <div class="card" id="budgetCard">
      <h2>2. Meine monatliche Einzahlung</h2>
      <div class="grid2">
        <label class="field" for="budget">Monatliche Einzahlung in €
          <input type="number" id="budget" inputmode="decimal" min="0" step="0.01" class="numin" style="width:140px" aria-describedby="budgetErr">
          <span class="err" id="budgetErr" role="alert"></span></label>
        <label class="field" for="cashMode">Verrechnungskonto
          <select id="cashMode">
            <option value="keep">bleibt unverändert als Liquidität</option>
            <option value="invest">wird einmalig mitverteilt</option>
            <option value="exclude">gehört nicht zur Zielverteilung</option>
          </select></label>
      </div>
      <label class="field" for="minRate" style="margin-top:12px;max-width:340px">Mindestbetrag je Baustein (Annahme)
        <select id="minRate"><option value="0">kein Mindestbetrag</option><option value="25">25 €</option><option value="50">50 €</option></select></label>
    </div>
    <div class="card" id="allocCard"></div>
    <details class="card more-card" id="explainCard"><summary><h2>4. So wird gerechnet</h2></summary><div id="explainBody" style="margin-top:10px"></div></details>
    <details class="card" id="tenCard"><summary><h2>Rechenbeispiel über 10 Jahre <span class="hint">optional</span></h2></summary><div id="tenBody" style="margin-top:10px"></div></details>
  </section>

  <!-- DEPOT -->
  <section data-panel="depot" hidden aria-labelledby="h-depot">

function parseNum(s){s=String(s??'').replace(/["€\s ]|EUR/gi,'');if(!s)return NaN;if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(s.includes(','))s=s.replace(',','.');if(!/^-?\d*\.?\d+(e-?\d+)?$/i.test(s))return NaN;return parseFloat(s)}

/* =========================================================
   CSV-PARSER (prüft zuerst, übernimmt nichts)
   ========================================================= */
function splitL(l,d){const o=[];let c='',q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===d&&!q){o.push(c);c='';continue}c+=ch}o.push(c);return o.map(x=>x.trim())}
function analyzeCSV(text,fileName){
  const st={fileName,error:null,cols:{},positions:[],accounts:[],skipped:[],fileSum:null,kind:'holdings'};
  const lines=String(text||'').replace(/^﻿/,'').split(/\r?\n/);
  const nonEmpty=lines.map((l,i)=>({l,i:i+1})).filter(x=>x.l.trim());
  if(nonEmpty.length<2){st.error='Die Datei enthält keine Kopfzeile mit Daten.';return st}
  const h=nonEmpty[0].l;const d=[';','\t',','].sort((a,b)=>h.split(b).length-h.split(a).length)[0];
  const head=splitL(h,d);const low=head.map(x=>x.toLowerCase());const col=re=>low.findIndex(x=>re.test(x));
  if(col(/^datum|^date/)>=0&&col(/^typ|^type/)>=0){st.kind='transactions';st.error='Das ist ein Umsatz-Export. Umsätze kann Depotfokus noch nicht verarbeiten; dein Bestand bleibt unverändert.';return st}
  const ci={name:col(/^name$|bezeichnung|wertpapier/),value:col(/marktwert|kurswert|^wert$/),qty:col(/^bestand|stück|anzahl|shares/),symbol:col(/symbol|ticker/),price:col(/^kurs$|preis|price/),isin:col(/isin/)};
  Object.entries(ci).forEach(([k,i])=>{if(i>=0)st.cols[k]=head[i]});
  if(ci.name<0||ci.value<0){st.error='Spalten „Name“ und „Marktwert“ nicht gefunden. Erwartet wird die Vermögensaufstellung aus Portfolio Performance.';return st}
  nonEmpty.slice(1).forEach(({l,i})=>{
    const r=splitL(l,d);const name=(r[ci.name]||'').trim();const v=parseNum(r[ci.value]);
    if(!name){st.skipped.push({line:i,reason:'kein Name'});return}
    if(/^summe|^gesamt|^total/i.test(name)){if(Number.isFinite(v)&&st.fileSum==null)st.fileSum=v;st.skipped.push({line:i,reason:`Summenzeile „${name}“`});return}
    if(!Number.isFinite(v)){st.skipped.push({line:i,reason:`„${name}“: Marktwert nicht lesbar`});return}
    if(v<0){st.skipped.push({line:i,reason:`„${name}“: negativer Marktwert`});return}
    const qty=ci.qty>=0?parseNum(r[ci.qty]):NaN,sym=ci.symbol>=0?(r[ci.symbol]||'').trim():'',price=ci.price>=0?parseNum(r[ci.price]):NaN,isin=ci.isin>=0?(r[ci.isin]||'').trim():'';
    if(!Number.isFinite(qty)&&!sym&&!isin){st.accounts.push({name,value:v,line:i,accept:false});return}
    const m=STAMM[sym]||null;
    /* Kurswährung: deutscher Börsenplatz (.DE/.F) → Euro; sonst unbekannt */
    const priceCcy=/\.(DE|F|DU|MU|HM|SG|BE)$/i.test(sym)?'EUR':null;
    st.positions.push({id:sym||isin||name,name,symbol:sym,isin:isin||null,qty:Number.isFinite(qty)?qty:null,price:Number.isFinite(price)?price:null,priceCcy,
      exportValue:v,valueStatus:priceCcy?'ok':'unclear',conf:null,manualValue:null,bucket:m?m.bucket:null,bucketSrc:m?'stamm':null,fund:m?m.fund:null,ter:m&&m.ter!=null?m.ter:null});
  });
  if(!st.positions.length&&!st.accounts.length)st.error='Keine gültigen Zeilen gefunden. Prüfe, ob die Spalte Marktwert Beträge enthält.';
  return st;
}

function posValue(p){if(p.conf==='skip')return null;if(p.conf==='manual')return p.manualValue;if(p.valueStatus==='ok'||p.conf==='eur')return p.exportValue;return null}
function isIncluded(p){return posValue(p)!=null}
function unresolved(d){return d.positions.filter(p=>p.valueStatus==='unclear'&&!p.conf)}
function noBucket(d){return d.positions.filter(p=>isIncluded(p)&&!p.bucket)}
function totals(d){
  const sec=d.positions.reduce((a,p)=>a+(isIncluded(p)?posValue(p):0),0);
  const acct=d.accounts.reduce((a,x)=>a+x.value,0);
  const ext=d.external.items.reduce((a,x)=>a+(+x.value||0),0);
  return {sec,acct,ext,reserve:+d.external.reserve||0,sum:sec+acct+ext,open:unresolved(d).length,skipped:d.positions.filter(p=>p.conf==='skip').length};
}
/* Bausteinwerte für Zielvergleich und Plan. Verrechnungskonto je nach Einstellung. */
function bucketVals(d,cashMode=d.cashMode){
  const V={};B.forEach(b=>V[b.id]=0);
  d.positions.forEach(p=>{if(isIncluded(p)&&p.bucket)V[p.bucket]+=posValue(p)});
  if(cashMode!=='exclude')V.liq+=d.accounts.reduce((a,x)=>a+x.value,0);
  d.external.items.forEach(x=>{const v=+x.value||0;if(x.type==='bonds')V.bonds+=v;else V.liq+=v});
  return V;
}
const tot=V=>Object.values(V).reduce((a,b)=>a+b,0);
function goalState(d){
  if(!d.goals)return {ok:false,reason:'none'};
  const bad=B.filter(b=>goalRaw[b.id]!=null);
  if(bad.length)return {ok:false,reason:'invalid',fields:bad.map(b=>b.id)};
  const sum=B.reduce((a,b)=>a+(d.goals[b.id]||0),0);
  if(Math.abs(sum-100)>0.05)return {ok:false,reason:'sum',sum};
  return {ok:true,sum};
}
function budgetState(d){if(budgetRaw!=null)return {ok:false,msg:budgetRaw};return {ok:true}}
/* Verteilung auf Bausteine, centgenau */
function allocate(d){
  const gs=goalState(d),bs=budgetState(d);if(!gs.ok||!bs.ok)return null;
  const V=bucketVals(d,d.cashMode==='invest'?'exclude':d.cashMode);
  const cash=d.cashMode==='invest'?d.accounts.reduce((a,x)=>a+x.value,0):0;
  const T=tot(V)+cash,Mc=Math.round((+d.budget||0)*100);
  const t={};B.forEach(b=>t[b.id]=(d.goals[b.id]||0)/100);
  let Ts=T;B.forEach(b=>{if(t[b.id]>0)Ts=Math.max(Ts,V[b.id]/t[b.id])});
  const need={};let ns=0;B.forEach(b=>{need[b.id]=Math.max(0,t[b.id]*Ts-V[b.id]);ns+=need[b.id]});
  const weights={};B.forEach(b=>weights[b.id]=ns>0?need[b.id]/ns:t[b.id]);
  const out={};let used=0;const rem=[];
  B.forEach(b=>{const raw=Mc*weights[b.id];out[b.id]=Math.floor(raw);used+=out[b.id];rem.push([b.id,raw-out[b.id]])});
  rem.sort((a,c)=>c[1]-a[1]);for(let i=0;i<Mc-used;i++)out[rem[i%rem.length][0]]++;
  const moves=[];const minC=(+d.minRate||0)*100;
  if(minC>0){const big=B.reduce((a,b)=>need[b.id]>need[a.id]?b:a,B[0]).id;
    B.forEach(b=>{if(b.id!==big&&out[b.id]>0&&out[b.id]<minC){moves.push({from:b.id,to:big,c:out[b.id]});out[big]+=out[b.id];out[b.id]=0}})}
  const amounts={};B.forEach(b=>amounts[b.id]=out[b.id]/100);
  return {V,T,cash,Ts,need,amounts,moves,ns};
}
function chosenAmounts(d,al){if(d.manual){const m={};B.forEach(b=>m[b.id]=Math.max(0,+d.manual[b.id]||0));return m}return al.amounts}
/* Pfad bei unveränderten Kursen */
function pathFor(d,al,amounts){
  const t={};B.forEach(b=>t[b.id]=(d.goals[b.id]||0)/100);
  const V={...al.V};
  if(al.cash>0){const tmpNs=al.ns||1;B.forEach(b=>V[b.id]+=al.cash*(al.ns>0?al.need[b.id]/tmpNs:t[b.id]))}
  const blocked=B.filter(b=>t[b.id]===0&&V[b.id]>0.5);
  const M=B.reduce((a,b)=>a+amounts[b.id],0);
  const tol=0.01;
  const dev=()=>{const T=tot(V);return T>0?Math.max(...B.map(b=>Math.abs(V[b.id]/T-t[b.id]))):1};
  let theo=null;
  if(!blocked.length){const T=tot(V);let Ts=T;B.forEach(b=>{if(t[b.id]>0)Ts=Math.max(Ts,V[b.id]/t[b.id])});const need=Ts-T;const Mb=+d.budget||0;theo=need<0.5?0:(Mb>0?Math.ceil(need/Mb):null)}
  if(blocked.length)return {blocked,theo:null,months:null};
  if(dev()<=tol)return {blocked:[],theo:0,months:0};
  if(M<=0)return {blocked:[],theo,months:null};
  for(let m=1;m<=600;m++){B.forEach(b=>V[b.id]+=amounts[b.id]);if(dev()<=tol)return {blocked:[],theo,months:m}}
  return {blocked:[],theo,months:Infinity};
}

    const eqA=T?B.filter(b=>b.eq).reduce((a,b)=>a+V[b.id],0)/T:0,eqG=B.filter(b=>b.eq).reduce((a,b)=>a+d.goals[b.id],0)/100;

  const checked=d.positions.filter(p=>isIncluded(p)&&PAY[p.symbol]&&PAY[p.symbol].cover);const notMet=checked.filter(p=>PAY[p.symbol].cover==='not_met');
  if(checked.length)out.info.push({key:'divcheck',lvl:'info',t:'Geprüfte Ausschüttungsdeckung',d:`${checked.length} Positionen mit hinterlegter Prüfung. ${notMet.length?`Nicht erfüllt: ${notMet.map(p=>p.name).join(', ')}.`:'Bei allen geprüften erfüllt.'} Für alle übrigen Positionen nicht geprüft.`,go:notMet.length?['pos',notMet[0].id]:null,act:notMet.length?'Position ansehen':null});

function nowItems(d){
  const c=checkModel(d),items=[];
  c.data.filter(x=>x.lvl==='warn').forEach(x=>items.push(x));

  d.positions.filter(isIncluded).forEach(p=>{const I=INFO[p.symbol];if(!I||!I.rules)return;I.rules.forEach(r=>{if((r.type==='goal'&&r.status==='not_met')||(r.type==='risk'&&r.status==='occurred'))items.push({key:'rule-'+p.id,lvl:'warn',t:`${p.name}: ${r.q.replace(/\?$/,'')}`,d:`${STATUS[r.type][r.status]} für ${r.per} (${r.obs}). Kein Kauf- oder Verkaufssignal.`,go:['pos',p.id],act:'Einordnung ansehen'})})});
  return items.slice(0,3);
}

function evaluateChanges(d,first){
  const keys=checkModel(d).dev.filter(x=>x.lvl==='crit').map(x=>x.key).concat(unresolved(d).length?['open']:[]);
  if(d.baseline==null||first){d.baseline=keys;return}
  const added=keys.filter(k=>!d.baseline.includes(k));
  if(added.length&&d.notify.change){const c=checkModel(d);const all=[...c.dev,...c.data];
    added.forEach(k=>{const it=all.find(x=>x.key===k);if(it)addEvent(d,{t:it.t,b:it.d,go:it.go})})}
  d.baseline=keys;
}

function renderTen(al,am){

  const V={...al.V};const g={},y={};B.forEach(b=>{g[b.id]=Math.pow(1+ASSUME[b.id][0]/100,1/12)-1;y[b.id]=ASSUME[b.id][1]/100/12});

   <div class="sw"><label for="nChange"><div style="font-weight:700">Wesentliche Änderungen</div><div class="hint">Neue deutliche Abweichung von deinen Vorgaben oder neue offene Datenfrage. Ein unveränderter Zustand erzeugt keinen neuen Hinweis.</div></label><input type="checkbox" class="toggle" id="nChange" data-notify="change" ${n.change?'checked':''}></div>
   <div class="sw"><label for="nMonth"><div style="font-weight:700">Monatsbrief</div><div class="hint">Einmal im Monat eine Zusammenfassung.</div></label><input type="checkbox" class="toggle" id="nMonth" data-notify="month" ${n.month?'checked':''}></div>
   <div class="sw"><label for="nPay"><div style="font-weight:700">Angekündigte Ausschüttungen</div><div class="hint">Nur für Positionen mit hinterlegter Prüfung.</div></label><input type="checkbox" class="toggle" id="nPay" data-notify="pay" ${n.pay?'checked':''}></div>
   <div class="grid2" style="margin-top:12px">
    <label class="field" for="nChan">Kanal<select id="nChan" data-notifysel="channel"><option value="push" ${n.channel==='push'?'selected':''}>Push</option><option value="mail" ${n.channel==='mail'?'selected':''}>E-Mail</option><option value="both" ${n.channel==='both'?'selected':''}>Push und E-Mail</option></select></label>
    <label class="field" for="nFreq">Höchstens<select id="nFreq" data-notifysel="freq"><option value="weekly" ${n.freq==='weekly'?'selected':''}>ein Hinweis pro Woche</option><option value="daily" ${n.freq==='daily'?'selected':''}>ein Hinweis pro Tag</option><option value="all" ${n.freq==='all'?'selected':''}>ohne Begrenzung</option></select></label></div>
   <p class="hint" style="margin-top:10px">Mockup: Es werden keine Push-Nachrichten oder E-Mails versendet. Hinweise erscheinen nur in diesem Verlauf.</p>`;
  $('#previewList').innerHTML=`<p class="hint">So könnten Hinweise aussehen. Diese Beispiele sind nicht eingetreten.</p>
   <div class="note" style="cursor:default;margin-top:8px"><span class="meta">Beispiel · Wesentliche Änderung</span><span></span><span class="t" style="grid-column:1/-1">Ares Capital: Bedingung „Kernerträge decken die Dividende“ für Q3 2026 ausgewertet</span><span class="b">Würde erst erscheinen, wenn der Q3-Bericht veröffentlicht und geprüft ist.</span></div>
   <div class="note" style="cursor:default"><span class="meta">Beispiel · Monatsbrief</span><span></span><span class="t" style="grid-column:1/-1">Dein Monat in drei Zeilen</span><span class="b">Angekündigte Ausschüttungen, Abstand zu deinen Vorgaben, offene Datenfragen.</span></div>`;
}

/* =========================================================
   EREIGNISSE
   ========================================================= */
function renderAll(){renderSource();renderNav();renderHome();renderGoals();renderBudget();renderAlloc();renderConfirm();renderPositions();renderExt();renderImport();renderSourceCard();renderNotes();applyModeDetailsOnly();if(!$('#sheet').hidden)renderSheet()}
function applyModeDetailsOnly(){document.querySelectorAll('[data-mode-btn]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.modeBtn===UI.mode)))}
function changed(){const d=D();evaluateChanges(d);persist();renderAll()}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){setTab(t.dataset.tab);return}
  const m=e.target.closest('[data-mode-btn]');if(m){UI.mode=m.dataset.modeBtn;saveUI();applyMode();toast(UI.mode==='details'?'Details eingeblendet':'Kompakte Ansicht');return}
  const g=e.target.closest('[data-go]');if(g){goTo(g.dataset.go.split('|'));return}
  const ps=e.target.closest('[data-pos]');if(ps){openSheet(ps.dataset.pos);return}
  const src=e.target.closest('[data-src]');if(src){UI.source=src.dataset.src;saveUI();goalRaw={};budgetRaw=null;renderAll();toast(UI.source==='demo'?'Demodepot wird angezeigt':'Dein Depot wird angezeigt');return}
  const cf=e.target.closest('[data-conf]');if(cf){const [id,how]=cf.dataset.conf.split('|');const p=D().positions.find(x=>x.id===id);if(!p)return;
    if(how==='manual'){const box=document.getElementById('mv_'+id);box.hidden=false;document.getElementById('mvi_'+id).focus();return}
    p.conf=how;changed();toast(how==='eur'?`${p.name} wird eingerechnet`:`${p.name} wird nicht eingerechnet`);return}
  const cs=e.target.closest('[data-confsave]');if(cs){const id=cs.dataset.confsave;const p=D().positions.find(x=>x.id===id);const v=parseInput(document.getElementById('mvi_'+id).value);
    if(!(v>=0)||v>1e9){document.getElementById('mve_'+id).textContent='Bitte einen Betrag ab 0 € eingeben.';return}p.conf='manual';p.manualValue=v;changed();toast(`${p.name}: ${eur(v,2)} übernommen`);return}
  if(e.target.closest('[data-unskip]')){D().positions.forEach(p=>{if(p.conf==='skip')p.conf=null});changed();return}
  const ev=e.target.closest('[data-ev]');if(ev){const d=D();if(!d.read.includes(ev.dataset.ev))d.read.push(ev.dataset.ev);persist();renderNav();renderNotes();const x=d.events.find(y=>y.id===ev.dataset.ev);if(x&&x.go)goTo(x.go);return}
  if(e.target.closest('#goalsFromNow')){const d=D(),V=bucketVals(d),T=tot(V);if(!T){toast('Ohne Bestand gibt es keine heutige Verteilung.');return}const g={};B.forEach(b=>g[b.id]=Math.round(V[b.id]/T*1000)/10);
    const diff=Math.round((100-B.reduce((a,b)=>a+g[b.id],0))*10)/10;const big=B.reduce((a,b)=>g[b.id]>g[a.id]?b:a,B[0]);g[big.id]=Math.round((g[big.id]+diff)*10)/10;
    d.goals=g;d.goalsSource='current';goalRaw={};changed();toast('Heutige Verteilung als Ausgangspunkt übernommen');return}
  if(e.target.closest('#goalsEmpty')){const d=D();d.goals=Object.fromEntries(B.map(b=>[b.id,0]));d.goalsSource='own';goalRaw={};changed();goTo(['plan','g_core']);return}
  if(e.target.closest('#btnCopy')){const d=D(),al=allocate(d);if(!al)return;const am=chosenAmounts(d,al);
    const txt=['Depotfokus · rechnerische Verteilung meiner monatlichen Einzahlung',...B.filter(b=>am[b.id]>0).map(b=>`${eur(am[b.id],2)} → ${b.name} (Ziel ${fz(d.goals[b.id])} %)`),'Annahme: unveränderte Kurse. Keine Produktauswahl.'].join('\n');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Verteilung kopiert')).catch(()=>toast('Kopieren nicht möglich. Bitte die Beträge abschreiben.'));return}
  if(e.target.closest('#extAdd')){D().external.items.push({type:'tagesgeld',value:0});changed();return}
  const xd=e.target.closest('[data-extdel]');if(xd){D().external.items.splice(+xd.dataset.extdel,1);changed();return}
  if(e.target.closest('#stDiscard')){staged=null;renderImport();toast('Import verworfen');return}
  if(e.target.closest('#stAccept')){acceptImport();return}
  if(e.target.closest('#delAsk')){pendingDelete=true;renderSourceCard();$('#delConfirm').focus();return}
  if(e.target.closest('#delCancel')){pendingDelete=false;renderSourceCard();return}
  if(e.target.closest('#delConfirm')){store(OWN_KEY,null);OWN=null;pendingDelete=false;UI.source='demo';saveUI();renderAll();toast('Eigene Daten auf diesem Gerät gelöscht');return}
});
document.addEventListener('change',e=>{
  const el=e.target,d=D();
  if(el.id==='file'){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{staged=analyzeCSV(r.result,f.name);renderImport();$('#importCard').focus();toast(staged.error?'Import nicht möglich':'Datei geprüft, bitte kontrollieren')};r.readAsText(f);el.value='';return}
  if(el.dataset.acc!=null&&staged){staged.accounts[+el.dataset.acc].accept=el.checked;return}
  if(el.id==='stReplace'){$('#stAccept').disabled=!el.checked;return}
  if(el.dataset.bucket){const p=d.positions.find(x=>x.id===el.dataset.bucket);if(p&&el.value){p.bucket=el.value;p.bucketSrc='user';changed();toast(`${p.name}: Baustein ${BN[el.value].name}`)}return}
  if(el.id==='cashMode'){d.cashMode=el.value;changed();return}
  if(el.id==='minRate'){d.minRate=+el.value;changed();return}
  if(el.id==='manualToggle'){if(el.checked){const al=allocate(d);d.manual={...al.amounts}}else d.manual=null;changed();return}
  if(el.dataset.exttype!=null){d.external.items[+el.dataset.exttype].type=el.value;changed();return}
  if(el.dataset.notify){d.notify[el.dataset.notify]=el.checked;persist();return}
  if(el.dataset.notifysel){d.notify[el.dataset.notifysel]=el.value;persist();return}
  if(el.id==='netToggle'){UI.net=el.checked;saveUI();renderPay();return}
  if(el.dataset.extval!=null){const v=parseInput(el.value);if(v==null||!(v>=0)){el.setAttribute('aria-invalid','true');toast('Bitte einen Betrag ab 0 € eingeben.');return}d.external.items[+el.dataset.extval].value=v;changed();return}
  if(el.id==='reserve'){const v=parseInput(el.value);if(v!=null&&!(v>=0)){$('#resErr').textContent='Bitte einen Betrag ab 0 € eingeben.';el.setAttribute('aria-invalid','true');return}d.external.reserve=v||0;changed();return}
  if(el.id==='maxSingle'){const v=parseInput(el.value);if(v!=null&&!(v>0&&v<=100)){$('#maxErr').textContent='Bitte einen Wert über 0 und höchstens 100 eingeben oder leer lassen.';el.setAttribute('aria-invalid','true');return}d.maxSingle=v;changed();return}
});
document.addEventListener('input',e=>{
  const el=e.target,d=D();
  if(el.dataset.goal){const k=el.dataset.goal,v=parseInput(el.value);
    if(v==null||!Number.isFinite(v)||v<0||v>100){goalRaw[k]={v:el.value,msg:v==null?'Bitte einen Wert eingeben (0 bis 100).':!Number.isFinite(v)?'Keine gültige Zahl.':v<0?'Nicht negativ.':'Höchstens 100.'};el.setAttribute('aria-invalid','true');$('#ge_'+k).textContent=goalRaw[k].msg}
    else{delete goalRaw[k];d.goals[k]=Math.round(v*100)/100;el.removeAttribute('aria-invalid');$('#ge_'+k).textContent=''}
    if(d.goalsSource!=='own'){d.goalsSource='own'}
    d.manual=null;renderGoalSum();renderAlloc();renderHome();renderNav();if(goalState(d).ok){evaluateChanges(d);persist()}return}
  if(el.id==='budget'){const v=parseInput(el.value);
    if(v==null||!Number.isFinite(v)||v<0||v>1e7){budgetRaw=v==null?'Bitte einen Betrag eingeben, mindestens 0 €.':!Number.isFinite(v)?'Keine gültige Zahl.':v<0?'Der Betrag darf nicht negativ sein.':'Höchstens 10 Mio. €.';el.setAttribute('aria-invalid','true')}
    else{budgetRaw=null;d.budget=Math.round(v*100)/100;el.removeAttribute('aria-invalid');d.manual=null;persist()}
    $('#budgetErr').textContent=budgetRaw||'';renderAlloc();return}
  if(el.dataset.manual){const v=parseInput(el.value);if(v==null||!Number.isFinite(v)||v<0){el.setAttribute('aria-invalid','true');return}el.removeAttribute('aria-invalid');d.manual[el.dataset.manual]=Math.round(v*100)/100;persist();
    const keep=el.id;renderAlloc();const n=document.getElementById(keep);if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch(_){}}return}
});

function acceptImport(){
  const s=staged;if(!s||s.error)return;
  const prev=OWN;const d=newDepot('own');
  d.fileName=s.fileName;d.importedAt=nowStr();
  const dt=$('#stDate')&&$('#stDate').value;d.valuationDate=dt?dt.split('-').reverse().join('.'):null;
  d.positions=s.positions.map(p=>({...p}));d.accounts=s.accounts.filter(a=>a.accept).map(a=>({name:a.name,value:a.value}));
  if(prev){// Ziele, Bestätigungen, Einstellungen erhalten
    d.goals=prev.goals;d.goalsSource=prev.goalsSource;d.maxSingle=prev.maxSingle;d.budget=prev.budget;d.cashMode=prev.cashMode;d.minRate=prev.minRate;d.external=prev.external;d.notify=prev.notify;d.events=prev.events;d.read=prev.read;d.baseline=prev.baseline;
    d.positions.forEach(p=>{const o=prev.positions.find(x=>x.id===p.id);if(o){if(o.conf&&p.valueStatus==='unclear'&&o.exportValue===p.exportValue){p.conf=o.conf;p.manualValue=o.manualValue}if(!p.bucket&&o.bucket){p.bucket=o.bucket;p.bucketSrc=o.bucketSrc}}});
  }
  OWN=d;UI.source='own';saveUI();staged=null;
  addEvent(d,{t:`Bestand importiert: ${d.fileName}`,b:`${d.positions.length} Wertpapiere, ${d.accounts.length} Konten. ${unresolved(d).length?unresolved(d).length+' Zuordnungen offen.':'Keine offenen Zuordnungen.'}`,go:unresolved(d).length?['depot','confirmCard']:['home','wealthCard']});
  evaluateChanges(d,!prev);persist();renderAll();toast('Import übernommen');setTab('home');
}

/* Start */
evaluateChanges(DEMO,true);if(OWN&&OWN.baseline==null)evaluateChanges(OWN,true);
setTab(UI.tab in {home:1,plan:1,depot:1,notes:1}?UI.tab:'home',true);
renderAll();applyMode();
</script>
