name: Szenario-Probe (temporär)
on:
  push:
    branches: ['claude/szenario-monitor']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/scenario-test.mjs > test.log 2>&1 || true
      - run: |
          mkdir -p /tmp/probe && cp data/scenarios/*.json /tmp/probe/
          SCEN_DIR=/tmp/probe node scripts/scenario-run.mjs > run.log 2>&1 || echo "EXIT $?" >> run.log
          mkdir -p out && cp -r /tmp/probe out/data && mv test.log run.log out/
          cd out && git init -q && git checkout -q -b probe-output && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm "probe ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" probe-output
