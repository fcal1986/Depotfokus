name: Szenario-Probe (temporär)
on:
  push:
    branches: ['claude/szenario-monitor']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/scenario-test.mjs
      - run: node scripts/scenario-run.mjs
        env:
          SCEN_DRY: '1'
