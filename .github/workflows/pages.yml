name: GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Werktags nach US-Börsenschluss: Tageskurse aktualisieren
    - cron: '37 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Seite zusammenstellen
        run: |
          python3 scripts/build.py
          mkdir -p _site/app
          cp index.html .nojekyll manifest.webmanifest icon.svg icon-180.png icon-512.png sw.js _site/
          cp app/index.html _site/app/
      - name: Tageskurse abrufen
        continue-on-error: true
        run: node scripts/fetch-prices.mjs _site/prices.json
      - name: Neue Berichte erkennen (SEC EDGAR)
        continue-on-error: true
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          MODEL: ${{ vars.DEPOTFOKUS_MODEL || 'claude-sonnet-5-5' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: node scripts/check-reports.mjs _site/reports.json
      - name: Kursdatei sicherstellen
        run: |
          test -f _site/prices.json || echo '{"asOf":null,"quotes":{},"fx":{},"missing":[]}' > _site/prices.json
          test -f _site/reports.json || echo '{"checkedAt":null,"positions":{},"proposals":[],"errors":{"all":"Abruf fehlgeschlagen"}}' > _site/reports.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
