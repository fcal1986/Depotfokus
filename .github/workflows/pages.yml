name: GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Während der Handelszeit alle 15 Minuten (UTC 6–20 Uhr, Tradegate 8–22 Uhr deutscher Zeit)
    - cron: '*/15 6-20 * * 1-5'
    # Schlusskurse nach US-Börsenschluss
    - cron: '37 21 * * 1-5'
  workflow_dispatch:
    inputs:
      dividenden_neu:
        description: 'Dividenden jetzt neu abrufen (sonst höchstens einmal am Tag)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Seite zusammenstellen
        run: |
          python3 scripts/build.py
          mkdir -p _site/app
          cp index.html .nojekyll manifest.webmanifest icon.svg icon-180.png icon-512.png sw.js _site/
          cp app/index.html _site/app/
          # Szenario-Monitor: Wochenstände für die Detailansicht (relativ, passend zum Pages-Unterpfad)
          mkdir -p _site/data/scenarios/snapshots
          cp data/scenarios/*.json _site/data/scenarios/ 2>/dev/null || true
          cp data/scenarios/snapshots/*.json _site/data/scenarios/snapshots/ 2>/dev/null || true
      - name: Tageskurse abrufen
        continue-on-error: true
        run: node scripts/fetch-prices.mjs _site/prices.json
      - name: Dividenden, letzter Stand
        uses: actions/cache/restore@v4
        with:
          path: .divcache
          key: dividends-v3-${{ github.run_id }}
          restore-keys: dividends-v3-
      - name: Dividenden abrufen (stockanalysis.com, Nasdaq, Yahoo; je Lauf die acht ältesten)
        continue-on-error: true
        timeout-minutes: 4
        env:
          DIV_BATCH: ${{ github.event.inputs.dividenden_neu == 'true' && '17' || '8' }}
        run: |
          mkdir -p .divcache
          [ "${{ github.event.inputs.dividenden_neu }}" = "true" ] && rm -f .divcache/dividends.json
          node scripts/fetch-dividends.mjs .divcache/dividends.json
      - name: Dividenden merken
        if: hashFiles('.divcache/dividends.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .divcache
          key: dividends-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Dividenden veröffentlichen
        run: |
          if [ -f .divcache/dividends.json ]; then cp .divcache/dividends.json _site/dividends.json; else echo '{"asOf":null,"items":{},"missing":[],"errors":{"all":"Abruf fehlgeschlagen"}}' > _site/dividends.json; fi
      - name: Neue Berichte erkennen (SEC EDGAR)
        continue-on-error: true
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          MODEL: ${{ vars.DEPOTFOKUS_MODEL || 'claude-sonnet-5-5' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT }}
        run: node scripts/check-reports.mjs _site/reports.json
      - name: Kursdatei sicherstellen
        run: |
          test -f _site/prices.json || echo '{"asOf":null,"quotes":{},"fx":{},"missing":[]}' > _site/prices.json
          test -f _site/reports.json || echo '{"checkedAt":null,"positions":{},"proposals":[],"errors":{"all":"Abruf fehlgeschlagen"}}' > _site/reports.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
