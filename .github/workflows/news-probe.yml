name: Nachrichten-Probe (temporär)
on:
  push:
    branches: ['claude/nachrichten']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          mkdir -p out
          HAS_KEY='${{ secrets.ANTHROPIC_API_KEY != '' }}' node scripts/news-probe.mjs > out/probe.log 2>&1 || true
          [ -f scripts/news-test.mjs ] && node --test scripts/news-test.mjs > out/test.log 2>&1 || true
          if [ -f scripts/news-run.mjs ]; then mkdir -p /tmp/n && cp -r data/news/. /tmp/n/ && NEWS_DIR=/tmp/n MODEL='${{ vars.DEPOTFOKUS_MODEL || 'claude-sonnet-5-5' }}' ANTHROPIC_API_KEY='${{ secrets.ANTHROPIC_API_KEY }}' node scripts/news-run.mjs > out/run.log 2>&1 || echo "EXIT $?" >> out/run.log; cp -r /tmp/n out/data; fi
          cd out && git init -q && git checkout -q -b probe-output && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm "probe ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" probe-output
